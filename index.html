MOD({n:23,id:'m23',t:'Future of Software-Defined Vehicles',s:'What is in production, what is emerging, and what is speculation',mins:40,
intro:`<p>This module separates three things carefully: technology already in production ${B.est}, emerging technology in early deployment or active development ${B.em}, and longer-range speculation ${B.sp}.</p>`,
sec:[
{h:'Compute and architecture',b:tbl(['Topic','Status','Notes'],[
['Centralised vehicle computing',B.est,'In production (e.g., Tesla); spreading (GM 2028 announced)'],
['Zonal architectures',B.est,'Rivian Gen 2, BMW Neue Klasse, Ford UEV (planned 2027), RV Tech'],
['Next-gen zonal (T1S edges, smart actuators, 48 V LV)',B.em,'Tesla Cybertruck 48 V; Ford UEV plans 48 V; 10BASE-T1S adoption growing'],
['Single-SoC cockpit + ADAS',B.em,'Offered by chip vendors; selective production use'],
['Chiplets and upgradable compute modules',B.em,'Plug-in compute upgrades; GM says it will refresh chips on a roughly two-year cadence for its platform'],
['Fully hardware-agnostic vehicle software',B.sp,'Abstraction improves, but full portability across vendors remains aspirational'],
])+src([['CarExpert (GM chip cadence)','https://www.carexpert.com.au/car-news/gms-next-gen-brain-coming-to-petrol-suvs-and-utes-and-itll-get-new-chips-every-two-years'],['Ford UEV (GreenCars)','https://www.greencars.com/news/fords-30k-ev-pickup-aims-for-cost-parity-with-gas-vehicles']])},
{h:'Vehicle OS, vehicle-as-a-platform and open source',l:L(`<p>Cars may become platforms like phones: one software base, many apps — some from outside companies. Carmakers are also starting to share basic, non-differentiating software as open source so they don’t all build the same plumbing.</p>`,
`<ul><li><strong>Vehicle operating platforms</strong> (MB.OS, Arene, Pleos, etc.) ${B.est} with SDKs and app stores (e.g., Pleos Playground) ${B.em}.</li><li><strong>Vehicle-as-a-platform</strong>: third-party developers using vehicle APIs (VSS, SDKs) ${B.em}.</li><li><strong>Open-source automotive software</strong>: Eclipse S-CORE targeting v1.0 in December 2026; AGL; COVESA ${B.em}.</li><li><strong>Cross-OEM platforms</strong>: RV Tech serving VW Group brands and Rivian; supplier platforms shared across OEMs ${B.est}/${B.em}.</li></ul>`,
`<p>Whether a few dominant vehicle platforms emerge (like mobile OSes) or OEM-specific platforms persist is an open question ${B.sp}.</p>`,
`<p>Platformisation shifts value toward whoever controls APIs, developer ecosystems and customer accounts.</p>`)},
{h:'AI-defined vehicles and generative AI',l:L(`<p>AI may become the main way cars get smarter — understanding speech naturally, driving more like humans, and helping engineers write and test software faster.</p>`,
`<ul><li><strong>In-vehicle AI assistants</strong> using large language models (e.g., GM’s planned Gemini-based conversational AI) ${B.em}.</li><li><strong>End-to-end and vision-language-action driving models</strong> ${B.em}.</li><li><strong>“AI-defined vehicle”</strong> framing (e.g., Hyundai’s longer-term ambition) ${B.em}.</li><li><strong>Generative AI in engineering</strong>: code generation, test generation, requirements analysis, simulation scenario generation — widely piloted; qualification for safety work remains an open challenge ${B.em}.</li></ul>`,
`<p>Edge intelligence will grow with NPU capability; regulators are developing frameworks for AI in safety-relevant functions ${B.sp}.</p>`,
`<p>AI raises the stakes for the data engine, compute headroom and validation methods (SOTIF, scenario-based testing).</p>`)},
{h:'V2X, V2G and software-defined powertrain and chassis',b:tbl(['Topic','Status','Notes'],[
['V2X (vehicle-to-everything)',B.em,'C-V2X deployment varies by region; dependent on infrastructure and regulation'],
['V2G / bidirectional charging',B.em+' '+B.est,'BMW iX3 supports V2H, V2L and V2G use cases; Ford UEV designs bidirectional charging in-house'],
['Software-defined powertrain',B.est,'Torque maps, efficiency modes, charging curves updated via OTA'],
['Software-defined chassis / by-wire',B.em,'Steer-by-wire (Tesla Cybertruck), brake-by-wire elements (e.g., Mahindra integrated electronic booster), integrated dynamics controllers (BMW Heart of Joy)'],
['Autonomous driving platforms',B.em,'L4 reference platforms (e.g., NVIDIA Hyperion) and robotaxi deployments in limited ODDs'],
['Digital twins across lifecycle',B.em,'From design to fleet operations'],
])+src([['Driven (BMW iX3 V2G)','https://www.drivencarguide.co.nz/news/bmw-s-ix3-neue-klasse-will-bring-800km-range-superfast-charging-and-all-new-tech'],['Basenor (Cybertruck steer-by-wire)','https://www.basenor.com/blogs/news/cybertrucks-engineering-firsts-48v-steer-by-wire-explained']])},
{h:'The changing roles of OEMs and suppliers',l:L(`<p>Carmakers are becoming part software company; suppliers are becoming part software and computer company; chipmakers and cloud companies are moving closer to the car buyer.</p>`,
`<p>Likely continued trends ${B.an}: OEMs own platform architecture, integration and customer experience; Tier 1s supply computers, zones, by-wire systems and integration services; semiconductor firms supply reference platforms and AI stacks; software vendors supply certified foundations; cloud providers supply data and AI infrastructure; open source absorbs non-differentiating layers.</p>`,
`<p>Speculative scenarios ${B.sp}: (a) consolidation around a few cross-OEM platforms; (b) OEMs licensing their platforms to others (as Rivian effectively does via RV Tech); (c) a mobile-like duopoly of vehicle platforms — or persistent fragmentation.</p>`,
`<p>Whatever happens, the master architecture of the next section will remain the reference frame: physical vehicle, compute, communication, software foundation, middleware, applications, cloud and cross-cutting foundations.</p>`)}
],

function maLayersHTML(sel,lit){
  return EXTRA.master.map(L=>`<div class="ma-layer" style="border-left:4px solid ${L.col}"><div class="lt"><i style="background:${L.col}">${L.n}</i>Layer ${L.n}: ${L.t}</div><div class="ma-comps">${L.c.map(c=>{let cl='ma-c';if(sel===c.n)cl+=' sel';if(lit){cl+=lit.includes(c.n)?' lit':' dim';}return `<button class="${cl}" data-ma="${esc(c.n)}">${c.n}</button>`}).join('')}</div></div>`).join('');

XVIEWS.master=function(args){
  let sel=args[0]||null;
  const html=`<div class="wide"><div class="kicker">Synthesis</div><h1>The Master SDV Architecture</h1><p class="lead">Everything from the 23 modules, connected into one layered architecture — from physical sensors to cloud, with cross-cutting foundations. Tap any component.</p>
  <div class="grid" style="grid-template-columns:repeat(auto-fit,minmax(min(320px,100%),1fr));align-items:start"><div id="maL">${maLayersHTML(sel)}</div><div><div class="sticky-panel"><div class="panel" id="maP" style="margin-top:8px">${maPanel(sel)}</div><div class="card" style="margin-top:12px"><h3 style="margin-top:0">Read it like an architect</h3><ul class="small muted"><li>Layers 1–3 are <b>physical</b>: what exists and how it’s wired.</li><li>Layers 4–6 are <b>software</b>: foundation → platform → applications.</li><li>Layer 7 extends the vehicle into the <b>cloud</b>.</li><li>Layer 8 <b>cuts across everything</b> — safety, security, governance, lifecycle.</li><li>Trace any feature top-to-bottom, then follow it into the cloud.</li></ul><div class="btns"><a class="btn sm pri" href="#/flows">Walk through the 3 end-to-end flows →</a></div></div></div></div></div>
  <h2>How the layers relate</h2>${stack([['Layer 7 · Connectivity & Cloud|cellular, cloud APIs, data platforms, OTA orchestration, fleet, analytics, twins|b'],['Layer 6 · Vehicle applications|ADAS, infotainment, body, powertrain, BMS, thermal, dynamics, cockpit, personalisation|c'],['Layer 5 · Middleware & platform|SOA, comms middleware, vehicle services, diagnostics, data, orchestration|v'],['Layer 4 · Software foundation|bootloaders, drivers, HAL, AUTOSAR, RTOS, Linux, QNX, AAOS, hypervisor|g'],['Layer 3 · Vehicle communication|CAN, CAN FD, LIN, Ethernet, TSN, SOME/IP, DDS|a'],['Layer 2 · Electronic & computing hardware|MCUs, SoCs, zones, central compute, TCU, gateways, power|a'],['Layer 1 · Physical vehicle|sensors, actuators, cameras, radar, LiDAR, motors, battery, brakes, steering, lighting, HVAC|n']],'Layer 8 (functional safety, cybersecurity, diagnostics, data governance, lifecycle management, DevOps, V&V) spans all layers.')}</div>`;
  return {html,after:()=>{const root=document.getElementById('maL');root.addEventListener('click',e=>{const b=e.target.closest('[data-ma]');if(!b)return;sel=b.dataset.ma;root.querySelectorAll('.ma-c').forEach(x=>x.classList.toggle('sel',x.dataset.ma===sel));document.getElementById('maP').innerHTML=maPanel(sel);if(window.innerWidth<700)document.getElementById('maP').scrollIntoView({behavior:'smooth',block:'start'});});
    if(sel)setTimeout(()=>{const p=document.getElementById('maP');if(p)p.scrollIntoView({block:'start'})},50);}};

XVIEWS.flows=function(args){

  <div class="grid" style="grid-template-columns:repeat(auto-fit,minmax(min(320px,100%),1fr));align-items:start"><div><div id="flS"></div><div class="btns" style="margin-top:8px"><button class="btn sm" id="flPrev">← Previous</button><button class="btn sm pri" id="flNext">Next step →</button></div></div><div><div class="sticky-panel"><div class="card" style="padding:12px"><h4 style="margin:0 0 6px">Components involved (highlighted)</h4><div id="flMap"></div></div></div></div></div></div>`;

    document.getElementById('flMap').innerHTML=maLayersHTML(null,f.s[si][2]).replace(/data-ma=/g,'data-mx=');
    document.querySelectorAll('#flC .chip').forEach((c,i)=>c.classList.toggle('on',i===fi));}
  return {html,after:()=>{draw();
    document.getElementById('flC').onclick=e=>{const b=e.target.closest('[data-f]');if(b){fi=+b.dataset.f;si=0;draw();}};
    document.getElementById('flS').onclick=e=>{const b=e.target.closest('[data-s]');if(b){si=+b.dataset.s;draw();}};
    document.getElementById('flNext').onclick=()=>{const n=EXTRA.flows[fi].s.length;si=Math.min(n-1,si+1);draw();const st=document.querySelector('.fstep.on');if(st&&window.innerWidth<700)st.scrollIntoView({block:'center',behavior:'smooth'});};
    document.getElementById('flPrev').onclick=()=>{si=Math.max(0,si-1);draw();};
    document.getElementById('flMap').onclick=e=>{const b=e.target.closest('[data-mx]');if(b)window.SDV.go('#/master/'+encodeURIComponent(b.dataset.mx));};}};
};

XVIEWS.flash=function(){
  const S=window.SDV.S;S.flash=S.flash||{};let order=EXTRA.flash.map((_,i)=>i),i=0,flipped=false,onlyUnknown=false;
  const html=`<div class="wrap"><div class="kicker">Practice</div><h1>Architecture flashcards</h1><p class="lead">Tap the card to flip. Mark each as “Know it” or “Review again”. ${EXTRA.flash.length} cards.</p>
  <div class="btns"><button class="btn sm" id="fcShuf">Shuffle</button><button class="btn sm" id="fcOnly">Show only “review again”</button><span class="tiny" id="fcStat" style="align-self:center"></span></div>
  <div class="fc-stage"><div class="fc" id="fc"><div class="face front"><div class="tiny" id="fcN"></div><div class="w" id="fcW"></div><div class="tiny" style="margin-top:12px">Tap to reveal</div></div><div class="face back" id="fcB"></div></div></div>
  <div class="btns" style="justify-content:center"><button class="btn" id="fcPrev">←</button><button class="btn" id="fcAgain">Review again</button><button class="btn pri" id="fcKnow">Know it ✓</button><button class="btn" id="fcNext">→</button></div></div>`;
  function list(){return onlyUnknown?order.filter(k=>S.flash[EXTRA.flash[k][0]]!==1):order;}
  function draw(){const L=list();if(!L.length){document.getElementById('fcW').textContent='All known! 🎉';document.getElementById('fcB').innerHTML='';document.getElementById('fcN').textContent='';stat();return;}
    i=((i%L.length)+L.length)%L.length;const c=EXTRA.flash[L[i]];const fc=document.getElementById('fc');fc.classList.toggle('flip',flipped);
    document.getElementById('fcN').textContent=`Card ${i+1} / ${L.length}${S.flash[c[0]]===1?' · known':''}`;document.getElementById('fcW').textContent=c[0];
    document.getElementById('fcB').innerHTML=`<p><b>Definition</b><br>${c[1]}</p><p><b>Why it matters</b><br>${c[2]}</p><p><b>In Project NOVA</b><br>${c[3]}</p>`;stat();}
  function stat(){const k=Object.values(S.flash).filter(v=>v===1).length;document.getElementById('fcStat').textContent=`${k}/${EXTRA.flash.length} known`;}
  return {html,after:()=>{draw();const fc=document.getElementById('fc');fc.onclick=()=>{flipped=!flipped;fc.classList.toggle('flip',flipped)};
    const mv=d=>{i+=d;flipped=false;draw()};document.getElementById('fcNext').onclick=()=>mv(1);document.getElementById('fcPrev').onclick=()=>mv(-1);
    document.getElementById('fcKnow').onclick=()=>{const L=list();if(!L.length)return;S.flash[EXTRA.flash[L[i]][0]]=1;window.SDV.save();if(!onlyUnknown)i++;flipped=false;draw();};
    document.getElementById('fcAgain').onclick=()=>{const L=list();if(!L.length)return;S.flash[EXTRA.flash[L[i]][0]]=0;window.SDV.save();i++;flipped=false;draw();};
    document.getElementById('fcShuf').onclick=()=>{for(let k=order.length-1;k>0;k--){const j=Math.floor(Math.random()*(k+1));[order[k],order[j]]=[order[j],order[k]];}i=0;flipped=false;draw();};
    document.getElementById('fcOnly').onclick=e=>{onlyUnknown=!onlyUnknown;e.target.textContent=onlyUnknown?'Show all cards':'Show only “review again”';i=0;flipped=false;draw();};}};
};

XVIEWS.glossary=function(args){
  const S=window.SDV.S;const G=EXTRA.glossary.slice().sort((a,b)=>a[0].localeCompare(b[0],'en',{sensitivity:'base'}));
  let letter='All',q='',onlyNew=false;const target=args[0]||null;
  const letters=['All','#',...'ABCDEFGHIJKLMNOPQRSTUVWXYZ'];
  const first=t=>{const c=t[0].toUpperCase();return /[A-Z]/.test(c)?c:'#';};
  const has=new Set(G.map(g=>first(g[0])));
  const html=`<div class="wrap"><div class="kicker">Practice</div><h1>Interactive glossary</h1><p class="lead">${G.length} SDV and automotive software terms. Each has a full form, a simple definition, a technical explanation, a practical example and related concepts. Mark terms as learned to track progress.</p>
  <div class="searchbox"><input id="gq" type="search" placeholder="Filter terms…" autocomplete="off"></div>
  <div class="alpha" id="gA">${letters.map(l=>`<button data-l="${l}" ${l!=='All'&&!has.has(l)?'disabled':''} class="${l==='All'?'on':''}" ${l==='All'?'style="width:auto;padding:0 10px"':''}>${l}</button>`).join('')}</div>
  <label class="chk"><input type="checkbox" id="gN"> Show only terms not yet learned</label> <span class="tiny" id="gC"></span>
  <div id="gL"></div></div>`;
  function draw(){const ql=q.toLowerCase();const L=G.filter(g=>(letter==='All'||first(g[0])===letter)&&(!ql||g.join(' ').toLowerCase().includes(ql))&&(!onlyNew||!S.gloss[g[0]]));
    document.getElementById('gC').textContent=`${L.length} shown · ${Object.keys(S.gloss).length} learned`;
    document.getElementById('gL').innerHTML=L.map(g=>`<details class="gterm" id="g-${encodeURIComponent(g[0])}" ${target===g[0]?'open':''}><summary><b>${g[0]}</b><span class="gf">${g[1]!=='—'?g[1]:''}</span>${S.gloss[g[0]]?'<span class="learned">✓ learned</span>':''}</summary><div class="gb">${g[1]!=='—'?`<span class="lbl">Full form</span><p>${g[1]}</p>`:''}<span class="lbl">Simple definition</span><p>${g[2]}</p><span class="lbl">Technical explanation</span><p>${g[3]}</p><span class="lbl">Practical example</span><p>${g[4]}</p><span class="lbl">Related concepts</span><p>${g[5].split(',').map(r=>{r=r.trim();const hit=G.find(x=>x[0].toLowerCase()===r.toLowerCase());return hit?`<a href="#/glossary/${encodeURIComponent(hit[0])}" class="chip" style="min-height:30px;padding:4px 10px">${r}</a>`:`<span class="chip" style="min-height:30px;padding:4px 10px;cursor:default">${r}</span>`}).join(' ')}</p><label class="chk"><input type="checkbox" data-learn="${esc(g[0])}" ${S.gloss[g[0]]?'checked':''}> Mark as learned</label></div></details>`).join('')||'<p class="muted">No terms match.</p>';}
  return {html,after:()=>{draw();
    document.getElementById('gq').oninput=e=>{q=e.target.value;draw();};
    document.getElementById('gA').onclick=e=>{const b=e.target.closest('[data-l]');if(!b||b.disabled)return;letter=b.dataset.l;document.querySelectorAll('#gA button').forEach(x=>x.classList.toggle('on',x===b));draw();};
    document.getElementById('gN').onchange=e=>{onlyNew=e.target.checked;draw();};
    document.getElementById('gL').addEventListener('change',e=>{const c=e.target.closest('[data-learn]');if(!c)return;if(c.checked)S.gloss[c.dataset.learn]=1;else delete S.gloss[c.dataset.learn];window.SDV.save();window.SDV.updateRing();const sm=c.closest('details').querySelector('summary');const l=sm.querySelector('.learned');if(c.checked&&!l)sm.insertAdjacentHTML('beforeend','<span class="learned">✓ learned</span>');if(!c.checked&&l)l.remove();document.getElementById('gC').textContent=document.getElementById('gC').textContent.replace(/\d+ learned/,Object.keys(S.gloss).length+' learned');});
    if(target){const el=document.getElementById('g-'+encodeURIComponent(target));if(el)setTimeout(()=>el.scrollIntoView({block:'center'}),60);}}};
};

{t:'Tesla — the software-centric pioneer',sub:'Vertical integration from silicon to cloud',f:{

'Architecture approach':'Highly centralised compute from the Model 3 (2017) onward with large body controllers; the Cybertruck introduced a 48 V low-voltage architecture and the Etherloop wiring approach, and Tesla highlights steer-by-wire on Cybertruck. '+C_(),
'Software strategy':'In-house software across vehicle, cockpit and ADAS; OTA updates since the Model S (2012); camera-centric neural-network driving stack trained on fleet data. '+C_(),
'Hardware strategy':'In-house FSD computer silicon; consolidation of ECUs; aggressive cost-down through integration and wiring reduction. '+C_(),
'Key technology partners':'Primarily in-house; contract manufacturing and component suppliers for silicon fabrication and parts. '+A_,
'Development approach':'Fast iterative releases, fleet data engine, tight hardware/software co-design, vertical integration. '+A_,
'Commercial implications':'Software features (e.g., driver-assistance packages) monetised directly; OTA reduces service costs; strong brand association with “software-defined”. '+A_,
'Major challenges':'Regulatory scrutiny of driver-assistance claims and behaviour; quality and validation at speed; scaling autonomy claims vs delivered capability. '+A_,
'Lessons learned':'Owning the architecture and software stack enables speed, but requires deep talent and accepting responsibility for everything; clean-sheet architecture matters more than any single feature. '+A_},

{t:'Volkswagen Group — CARIAD and the pivot to RV Tech',sub:'From in-house unification to partnership',f:{

'Key technology partners':'Rivian (RV Tech JV, founded Nov 2024); Xpeng and Horizon Robotics in China; Bosch for ADAS cooperation. '+C_(),

{t:'Mercedes-Benz — MB.OS',sub:'An OEM-owned chip-to-cloud platform',f:{
'Strategic objective':'Own the customer-facing software and decouple hardware from software to enable continuous upgrades and new revenue. '+C_(),
'Architecture approach':'MB.OS described as a chip-to-cloud architecture covering infotainment, automated driving, comfort and charging; the new CLA on the Mercedes-Benz Modular Architecture (MMA, 800 V) is the first vehicle fully on MB.OS. '+C_(),

{t:'Volvo Cars — the Superset tech stack and the EX90 lesson',sub:'One stack for all cars — and the cost of headroom',f:{
'Strategic objective':'Channel all engineering effort into one evolving tech stack powering every future EV, so all cars improve together. '+C_(),
'Architecture approach':'“Superset tech stack”: a common core of systems, modules, software and hardware; each car is a subset. Core computing on NVIDIA DRIVE AGX Orin; ES90 introduced a dual-Orin configuration; next-generation SPA3 platform underpinned by Superset. '+C_(),

XVIEWS.cases=function(args){
  const open=+(args[0]||0);
  return {html:`<div class="wrap"><div class="kicker">Synthesis</div><h1>Real-world case studies</h1><p class="lead">Six SDV strategies analysed across nine dimensions. Each statement is labelled ${C_()} or ${A_}. Information current to November 2026; strategies evolve — check sources.</p>
  ${EXTRA.cases.map((c,i)=>`<details class="case" id="case-${i+1}" ${open===i+1?'open':''}><summary><span class="cn">${i+1}</span><span><b style="font-size:1.05rem">${c.t}</b><br><span class="tiny">${c.sub}</span></span></summary><div class="cb">${CF.map(k=>`<h4>${k}</h4><p class="small">${c.f[k]}</p>`).join('')}${src(c.src)}</div></details>`).join('')}
  <h2>Cross-case comparison</h2>${tbl(['Company','Architecture','Platform model','Key lesson'],[['Tesla','Highly centralised; 48 V on Cybertruck','Fully in-house','Clean-sheet + vertical integration = speed'],['VW Group','Zonal via RV Tech (from 2027)','JV + partnerships','Big-bang unification across brands is very hard'],['Mercedes-Benz','Central compute, MB.OS chip-to-cloud','OEM platform + partners','Own the platform, partner for specialities'],['BMW','Four superbrains','In-house','Organise around brand-defining experience'],['Volvo','Superset stack on NVIDIA core compute','OEM stack + chip partner','Provision headroom; retrofit if needed'],['Rivian','Zonal, 7 ECUs','In-house; licenses via JV','Architecture can become a business asset']])}</div>`,
  after:()=>{if(open){const el=document.getElementById('case-'+open);if(el)setTimeout(()=>el.scrollIntoView({block:'start'}),60);}}};
};

  const re=/<a href="(https?:[^"]+)"[^>]*>([^<]+)<\/a>/g;
  MODULES.forEach(m=>{const txt=m.sec.map(s=>(s.b||'')+(s.l?Object.values(s.l).join(''):'')+(s.x||'')).join('')+(m.intro||'');let r;while((r=re.exec(txt))){add(`Module ${String(m.n).padStart(2,'0')} — ${r[2]}`,r[1],'Module sources');}});
  const groups=[...new Set(all.map(a=>a[0]))];
  return `<div class="wrap"><div class="kicker">Reference</div><h1>Sources & references</h1><p class="lead">Every link cited in this course, grouped. Company-specific and time-sensitive claims link to sources inline; general engineering knowledge reflects established industry practice.</p>
  ${call('note',`<p><b>How to read the labels:</b> ${B.est} widely documented practice/standards · ${B.pat} typical implementation approach · ${B.co} specific company implementation (sourced) · ${B.em} early deployment/active development · ${B.sp} forward-looking opinion · ${B.an} reasoning by the course author based on public information.</p><p>Standards texts (ISO, SAE) are copyrighted and sold by their publishers; this course summarises their scope rather than reproducing content. Figures quoted from press coverage reflect what companies stated at the time; verify before professional use.</p>`,'About sources')}
  ${groups.map(g=>`<h2>${g}</h2><ol class="small">${all.filter(a=>a[0]===g).map(a=>`<li><a href="${a[2]}" target="_blank" rel="noopener">${a[1]}</a><br><span class="tiny" style="word-break:break-all">${a[2]}</span></li>`).join('')}</ol>`).join('')}
  <p class="tiny">${all.length} unique sources.</p></div>`;
};

EXTRA.capstone=[
{t:'Vehicle computing architecture',p:'Your new EV platform (mid-to-premium, ~250k vehicles/year across 4 models, L2+ at launch, L3-ready later) needs a compute topology. Cockpit, ADAS and vehicle functions all need hosting.',o:[
['Single central computer','One board/SoC hosts cockpit, ADAS and vehicle functions.','Lowest BOM and fewest boxes; but thermal density, a large blast radius on failure, and coupling of ADAS and cockpit release cycles and suppliers.'],
['Central vehicle computer + separate ADAS computer','CVC for cockpit and vehicle functions; dedicated ADAS HPC.','Good fault isolation, independent ADAS upgrade path (sensors/AI evolve fastest), manageable thermals; slightly higher cost and an extra node to integrate.'],
['Several domain HPCs','Separate cockpit, ADAS, chassis and body HPCs.','Familiar organisation and supplier model; but duplication, weaker cross-domain features and more update targets.']],r:1,w:'For an L3-ready, multi-model platform, separating the fastest-evolving, most compute-hungry workload (ADAS) keeps upgrade paths open while consolidating everything else. A single SoC is attractive for cost-focused high-volume models.'},
{t:'ECU consolidation',p:'How many ECUs should survive?',o:[
['Aggressive consolidation','~6–10 major ECUs: CVC, ADAS HPC, 4 zones, plus retained brake, EPS, BMS, inverters.','Big harness and cost gains, fewer part numbers, simpler OTA; requires strong in-house integration and early supplier alignment.'],
['Moderate consolidation','Keep 15–25 supplier ECUs; consolidate cockpit and some body functions.','Lower risk and reuse of validated parts; but limited harness savings and many update targets remain.'],
['Minimal consolidation','Add an HPC on top of the existing distributed architecture.','Fastest start; but complexity grows, little cost benefit, and SDV capabilities stay shallow.']],r:0,w:'A clean-sheet EV platform is the rare chance to consolidate aggressively; keep dedicated safety actuator controllers (brake, EPS) and power electronics.'},
{t:'Domain vs zonal architecture',p:'How should physical I/O and power be organised?',o:[
['Domain-based','Domain controllers per function with their own sub-networks.','Organisational familiarity; but long harness and cross-domain friction persist.'],
['Zonal (four corner zones)','FL/FR/RL/RR zone controllers with e-fuses, connected to central compute over an Ethernet ring.','Shortest harness, generic I/O, scalable across body styles; demands mature central compute, latency budgets and degradation concepts.'],
['Zonal with three zones (left/right/rear)','Fewer, larger zones.','Fewer nodes and lower cost; longer local wiring in large vehicles, less redundancy symmetry.']],r:1,w:'Four zones give symmetry for redundancy (lighting, doors) and keep wiring short across SUV/sedan variants; three zones can be optimal for compact cars.'},
{t:'MCU and SoC selection',p:'Which silicon strategy?',o:[
['Single vendor for everything','One chip vendor for SoCs and MCUs.','Simpler toolchain and support; strong lock-in and supply concentration risk.'],
['Best-of-breed with abstraction','ADAS SoC from an AI-compute leader, cockpit SoC from a cockpit leader, safety MCUs from automotive MCU leaders; abstraction layers to retain options.','Best performance per domain and negotiation leverage; more integration work, multiple BSPs and toolchains.'],
['Custom in-house silicon','Design your own SoC.','Ultimate optimisation and IP; only justified at very high volume and with deep silicon talent — long lead time and high risk.']],r:1,w:'Best-of-breed with deliberate abstraction (HAL, middleware, AI runtime portability) balances performance and lock-in for most OEMs.'},
{t:'Operating system selection',p:'Which OS strategy across nodes?',o:[
['Linux everywhere','Linux on all HPC partitions, minimal RTOS.','Big ecosystem; but certification gaps for safety functions and boot-time concerns for the cluster.'],
['Mixed criticality under a type-1 hypervisor','AUTOSAR OS on MCUs; QNX for cluster/safety partition; Linux for ADAS; Android Automotive OS for IVI.','Right OS per criticality and ecosystem; more integration complexity and licensing management.'],
['Android for the whole HPC','AAOS hosts everything on the central computer.','Fast UI development; unsuitable for safety-relevant functions, and couples vehicle functions to Android release cadence.']],r:1,w:'Mixed criticality is the industry pattern: certified RTOS where safety demands, rich OSes where ecosystems matter, isolated by a hypervisor.'},
{t:'AUTOSAR strategy',p:'Where and how will you use AUTOSAR?',o:[
['Classic on MCUs + Adaptive on HPCs','Standard stacks across the platform.','Supplier interoperability and tooling; Adaptive adds complexity on HPCs but standardises services and UCM.'],
['Classic on MCUs + alternative middleware on HPCs','Use open-source (e.g., S-CORE-based) or proprietary middleware on HPCs.','More freedom and developer-friendliness on HPCs; must still bridge to Classic via SOME/IP and carry qualification burden.'],
['No AUTOSAR','Fully proprietary stacks.','Maximum control; but supplier integration becomes harder and you rebuild what the ecosystem already provides.']],r:0,w:'Classic on MCUs is near-universal. On HPCs both Adaptive and well-supported alternatives are viable — the key is a stable service contract across the boundary. (Option B is also a defensible expert choice.)'},
{t:'Middleware',p:'How do components communicate?',o:[
['SOME/IP only','One protocol for everything.','Simple and standard; weak for high-rate sensor data inside the ADAS HPC.'],
['Layered middleware','SOME/IP between ECUs; zero-copy IPC/DDS inside ADAS; a permissioned vehicle API (VSS-based) for apps; MQTT to cloud.','Each flow gets the right mechanism; requires gateways and governance across protocols.'],
['Custom proprietary bus everywhere','Own protocol.','Full control; isolates you from tools and suppliers.']],r:1,w:'Match mechanism to data flow: control services, high-rate sensor graphs, third-party APIs and cloud messaging have different needs.'},
{t:'Communication paradigm',p:'Signals or services?',o:[
['Service-oriented end-to-end','Even zone-internal I/O as services.','Uniform model; overhead on small MCUs and legacy suppliers.'],
['Hybrid','Signals inside zones and to legacy ECUs; services on the backbone; gateways translate.','Pragmatic and efficient; translation layers must be engineered and versioned carefully.'],
['Signal-based everywhere','Keep classic communication matrices.','Deterministic and familiar; blocks cross-domain features and app ecosystems.']],r:1,w:'Hybrid is today’s production norm: signals where efficient, services where flexibility matters.'},
{t:'Vehicle networking',p:'Which network topology and technologies?',o:[
['1 Gbit/s Ethernet star','Each zone linked to the CVC.','Simple; a single link failure isolates a zone; limited bandwidth headroom.'],
['Multi-gig Ethernet ring + TSN, with CAN FD/LIN/10BASE-T1S edges','Redundant ring, time sync and scheduled traffic; low-cost edges.','Redundancy, determinism and headroom; more complex configuration and TSN expertise needed.'],
['CAN FD backbone','No Ethernet backbone.','Cheap; insufficient bandwidth for cameras, OTA, logging.']],r:1,w:'Redundancy and headroom matter for a platform living 10+ years; TSN supports deterministic control traffic.'},
{t:'Cloud connectivity',p:'How will you build the backend?',o:[
['One primary hyperscaler + portability guardrails','OEM-built microservices on one cloud using containers/IaC; regional providers where required (e.g., China).','Speed and depth of managed services; mitigate lock-in with portable designs.'],
['Multi-cloud from day one','Abstract every service across clouds.','Maximum leverage; slower delivery and lowest common denominator services.'],
['Outsource to a connected-vehicle platform vendor','Turnkey backend.','Fast start; less control over data and differentiation; contract dependency.']],r:0,w:'Most OEMs start with a primary cloud plus regional exceptions, designing for portability without paying full multi-cloud cost.'},
{t:'OTA infrastructure',p:'What OTA scope at start of production?',o:[
['Full-vehicle OTA from SOP','Uptane-style security, A/B on HPCs, dual-bank flash on MCUs, delta updates, orchestrated multi-ECU campaigns.','Highest long-term value; demands storage headroom, bootloader work and a SUMS from day one.'],
['Infotainment-only OTA at SOP','Extend later.','Lower initial effort; retrofitting full OTA later is very hard and may require hardware changes.'],
['Dealer updates only','No OTA.','Lowest cost; incompatible with SDV goals and expensive recalls.']],r:0,w:'OTA capability is foundational — every node must be updatable from SOP or the SDV promise collapses.'},
{t:'Cybersecurity',p:'Security architecture?',o:[
['Perimeter firewall only','Protect the gateway; trust inside.','Cheap; a single breach exposes everything.'],
['Defence in depth','HSMs, secure boot everywhere, SecOC/MACsec, service ACLs (zero trust), IDS + VSOC, SBOM-based vulnerability management, PKI lifecycle.','Meets R155/21434 expectations and limits blast radius; ongoing operational cost.'],
['Supplier-by-supplier security','Each supplier secures its own box.','Inconsistent; gaps at interfaces; hard to operate fleet-wide.']],r:1,w:'Defence in depth plus lifecycle operations is effectively mandatory under UN R155 and ISO/SAE 21434.'},
{t:'Functional safety',p:'Safety concept for consolidated compute?',o:[
['Make the main SoC ASIL D for everything','Certify all on one chip.','Very demanding; few SoCs can support it cost-effectively.'],
['Monitor architecture + decomposition','ADAS SoC (ASIL B) supervised by an ASIL D safety MCU; retained ASIL D brake/EPS; fail-operational paths only where automation requires.','Industry-proven pattern; requires rigorous independence arguments and degradation design.'],
['Keep central compute QM only','All safety stays in legacy ECUs.','Simple certification; blocks ADAS/vehicle-function consolidation.']],r:1,w:'Monitor/decomposition architectures are the standard way to combine high-performance compute with high-integrity safety.'},
{t:'Software development lifecycle',p:'How will teams build and release?',o:[
['Classic waterfall, yearly releases','Strict V-model per vehicle program.','Predictable; too slow for SDV cadence.'],
['Agile + DevOps with V-model rigour per increment','Release trains, CI/CD, automated traceability and safety evidence.','Fast and compliant; requires heavy investment in tooling and culture.'],
['Pure continuous deployment','Ship to cars like a web app.','Speed; unsafe and non-compliant for safety-relevant software.']],r:1,w:'Blend cadence with rigour: automate evidence so speed doesn’t sacrifice safety or R156 compliance.'},
{t:'Testing strategy',p:'Where will most verification happen?',o:[
['HIL and vehicle heavy','Physical testing first.','High fidelity; slow, expensive, doesn’t scale with release frequency.'],
['Shift-left virtual-first','SIL/virtual ECUs in cloud CI; HIL farm for timing and safety; vehicle validation; fleet shadow mode for ADAS.','Scales with releases; requires investment in simulation models and virtual ECUs.'],
['Vehicle testing mainly','Test drives.','Real-world realism; poor coverage and repeatability.']],r:1,w:'Shift-left is how leading OEMs reach weekly integration while keeping HIL and vehicle tests for what only they can prove.'},
{t:'Supplier ecosystem',p:'How will you work with suppliers?',o:[
['Black-box Tier 1 systems','Suppliers own software in each box.','Familiar, low OEM effort; little control over updates and features.'],
['White-box platform model','OEM owns architecture, platform and differentiating apps; suppliers deliver hardware and certified base software; open source for non-differentiating middleware.','Control where it matters, ecosystem leverage elsewhere; needs strong OEM software organisation and clear IP contracts.'],
['Single turnkey Tier 1','One supplier delivers whole E/E + software.','Fast and accountable; dependency and weak differentiation.']],r:1,w:'Own what customers notice and what drives architecture; buy or share the rest.'},
{t:'Cost and scalability',p:'How much hardware headroom and reuse?',o:[
['Minimum BOM, no headroom','Size compute for launch features only.','Cheapest at SOP; future features impossible or require costly retrofits (see Volvo EX90 lesson).'],
['Planned headroom + modularity','~2× compute/memory over launch needs, modular compute board for mid-life upgrade, platform reused across 3+ models.','Higher initial cost repaid by lifecycle features and reuse.'],
['Maximum hardware everywhere','Top sensors and compute in every trim.','Future-proof; uncompetitive cost for entry trims.']],r:1,w:'Planned headroom plus an upgrade path balances SOP cost with lifecycle value.'}];

XVIEWS.capstone=function(){
  const S=window.SDV.S;S.cap=S.cap||{};S.cap.ch=S.cap.ch||{};const D=EXTRA.capstone;
  let i=Math.min(Object.keys(S.cap.ch).length,D.length-1);if(S.cap.finished)i=D.length;
  const html=`<div class="wrap"><div class="kicker">Capstone challenge</div><h1>Design your own SDV</h1><p class="lead">You are the lead architect for a new electric vehicle platform. Make 17 decisions. For each: read the engineering problem, weigh the alternatives, choose, see the consequences, then compare with an expert recommendation. At the end, you get a blueprint of your architecture.</p>
  <div class="stepper" id="capSt"></div><div id="capB"></div></div>`;
  function steps(){document.getElementById('capSt').innerHTML=D.map((_,k)=>`<i class="${S.cap.ch[k]!=null?'d':''}${k===i?' c':''}" title="${k+1}"></i>`).join('');}
  function draw(){steps();const b=document.getElementById('capB');
    if(i>=D.length){b.innerHTML=blueprint();return;}
    const d=D[i];const ch=S.cap.ch[i];
    b.innerHTML=`<div class="cap-step"><div class="kicker">Decision ${i+1} of ${D.length}</div><h2 style="margin-top:4px">${d.t}</h2><p><b>The engineering problem:</b> ${d.p}</p>
    ${d.o.map((o,k)=>`<button class="cap-opt${ch===k?' on':''}" data-o="${k}"><b>${'ABC'[k]}. ${o[0]}</b><span>${o[1]}</span></button>`).join('')}
    ${ch!=null?`<div class="call c-fail"><div class="ct">Consequences of your choice</div><p>${d.o[ch][2]}</p></div><div class="call c-key"><div class="ct">Expert recommendation: ${'ABC'[d.r]}. ${d.o[d.r][0]} ${ch===d.r?'— matches your choice ✓':''}</div><p>${d.w}</p></div><details class="small"><summary class="muted" style="cursor:pointer">See trade-offs of all options</summary><ul>${d.o.map((o,k)=>`<li><b>${'ABC'[k]}. ${o[0]}:</b> ${o[2]}</li>`).join('')}</ul></details>`:'<p class="tiny">Choose an option to see its consequences and the expert recommendation.</p>'}
    <div class="btns" style="margin-top:12px"><button class="btn sm" id="capPrev" ${i===0?'disabled':''}>← Previous</button><button class="btn sm pri" id="capNext" ${ch==null?'disabled':''}>${i===D.length-1?'Generate my blueprint →':'Next decision →'}</button></div></div>`;
    b.querySelectorAll('[data-o]').forEach(x=>x.onclick=()=>{S.cap.ch[i]=+x.dataset.o;window.SDV.save();draw();});
    const pv=document.getElementById('capPrev');if(pv)pv.onclick=()=>{i--;draw();window.scrollTo(0,0)};
    const nx=document.getElementById('capNext');if(nx)nx.onclick=()=>{i++;if(i>=D.length){S.cap.finished=1;window.SDV.save();window.SDV.updateRing();window.SDV.buildNav();}draw();window.scrollTo(0,0)};}
  function blueprint(){const ch=S.cap.ch;const match=D.filter((d,k)=>ch[k]===d.r).length;const pick=k=>D[k].o[ch[k]!=null?ch[k]:D[k].r][0];
    const rows=D.map((d,k)=>[`${k+1}. ${d.t}`,ch[k]!=null?`${'ABC'[ch[k]]}. ${d.o[ch[k]][0]}`:'—',`${'ABC'[d.r]}. ${d.o[d.r][0]}`,ch[k]===d.r?'✓':'≠']);
    const risks=D.map((d,k)=>ch[k]!=null&&ch[k]!==d.r?`<li><b>${d.t}:</b> ${d.o[ch[k]][2]}</li>`:'').join('');
    return `<div class="cap-step"><div class="kicker">Your architecture blueprint</div><h2 style="margin-top:4px">Platform blueprint — “Project ${esc((S.cap.name||'ATLAS'))}”</h2>
    <p>You matched the expert recommendation on <b>${match} of ${D.length}</b> decisions. Different choices can be valid for different volumes, markets and strategies — use the risk list below to stress-test yours.</p>
    ${stack([[`Connectivity & cloud|${pick(9)}; ${pick(10)}|b`],[`Applications|ADAS, cockpit, body, energy, personalisation — built on a ${pick(15).toLowerCase()}|c`],[`Middleware & platform|${pick(6)}; ${pick(7)} communication|v`],[`Software foundation|${pick(4)}; AUTOSAR: ${pick(5)}|g`],[`Networking|${pick(8)}|a`],[`Compute & E/E|${pick(0)}; ${pick(1)}; ${pick(2)}; silicon: ${pick(3)}|a`],[`Cross-cutting|Security: ${pick(11)} · Safety: ${pick(12)} · Process: ${pick(13)} · Testing: ${pick(14)} · Cost: ${pick(16)}|r`]],'Generated from your decisions.')}
    ${tbl(['Decision','Your choice','Expert recommendation','Match'],rows)}
    ${risks?`<h3>Risks to manage in your design</h3><ul class="small">${risks}</ul>`:'<p class="small">Your blueprint matches the expert baseline across all decisions. Next, challenge it: what would change for a €25k high-volume compact car? For an L4 robotaxi?</p>'}
    <h3>Architecture narrative</h3><p class="small muted">The platform uses <b>${pick(0).toLowerCase()}</b> with <b>${pick(2).toLowerCase()}</b> I/O, ${pick(1).toLowerCase()}. Software runs on <b>${pick(4).toLowerCase()}</b>; communication follows a <b>${pick(7).toLowerCase()}</b> approach over <b>${pick(8).toLowerCase()}</b>. Updates use <b>${pick(10).toLowerCase()}</b>; security follows <b>${pick(11).toLowerCase()}</b>; safety follows <b>${pick(12).toLowerCase()}</b>. Development uses <b>${pick(13).toLowerCase()}</b> with <b>${pick(14).toLowerCase()}</b> testing, and a <b>${pick(15).toLowerCase()}</b> supplier model with <b>${pick(16).toLowerCase()}</b>.</p>
    <div class="btns"><label class="small">Name your platform: <input id="capName" value="${esc(S.cap.name||'ATLAS')}" style="background:var(--bg2);border:1px solid var(--line2);color:var(--tx);border-radius:8px;padding:8px;font-size:.95rem;max-width:180px"></label><button class="btn sm" id="capRestart">Restart capstone</button><button class="btn sm" onclick="window.print()">Print / save as PDF</button><a class="btn sm pri" href="#/assess">Take the final assessment →</a></div></div>`;}
  return {html,after:()=>{draw();document.getElementById('capB').addEventListener('change',e=>{if(e.target.id==='capName'){S.cap.name=e.target.value.slice(0,30);window.SDV.save();document.getElementById('capB').innerHTML=blueprint();}});
    document.getElementById('capB').addEventListener('click',e=>{if(e.target.id==='capRestart'){S.cap={ch:{}};window.SDV.save();i=0;draw();window.SDV.updateRing();}});}};
};

{sa:1,type:'Short answer',q:'Explain in 3–5 sentences why OEMs are moving from distributed ECU architectures to central compute with zonal I/O.',model:'Distributed architectures accumulated dozens to 100+ supplier-owned ECUs, long heavy harnesses and many update targets, making cross-domain features, OTA and integration costly. Central compute consolidates logic for cross-domain features, AI and simpler updates, while zone controllers aggregate local I/O and power by location, shortening the harness and making I/O generic and scalable. Together they decouple logical from physical architecture. Trade-offs include integration complexity, redundancy and thermal design.',keys:['wiring/harness','ECU count/consolidat','OTA/update','cross-domain','location','logical/physical','redundan/failure']},
{sa:1,type:'Short answer',q:'Trace what happens, layer by layer, when a driver changes the cabin temperature in an SOA-based zonal vehicle.',model:'The HMI app (e.g., on Android Automotive) captures input and calls a vehicle API; the request passes a permission-checked gateway to the ClimateService provider; the service validates and arbitrates, then sends SOME/IP method calls over the Ethernet backbone to the relevant zone controller; the zone (AUTOSAR Classic) drives blend doors via LIN and the blower via PWM; sensors report back and the service publishes an event to update HMI and other consumers.',keys:['HMI','service','SOME/IP','zone','actuator/LIN/PWM','sensor/feedback/event']},
{sa:1,type:'Short answer',q:'Describe how A/B partitioning and rollback make OTA safer, and one complication.',model:'The update is installed to the inactive slot in the background while the active slot keeps running; after verification and in a safe vehicle state the system switches slots; health checks after boot confirm success, otherwise the bootloader or health manager falls back to the previous slot. Complications: doubled storage, coordinating rollback across multiple ECUs for compatibility, and reconciling anti-rollback security counters with functional rollback.',keys:['inactive/slot','background','verify/signature','switch/activate','health/check','rollback/fallback','storage/anti-rollback/coordinat']},
{sa:1,type:'Short answer',q:'Explain freedom from interference and how it is achieved on a mixed-criticality central computer.',model:'Freedom from interference means lower-integrity software cannot cause failures in higher-integrity software. On a central computer it is achieved spatially (MMU/SMMU, hypervisor partitions), temporally (CPU budgets, scheduling, watchdogs) and in communication (E2E protection, access control), often supplemented by a separate safety MCU monitoring the SoC.',keys:['interfere','memory/spatial/MMU','time/temporal','E2E/communication','hypervisor/partition','safety MCU/monitor']},

XVIEWS.assess=function(){
  const S=window.SDV.S;
  const html=`<div class="wrap"><div class="kicker">Final knowledge assessment</div><h1>Final assessment</h1><p class="lead">${FQ.length} questions spanning every module: multiple choice, scenario-based, architecture interpretation and short answers (self-graded against model answers). Your score maps to one of four proficiency levels.</p>
  <h2>Proficiency levels</h2><div id="lvls"></div>
  <div id="finRes"></div>
  ${window.SDV.quizHTML('final',FQ,'Final assessment')}
  <div class="btns"><a class="btn" href="#/progress">View my progress</a></div></div>`;
  function lv(p){let L=LEVELS[0];LEVELS.forEach(x=>{if(p>=x[1])L=x});return L;}
  function paintLevels(cur){document.getElementById('lvls').innerHTML=LEVELS.map(l=>`<div class="lvl${cur&&cur[0]===l[0]?' me':''}"><div class="lb" style="background:${l[2]}22;color:${l[2]};border:1px solid ${l[2]}66">${l[1]}%+</div><div><b>${l[0]}</b>${cur&&cur[0]===l[0]?' <span class="badge b-est">Your level</span>':''}<div class="small muted">${l[3]}</div><div class="tiny">Next step: ${l[4]}</div></div></div>`).join('');}
  window.SDV.finalResult=function(){const st=S.quiz.final;if(!st)return;let c=0;FQ.forEach((q,i)=>{const a=st.ans[i];const n=window.SDV.normQ(q);if(a!=null&&(n.sa?a===1:a===n.a))c++;});const p=Math.round(c/FQ.length*100);const L=lv(p);
    S.fin.last=p;S.fin.best=Math.max(S.fin.best||0,p);S.fin.level=lv(S.fin.best)[0];window.SDV.save();window.SDV.updateRing();window.SDV.buildNav();
    const box=document.getElementById('finRes');if(box){box.innerHTML=`<div class="card" style="border-color:${L[2]}"><div class="kicker">Result</div><div class="score"><span class="big">${p}%</span> — ${c}/${FQ.length} correct</div><p>Your level: <b style="color:${L[2]}">${L[0]}</b>. ${L[3]}</p><p class="small muted">Next step: ${L[4]}</p></div>`;box.scrollIntoView({behavior:'smooth',block:'start'});}
    paintLevels(L);window.SDV.toast(`Assessment complete: ${p}% — ${L[0]}`);};
  return {html,after:()=>{paintLevels(S.fin.best!=null?lv(S.fin.best):null);
    const st=S.quiz.final;if(st&&Object.keys(st.ans).length===FQ.length){const p=S.fin.last;if(p!=null){const L=lv(p);document.getElementById('finRes').innerHTML=`<div class="card" style="border-color:${L[2]}"><div class="kicker">Last result</div><div class="score"><span class="big">${p}%</span></div><p>Level: <b style="color:${L[2]}">${L[0]}</b> (best ${S.fin.best}%). Reset the quiz below to retake.</p></div>`;}}}};
};
/* ===== The big questions (FAQ) ===== */
EXTRA.faq=[
['What exactly happens inside a vehicle ECU?','An MCU boots via a bootloader (often verifying signatures), then an RTOS schedules periodic tasks: drivers read sensors, application runnables compute control decisions every few milliseconds, output drivers command actuators, a communication stack packs signals into network frames, and diagnostics record faults. In AUTOSAR Classic this is MCAL → ECU abstraction → RTE → SWC runnables → COM → bus.',[1,5,7]],
['Why does a car need so many ECUs?','Historically, each new feature arrived as a separate supplier-provided box near its sensors and actuators, which kept wiring short, isolated faults and simplified supplier contracts. After decades, premium cars accumulated roughly 70–150 ECUs. SDV architectures consolidate them.',[1,3]],
['Why are OEMs moving to zonal architectures?','To cut harness length, weight and cost, reduce ECU and chip variety, make I/O generic and scalable across models, and pair with central compute so software can be consolidated and updated. Zonal decouples where functions run from where wires go.',[3,10]],
['What exactly does AUTOSAR do?','It standardises the layered software architecture of ECUs, the interfaces of basic software modules, a configuration methodology and an exchange format (ARXML), so software from many companies can be integrated. Classic targets MCUs; Adaptive targets high-performance computers.',[7]],
['How does middleware connect applications to hardware?','Applications call middleware APIs (e.g., ara::com proxies); middleware serialises data and routes it via IPC or network protocols (SOME/IP, DDS) to other components, which in turn use OS services and drivers to reach hardware. Applications never need to know where peers live or how the network works.',[5,8]],
['How does a vehicle operating system work?','At kernel level, an OS schedules tasks, isolates memory and manages devices; vehicles run several OSes (RTOS, QNX, Linux, Android Automotive) often under a hypervisor. OEM “vehicle OS” brands bundle these with middleware, vehicle APIs, tools and cloud into a platform.',[6]],
['How do different controllers communicate?','Over in-vehicle networks: LIN and CAN/CAN FD for control and edge devices, Automotive Ethernet (with TSN) for the backbone and high-bandwidth sensors. Above the network, signals (communication matrices) or services (SOME/IP, DDS) carry meaning; gateways translate between them.',[8,11]],
['How does a vehicle receive software updates?','A signed package is built and released in the cloud, targeted to eligible vehicles, downloaded via the TCU, verified on-board, installed to inactive A/B slots or flash banks across ECUs, activated in a safe vehicle state, health-checked (with automatic rollback) and reported back — all under a Software Update Management System (UN R156).',[13]],
['How does cloud infrastructure interact with vehicle software?','The TCU links vehicle and cloud via MQTT/HTTPS over TLS. Data flows up for analytics, digital twins and AI training; configurations, commands, entitlements and OTA updates flow down. Anything safety-critical runs on-board without cloud dependency.',[12,17]],
['How do safety and cybersecurity influence architecture?','Safety drives redundancy, partitioning (freedom from interference), monitor architectures (ASIL D MCU supervising an ADAS SoC) and degradation concepts. Security drives HSMs, secure boot, segmentation, authenticated communication, service-level access control, IDS and a fleet security operations centre.',[14,15]],
['How do companies actually build SDVs?','With platform teams owning architecture and base software, feature teams building applications, suppliers delivering hardware and certified components, MBSE and AUTOSAR tooling, CI/CD with virtual ECUs, HIL farms, phased OTA releases — and partnerships where they lack scale or talent.',[18,19,20]],
['How do all these technologies fit together?','Physical vehicle → electronics/compute → networks → software foundation → middleware/platform → applications → connectivity/cloud, with safety, security, governance and DevOps cutting across. The master architecture and the three flow walkthroughs show the full picture.',[]],
['Why not just put a smartphone chip in the car?','Automotive chips need wider temperature ranges, 10–15-year availability, AEC-Q reliability qualification, functional-safety features and evidence, and long-term software support — which phone chips are not designed or supported for. Automotive variants of mobile-derived SoCs exist precisely to bridge this gap.',[4]],
['What happens to software support when a car is 12 years old?','Hardware headroom, OS/driver support windows, security patching obligations (UN R155 covers the vehicle lifecycle), cellular network sunsets and supplier contracts all limit how long a car can keep receiving updates. Planning support lifetimes is an architectural and commercial decision.',[13,15,22]],
['Who is responsible when an OTA update causes a problem?','The manufacturer’s update management system must assess impacts, validate and document updates; product-liability and type-approval obligations remain with the manufacturer. Contracts allocate responsibility with suppliers. Exact legal outcomes depend on jurisdiction — this is not legal advice.',[13,14]],
['Will software-defined cars become like phones with app stores?','Partly: some OEMs offer SDKs and app markets for in-vehicle apps, but safety, distraction rules, hardware diversity and OEM control mean car app ecosystems are more constrained than phones. How open vehicle platforms will become is still uncertain.',[9,23]],
];

    if(sort==='az')L=L.slice().sort((a,b)=>a.n.localeCompare(b.n));if(sort==='caught')L=L.filter(d=>S.dex[d.n]);

  return {html,after:()=>{draw();document.getElementById('dxQ').oninput=e=>{q=e.target.value;draw();};
    document.getElementById('dxT').onclick=e=>{const b=e.target.closest('[data-t]');if(!b)return;ty=S.dexTy=b.dataset.t;document.querySelectorAll('#dxT .chip').forEach(x=>x.classList.toggle('on',x===b));draw();};

4:'Match silicon to the job — MCUs for deterministic safety control, SoCs for heavy and AI workloads — and buy the headroom you will need in five years.',
5:'Vehicle software is a layered stack; isolation and determinism are what let safety-critical and consumer software share the same hardware.',
6:'Cars run several operating systems at once, each chosen for its criticality, and a hypervisor keeps them apart.',
7:'AUTOSAR is the supply chain’s common language: Classic for real-time MCUs, Adaptive for high-performance computers, joined by generated middleware.',
8:'Middleware lets software talk without knowing where its partner lives — choose SOME/IP, DDS, IPC or MQTT by what each data flow needs.',
9:'Service orientation turns the car into reusable capabilities that new features can combine — while plain signals still run low-level control.',
10:'Zones organise wiring and power by location so logic can live centrally — cutting harness, ECUs and cost, but demanding redundancy design.',
11:'Use the right network for each job: LIN and CAN at the edges, multi-gig Ethernet with TSN as the backbone — segmented and secured.',
12:'The SDV is half in the cloud: data flows up, decisions and software flow down — but anything safety-critical must work offline.',
13:'OTA is not a download; it is a signed, orchestrated, reversible operation on a whole fleet — the delivery engine of every SDV promise.',
14:'Functional safety is an architecture discipline: ASILs set the rigour, and monitors, redundancy and isolation make consolidation safe.',
15:'Every SDV feature is also an attack surface — security means defence in depth plus lifetime operations, not one firewall.',
16:'ADAS is the most demanding SDV workload; it depends on every layer from camera cables to cloud GPUs, and on a closed data loop.',
17:'Data is the SDV’s feedback loop — collect selectively, add context, govern it; most value comes from better products, not from selling data.',
18:'SDV development blends V-model rigour with DevOps speed; virtual testing and automated evidence make frequent, safe releases possible.',
19:'Toolchains span requirements to operations, glued by exchange formats — and no two OEMs use the same set.',
20:'No one builds an SDV alone; strategies range from full vertical integration to JVs, partnerships and open source — and keep shifting.',
21:'SDV economics rest more on lower costs, retention and reuse than on subscriptions — and customers punish paywalls on hardware they own.',
22:'SDV programs fail on integration, organisation and compute headroom more than on code; the transformation takes a decade, not a launch.',
23:'Central-zonal compute is established; AI-defined features, by-wire chassis and open platforms are emerging; full autonomy everywhere is speculation.'};

  <div class="pn">${prev?`<a class="btn" href="#/notes/${prev.n}">← ${pad(prev.n)} ${prev.t}</a>`:`<a class="btn" href="#/notes">← All notes</a>`}${next?`<a class="btn pri" href="#/notes/${next.n}">${pad(next.n)} ${next.t} →</a>`:`<a class="btn pri" href="#/notes">All notes →</a>`}</div></div>`;
}
function viewPractice(){
  const G=[['Explore',[['#/master','Master architecture','Tap any of 66 components','#13294b','▦'],['#/flows','Flow walkthroughs','Temperature · OTA · obstacle','#0f766e','⇢'],['#/cases','Case studies','Tesla, VW, Mercedes, BMW, Volvo, Rivian','#c2410c','◎'],['#/nova','Project NOVA','The course’s reference car','#0369a1','N'],['#/faq','Big questions','16 direct answers','#6d28d9','?']]],
   ['Drill',[['#/dex','SDV-Dex','Collect the components','#cc0000','◉'],['#/flash','Flashcards','30 architecture cards','#be185d','▣'],['#/glossary','Glossary','174 terms, A–Z','#15803d','A'],['#/compare','Comparisons','21 “X vs Y” tables','#a16207','⇄'],['#/map','Knowledge map','How modules connect','#475569','⌘']]],
   ['Prove it',[['#/capstone','Capstone','Design an SDV in 17 decisions','#6d28d9','◆'],['#/assess','Final assessment','56 questions, 4 levels','#1d4ed8','✓'],['#/progress','My progress','Scores and status','#15803d','%'],['#/refs','Sources','Every reference','#78716c','§']]]];
  return `<div class="wrap"><div class="kicker">Practice</div><h1>Explore, drill, prove it</h1><p class="lead">Everything beyond the modules — interactive tools to make the knowledge stick.</p>
  ${G.map(([g,ts])=>`<h2>${g}</h2><div class="grid" style="grid-template-columns:repeat(auto-fill,minmax(min(160px,45%),1fr))">${ts.map(([r,t,s,c,ic])=>`<a class="tile" href="${r}"><span class="ic" style="background:${c}">${ic}</span><b>${t}</b><span>${s}</span></a>`).join('')}</div>`).join('')}</div>`;
}
function viewModule(n,secAnchor){
  const m=MODULES.find(x=>x.n===n); if(!m) return notFound();
  S.visited[m.id]=1;
  const i=MODULES.indexOf(m), prev=MODULES[i-1], next=MODULES[i+1];
  let h=`<div class="wrap"><div class="modhead"><div class="kicker">Chapter ${m.ch[0]} · Module ${pad(m.n)} of ${MODULES.length}</div><h1>${m.t}</h1><p class="lead" style="margin-bottom:4px">${m.s}</p>
  <div class="metarow"><span>~${m.mins} min</span><span>${m.sec.length} sections</span><span>${m.quiz.length}-question check</span>${S.done[m.id]?'<span style="color:var(--green)">Completed</span>':''}</div></div>
  <div class="exec"><div class="ttl">Bottom line</div><p class="so">${m.ax}</p><ol>${m.take.slice(0,3).map(t=>`<li>${t}</li>`).join('')}</ol>
  <div class="btns" style="margin:12px 0 10px"><a class="btn sm navy" href="#/notes/${m.n}">2-min cheat sheet</a><button class="btn sm" data-scroll="${m.id}-quiz">Jump to quiz</button></div></div>
  <div class="toc"><div class="chips hscroll">${m.sec.map((s,k)=>`<button class="chip" data-scroll="${m.id}-s${k+1}">${m.n}.${k+1} ${s.h.length>34?s.h.slice(0,32)+'…':s.h}</button>`).join('')}<button class="chip" data-scroll="${m.id}-quiz">Quiz</button></div></div>
  ${m.intro||''}`;
  m.sec.forEach((s,k)=>{h+=`<section class="sec" id="${m.id}-s${k+1}"><h2><span class="sn">${m.n}.${k+1}</span><span>${s.h}</span></h2>${s.b||''}${s.l?layersHTML(s.l):''}${s.x||''}</section>`;});
  if(m.terms&&m.terms.length) h+=`<section class="sec"><h2><span class="sn">✦</span><span>Words to know</span></h2><p class="tiny" style="margin-top:-6px">Swipe →</p><div class="terms hscroll">${m.terms.map(([a,b])=>`<div class="term"><b>${a}</b><span>${b}</span></div>`).join('')}</div></section>`;
  if(m.mis&&m.mis.length) h+=`<section class="sec"><h2><span class="sn">✦</span><span>Myth vs fact</span></h2>${m.mis.map(([a,b])=>mis(a,b)).join('')}</section>`;
  h+=`<section class="sec"><h2><span class="sn">✦</span><span>Notes to remember</span></h2><div class="notes"><div class="ttl">✎ Key takeaways</div><ol class="take">${m.take.map(t=>`<li>${t}</li>`).join('')}</ol></div></section>`;
  if(m.links&&m.links.length) h+=`<section class="sec"><h2><span class="sn">✦</span><span>Connects to</span></h2>${m.links.map(([ln,why])=>{const lm=MODULES.find(x=>x.n===ln);return lm?`<a class="home-mod" href="#/m/${ln}" style="margin:8px 0"><span class="num">${pad(ln)}</span><span><b>${lm.t}</b><span>${why}</span></span><span class="go">›</span></a>`:''}).join('')}</section>`;
  h+=`<section class="sec" id="${m.id}-quiz">${quizHTML(m.id,m.quiz,`Check yourself · Module ${pad(m.n)}`)}<p class="tiny">Score 60%+ to complete the module automatically, or mark it manually.</p><div class="btns">${doneBtn(m)}</div></section>`;
  h+=`<div class="pn">${prev?`<a class="btn" href="#/m/${prev.n}">← ${pad(prev.n)}<br>${prev.t}</a>`:`<a class="btn" href="#/learn">← Course map</a>`}${next?`<a class="btn pri" href="#/m/${next.n}">${pad(next.n)} →<br>${next.t}</a>`:`<a class="btn pri" href="#/master">Master architecture →</a>`}</div></div>`;
  return {html:h,after:()=>{paintScore(m.id);if(secAnchor){const el=document.getElementById(m.id+'-'+secAnchor);if(el)setTimeout(()=>el.scrollIntoView({block:'start'}),80);}}};
}
function notFound(){return `<div class="wrap"><h1>Page not found</h1><p><a href="#/home">Back to home</a></p></div>`}

function viewProgress(){
  const {d,nm,pct}=progress();
  let rows=MODULES.map(m=>{const st=S.quiz[m.id];let sc='—';if(st&&QZ_len(m)){let c=0,n=0;m.quiz.map(normQ).forEach((q,i)=>{const a=st.ans[i];if(a!=null){n++;if(q.sa?a===1:a===q.a)c++;}});sc=n?`${c}/${m.quiz.length}${n<m.quiz.length?' (partial)':''}`:'—';}
    return [`<a href="#/m/${m.n}">${pad(m.n)} · ${m.t}</a>`,S.done[m.id]?'<span class="badge b-est">Complete</span>':(S.visited[m.id]?'<span class="badge b-pat">Started</span>':'<span class="tiny">Not started</span>'),sc];});
  return `<div class="wrap"><div class="kicker">Your learning record</div><h1>My progress</h1>
  <div class="card"><div class="grid g4"><div><b style="font-size:1.6rem">${pct}%</b><div class="tiny">overall</div></div><div><b style="font-size:1.6rem">${d}/${nm}</b><div class="tiny">modules complete</div></div><div><b style="font-size:1.6rem">${Object.keys(S.gloss).length}</b><div class="tiny">glossary terms learned</div></div><div><b style="font-size:1.6rem">${S.fin.best!=null?S.fin.best+'%':'—'}</b><div class="tiny">best final assessment${S.fin.level?' · '+S.fin.level:''}</div></div></div><div class="progressbar" style="margin-top:14px"><i style="width:${pct}%"></i></div></div>
  <h2>Modules & quiz scores</h2>${tbl(['Module','Status','Quiz'],rows)}
  <h2>Capstone</h2><p class="muted">${S.cap.finished?'Completed — <a href="#/capstone">view your blueprint</a>.':`${Object.keys(S.cap.ch||{}).length} of 17 decisions made. <a href="#/capstone">Continue the capstone →</a>`}</p>
  <h2>Data</h2><p class="small muted">Progress is stored only in this browser (localStorage). Clearing site data or using private browsing may erase it.</p>
  <div class="btns"><button class="btn" id="resetAll">Reset all progress</button></div></div>`;
}
function QZ_len(m){return m.quiz&&m.quiz.length}

/* ---------- Search ---------- */
let IDX=null;
const strip=h=>String(h).replace(/<[^>]+>/g,' ').replace(/&[a-z]+;/g,' ').replace(/\s+/g,' ').trim();
function buildIndex(){
  IDX=[];
  MODULES.forEach(m=>{
    IDX.push({t:`Module ${pad(m.n)} — ${m.t}`,s:strip(m.s+' '+(m.intro||'')),r:`#/m/${m.n}`,k:'Module',w:3});
    m.sec.forEach((s,k)=>{const txt=strip((s.b||'')+' '+(s.l?Object.values(s.l).join(' '):'')+' '+(s.x||''));IDX.push({t:`${m.n}.${k+1} ${s.h}`,s:txt,r:`#/m/${m.n}/s${k+1}`,k:`Module ${pad(m.n)}`,w:2});});
    (m.terms||[]).forEach(([a,b])=>IDX.push({t:a,s:strip(b),r:`#/m/${m.n}`,k:`Term · Module ${pad(m.n)}`,w:2}));
  });
  (EXTRA.glossary||[]).forEach(g=>IDX.push({t:g[0]+(g[1]?' — '+g[1]:''),s:strip(g[2]+' '+g[3]+' '+g[4]),r:`#/glossary/${encodeURIComponent(g[0])}`,k:'Glossary',w:2.5}));
  (EXTRA.cases||[]).forEach((c,i)=>IDX.push({t:'Case study: '+c.t,s:strip(Object.values(c.f).join(' ')),r:`#/cases/${i+1}`,k:'Case study',w:2}));
  (EXTRA.master||[]).forEach(L=>L.c.forEach(c=>IDX.push({t:c.n+' (master architecture)',s:strip(c.what+' '+c.does),r:`#/master/${encodeURIComponent(c.n)}`,k:`Layer ${L.n} · ${L.t}`,w:1.5})));
  buildDex().forEach(d=>IDX.push({t:`#${d.no} ${d.n} (SDV-Dex)`,s:strip(d.what+' '+d.does+' '+d.weak),r:`#/dex/${encodeURIComponent(d.n)}`,k:'SDV-Dex card',w:2.2}));
  MODULES.forEach(m=>IDX.push({t:`Cheat sheet · ${m.t}`,s:m.ax,r:`#/notes/${m.n}`,k:'Notes',w:1.8}));
  (EXTRA.faq||[]).forEach(f=>IDX.push({t:f[0],s:f[1],r:'#/faq',k:'Big question',w:2}));
  (EXTRA.compare||[]).forEach((c,i)=>IDX.push({t:'Compare: '+c.t,s:strip(c.rows.map(r=>r.join(' ')).join(' ')),r:`#/compare/${i}`,k:'Comparison',w:1.5}));
}
function doSearch(q){
  if(!IDX)buildIndex();
  q=q.trim().toLowerCase(); const out=$('#sresults');
  if(q.length<2){out.innerHTML='<p class="tiny">Type at least 2 characters. Try: <i>zone controller</i>, <i>SOME/IP</i>, <i>ASIL</i>, <i>A/B partition</i>, <i>CARIAD</i>.</p>';return;}
  const words=q.split(/\s+/);
  const res=[];
  for(const it of IDX){const tl=it.t.toLowerCase(),sl=it.s.toLowerCase();let sc=0;
    for(const w of words){if(tl.includes(w))sc+=10*it.w;else if(sl.includes(w))sc+=it.w;else{sc=0;break;}}
    if(tl.includes(q))sc+=20; if(sc>0)res.push([sc,it]);}
  res.sort((a,b)=>b[0]-a[0]);
  const hl=s=>{let r=esc(s);words.forEach(w=>{if(w.length<2)return;r=r.replace(new RegExp('('+w.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')+')','ig'),'<mark>$1</mark>')});return r};
  const snip=s=>{const i=s.toLowerCase().indexOf(words[0]);const a=Math.max(0,i-70);return (a?'…':'')+s.slice(a,a+190)+'…'};
  out.innerHTML=res.length?`<p class="tiny">${res.length} result${res.length>1?'s':''}</p>`+res.slice(0,50).map(([,it])=>`<a class="sres" href="${it.r}"><div class="tiny">${it.k}</div><div class="st">${hl(it.t)}</div><div class="ss">${hl(snip(it.s))}</div></a>`).join(''):'<p class="muted">No matches. Try a shorter or different term.</p>';
}
const ov=$('#searchOv'),sq=$('#sq');
function openSearch(o){ov.classList.toggle('on',o);if(o){setTimeout(()=>sq.focus(),50);doSearch(sq.value);}}
$('#searchBtn').onclick=()=>openSearch(true);
$('#sclose').onclick=()=>openSearch(false);
sq.addEventListener('input',()=>doSearch(sq.value));
ov.addEventListener('click',e=>{if(e.target===ov)openSearch(false);if(e.target.closest('.sres'))openSearch(false);});
document.addEventListener('keydown',e=>{if(e.key==='Escape'){openSearch(false);openNav(false);}if((e.key==='/'&&!/input|textarea/i.test(document.activeElement.tagName))||((e.metaKey||e.ctrlKey)&&e.key==='k')){e.preventDefault();openSearch(true);}});

/* ---------- Exhibits, tabs, theme, reading bar ---------- */
function numberExhibits(p){const pre=p[0]==='m'?p[1]+'.':'';let k=0;$$('.dia',main).forEach(d=>{if(d.querySelector(':scope>.exlbl'))return;k++;const sec=d.closest('.sec');const t=sec?sec.querySelector('h2 span:last-child'):null;d.insertAdjacentHTML('afterbegin',`<div class="exlbl">Exhibit ${pre}${k}${t?`<span>${t.textContent}</span>`:''}</div>`);});}
const TABMAP={home:'#/home',learn:'#/learn',m:'#/learn',dex:'#/dex',notes:'#/notes'};
function paintTabs(p0){const t=TABMAP[p0]||'#/practice';$$('#tabbar button').forEach(b=>b.classList.toggle('on',b.dataset.tab===t));}
$$('#tabbar button').forEach(b=>b.onclick=()=>go(b.dataset.tab));
function applyTheme(){const t=S.theme||'light';document.documentElement.dataset.theme=t;const mt=document.querySelector('meta[name=theme-color]');if(mt)mt.content=t==='dark'?'#0b0e15':'#f6f5f1';}
applyTheme();
$('#themeBtn').onclick=()=>{S.theme=(S.theme||'light')==='light'?'dark':'light';save();applyTheme();};
const readFg=$('#readFg');
function readBar(){const h=document.documentElement.scrollHeight-innerHeight;readFg.style.width=(h>0?Math.min(100,scrollY/h*100):0)+'%';}
window.addEventListener('scroll',readBar,{passive:true});
/* ---------- Bookmarks: remember position like a book ---------- */
let quietUntil=0,saveT=null;
function rememberScroll(){
  if(Date.now()<quietUntil)return;
  const h=curHash(),y=Math.round(scrollY);S.pos[h]=y;
  const mm=/^#\/m\/(\d+)/.exec(h);
  if(mm){const max=document.documentElement.scrollHeight-innerHeight;const f=max>0?Math.min(1,(y+innerHeight*0.4)/max):0;const id='m'+pad(+mm[1]);S.readp[id]=Math.max(S.readp[id]||0,Math.round(f*100));}
  clearTimeout(saveT);saveT=setTimeout(save,300);
}
window.addEventListener('scroll',()=>{if(!rememberScroll._t){rememberScroll._t=setTimeout(()=>{rememberScroll._t=null;rememberScroll();},250);}},{passive:true});
window.addEventListener('pagehide',()=>{rememberScroll();save();});
document.addEventListener('visibilitychange',()=>{if(document.hidden){rememberScroll();save();}});
/* ---------- Router ---------- */
const VIEWS=XVIEWS;
window.SDV={VIEWS,S,save,quizHTML,paintScore,QZ,toast,buildNav,updateRing,progress,normQ};
function route(){
  const hsh=curHash();
  const p=hsh.replace(/^#\//,'').split('/');
  let out;
  try{
    if(p[0]==='home'||p[0]==='') out=viewHome();
    else if(p[0]==='m') out=viewModule(+p[1],p[2]);
    else if(p[0]==='progress') out=viewProgress();
    else if(p[0]==='learn') out=viewLearn();
    else if(p[0]==='notes') out=viewNotes(p[1]?+p[1]:0);
    else if(p[0]==='practice') out=viewPractice();
    else if(VIEWS[p[0]]) out=VIEWS[p[0]](p.slice(1).map(decodeURIComponent));
    else out=notFound();
  }catch(err){console.error(err);out=`<div class="wrap"><h1>Something went wrong</h1><p class="muted">${esc(err.message)}</p><p><a href="#/home">Home</a></p></div>`;}
  const savedY=S.pos[hsh]||0;quietUntil=Date.now()+900;
  const html=typeof out==='string'?out:out.html;
  main.innerHTML=html;
  if(typeof closeDex==='function')closeDex();
  mountWidgets(main);
  numberExhibits(p);
  if(out&&out.after)out.after();
  paintTabs(p[0]);
  $$('.quiz',main).forEach(q=>paintScore(q.id.replace('qz-','')));
  if(!(out&&out.keepScroll))window.scrollTo({top:0,behavior:'instant'});
  const restorable=/^(m|notes|glossary|cases|refs|faq|master|nova)$/.test(p[0])&&!(p[0]==='m'&&p[2]);
  if(restorable&&savedY>250){setTimeout(()=>{window.scrollTo({top:savedY,behavior:'instant'});quietUntil=Date.now()+300;if(p[0]==='m'||firstRoute)toast('📖 Picked up where you left off');},60);}
  if(out&&out.after2)out.after2();
  if(p[0]!=='progress'){S.last=hsh;save();}
  buildNav(); updateRing();
  const rb=$('#resetAll'); if(rb) rb.onclick=()=>{if(confirm('Reset all progress, quiz answers, glossary marks and capstone decisions?')){for(const k of Object.keys(S))delete S[k];S.done={};S.quiz={};S.gloss={};S.cap={};S.fin={};S.visited={};S.dex={};S.dexSeen={};S.pos={};S.readp={};applyTheme();save();route();toast('Progress reset');}};
  readBar();
  document.title=(main.querySelector('h1')?main.querySelector('h1').textContent+' — ':'')+'SDV Masterclass';
}
window.addEventListener('hashchange',()=>{let h='';try{h=location.hash}catch(e){}if(h.startsWith('#/')&&h!==CUR){CUR=h;route();}});
window.SDV.route=route;window.SDV.go=go;
let firstRoute=true;
/* On launch, reopen the last page you were reading (like a book) */
(function(){let h='';try{h=location.hash}catch(e){}
  if((!h||h==='#'||h==='#/home')&&S.last&&/^#\/(m|notes|dex|glossary|cases|master|flows|capstone|assess)\//.test(S.last+'/')&&S.last!=='#/home'){CUR=S.last;try{history.replaceState(null,'',S.last)}catch(e){}}})();
function finalResult(){if(window.SDV.finalResult)window.SDV.finalResult();}
route();firstRoute=false;
})();
</script>
</body></html>
