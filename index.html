<title>SDV Masterclass — Software-Defined Vehicles from Silicon to Cloud</title>
<style>
/* ================= THEME TOKENS ================= */
:root,[data-theme=light]{
  --bg:#f6f5f1; --bg2:#efede6; --surf:#ffffff; --surf2:#f4f2ec; --surf3:#e9e6dd;
  --line:#e2dfd6; --line2:#d3cfc3;
  --tx:#141414; --tx2:#4b4b4b; --tx3:#7c7a74;
  --red:#cc0000; --red2:#a30000; --navy:#13294b; --navy2:#1e3a66;
  --blue:#1d4ed8; --blue2:#1d4ed8; --cyan:#0e7490; --violet:#6d28d9; --green:#047857; --amber:#b45309; --pink:#be185d;
  --hl:#fff1a8; --note:#fffbe8; --noteLine:#f1e6b3;
  --r:14px; --r2:10px; --r3:999px;
  --sh:0 1px 2px rgba(20,20,20,.04),0 6px 20px rgba(20,20,20,.06);
  --font:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Inter,Roboto,"Helvetica Neue",Arial,sans-serif;
  --disp:-apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI",Inter,Roboto,"Helvetica Neue",Arial,sans-serif;
  --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  --top:60px; --side:300px; --tab:74px; --sb:max(env(safe-area-inset-bottom),20px);
  color-scheme:light;
}
[data-theme=dark]{
  --bg:#0b0e15; --bg2:#0f1420; --surf:#131a29; --surf2:#182134; --surf3:#1f2a42;
  --line:#243049; --line2:#2e3c5a;
  --tx:#f2f4f8; --tx2:#b3bccb; --tx3:#8390a6;
  --red:#ff5a5a; --red2:#ff7b7b; --navy:#1b2c4f; --navy2:#25406d;
  --blue:#60a5fa; --blue2:#93c5fd; --cyan:#22d3ee; --violet:#a78bfa; --green:#34d399; --amber:#fbbf24; --pink:#f472b6;
  --hl:rgba(250,204,21,.28); --note:#1a1f2b; --noteLine:#2a3242;
  --sh:0 8px 24px rgba(0,0,0,.35);
  color-scheme:dark;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%;scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--tx);font-family:var(--font);font-size:18.5px;line-height:1.62;overflow-x:hidden;-webkit-font-smoothing:antialiased}
a{color:var(--blue);text-decoration:none} a:hover{text-decoration:underline}
img,svg{max-width:100%}
h1,h2,h3,h4{font-family:var(--disp);line-height:1.2;margin:0 0 .45em;letter-spacing:-.015em}
h1{font-size:clamp(1.75rem,6.4vw,2.6rem);font-weight:800}
h2{font-size:clamp(1.3rem,4.6vw,1.65rem);font-weight:750;margin-top:1.5em}
h3{font-size:1.12rem;font-weight:700;margin-top:1.1em}
h4{font-size:.74rem;font-weight:800;color:var(--tx3);text-transform:uppercase;letter-spacing:.1em}
p{margin:.5em 0 .85em}
ul,ol{padding-left:1.2em;margin:.35em 0 .9em} li{margin:.3em 0}
code{font-family:var(--mono);font-size:.86em;background:var(--surf2);border:1px solid var(--line);padding:.05em .36em;border-radius:6px;word-break:break-word}
strong,b{color:var(--tx);font-weight:700}
hr{border:0;border-top:1px solid var(--line);margin:2em 0}
::selection{background:var(--hl)}
button{font-family:inherit;font-size:inherit;color:inherit}
:focus-visible{outline:2px solid var(--red);outline-offset:2px;border-radius:6px}
mark,.hl{background:linear-gradient(transparent 45%,var(--hl) 45%);color:inherit;padding:0 .1em}

/* ================= TOP BAR ================= */
.topbar{position:sticky;top:0;z-index:50;height:calc(var(--top) + env(safe-area-inset-top));padding-top:env(safe-area-inset-top);display:flex;align-items:center;gap:8px;padding-left:max(12px,env(safe-area-inset-left));padding-right:max(12px,env(safe-area-inset-right));
  background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:saturate(180%) blur(16px);-webkit-backdrop-filter:saturate(180%) blur(16px);border-bottom:1px solid var(--line)}
.iconbtn{width:44px;height:44px;display:grid;place-items:center;border-radius:12px;border:1px solid var(--line);background:var(--surf);cursor:pointer;flex:0 0 auto;color:var(--tx)}
.brand{display:flex;align-items:center;gap:10px;min-width:0;flex:1;cursor:pointer}
.logo{width:30px;height:30px;border-radius:8px;background:var(--red);color:#fff;display:grid;place-items:center;font-weight:900;font-size:.72rem;letter-spacing:.02em;flex:0 0 auto}
.brand b{font-size:1.02rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:800}
.brand span{color:var(--tx3);font-size:.74rem;white-space:nowrap;display:block;line-height:1.1}
.ring{width:38px;height:38px;flex:0 0 auto}
@media (max-width:430px){.topbar{gap:6px}.brand{gap:8px}.logo{width:32px;height:32px}.brand b{font-size:.98rem}}
.readbar{position:fixed;left:0;right:0;top:calc(var(--top) + env(safe-area-inset-top));height:3px;z-index:49;pointer-events:none}
.readbar i{display:block;height:100%;width:0;background:var(--red);transition:width .1s linear}
@media (max-width:520px){.brand span{display:none}}

/* ================= LAYOUT ================= */
.shell{display:flex;min-height:calc(100vh - var(--top))}
.side{position:fixed;top:calc(var(--top) + env(safe-area-inset-top));left:0;bottom:0;width:var(--side);background:var(--bg2);border-right:1px solid var(--line);overflow-y:auto;z-index:60;transform:translateX(-102%);transition:transform .28s ease;padding:14px 10px 120px;overscroll-behavior:contain}
.side.open{transform:none;box-shadow:var(--sh)}
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.35);z-index:55;opacity:0;pointer-events:none;transition:opacity .25s}
.scrim.on{opacity:1;pointer-events:auto}
main{flex:1;min-width:0;padding:18px 16px calc(var(--tab) + 40px + var(--sb))}
.wrap{max-width:760px;margin:0 auto}
.wide{max-width:1180px;margin:0 auto}
@media (min-width:1100px){
  .side{transform:none;z-index:40}
  .scrim{display:none}
  main{margin-left:var(--side);padding:30px 40px 100px}
  #menuBtn,.tabbar{display:none!important}
}
.navgrp{margin:14px 0 4px;padding:0 10px;font-size:.68rem;letter-spacing:.12em;text-transform:uppercase;color:var(--tx3);font-weight:800}
.navitem{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:10px;color:var(--tx2);cursor:pointer;font-size:.9rem;line-height:1.3;border:1px solid transparent}
.navitem:hover{background:var(--surf);color:var(--tx);text-decoration:none}
.navitem.act{background:var(--surf);border-color:var(--line);color:var(--tx);box-shadow:inset 3px 0 0 var(--red)}
.navitem .num{width:26px;height:26px;border-radius:7px;display:grid;place-items:center;background:var(--surf);font-size:.7rem;font-weight:800;color:var(--tx2);flex:0 0 auto;border:1px solid var(--line)}

/* ================= BOTTOM TAB BAR (iPhone) ================= */
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:45;height:calc(var(--tab) + var(--sb));padding-bottom:var(--sb);padding-left:env(safe-area-inset-left);padding-right:env(safe-area-inset-right);display:flex;background:color-mix(in srgb,var(--surf) 90%,transparent);backdrop-filter:saturate(180%) blur(18px);-webkit-backdrop-filter:saturate(180%) blur(18px);border-top:1px solid var(--line)}
.tabbar button{flex:1;min-width:0;border:0;background:none;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;font-size:.74rem;font-weight:700;color:var(--tx3);cursor:pointer;letter-spacing:.02em}
.tabbar button svg{width:28px;height:28px}
.tabbar button.on{color:var(--red)}

/* ================= BASIC UI ================= */
.card{background:var(--surf);border:1px solid var(--line);border-radius:var(--r);padding:18px;box-shadow:var(--sh)}
.grid{display:grid;gap:12px}
.g2{grid-template-columns:repeat(auto-fit,minmax(min(260px,100%),1fr))}
.g3{grid-template-columns:repeat(auto-fit,minmax(min(210px,100%),1fr))}
.g4{grid-template-columns:repeat(auto-fit,minmax(140px,1fr))}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:12px 18px;border-radius:12px;border:1px solid var(--line2);background:var(--surf);color:var(--tx);cursor:pointer;font-weight:700;font-size:1rem;min-height:50px;text-decoration:none!important;transition:background .15s,border-color .15s,transform .1s}
.btn:active{transform:scale(.98)}
.btn:hover{background:var(--surf2)}
.btn.pri{background:var(--red);border-color:var(--red);color:#fff}
.btn.pri:hover{background:var(--red2)}
.btn.navy{background:var(--navy);border-color:var(--navy);color:#fff}
.btn.sm{padding:8px 13px;min-height:42px;font-size:.9rem;border-radius:10px}
.btn.ghost{background:transparent}
.btn[disabled]{opacity:.45;cursor:default}
.btns{display:flex;flex-wrap:wrap;gap:10px}
.chip{display:inline-flex;align-items:center;gap:6px;padding:8px 14px;border-radius:var(--r3);border:1px solid var(--line2);background:var(--surf);color:var(--tx2);font-size:.9rem;cursor:pointer;min-height:40px;line-height:1.2;font-weight:600;white-space:nowrap}
.chip:hover{color:var(--tx);text-decoration:none}
.chip.on{background:var(--tx);border-color:var(--tx);color:var(--bg)}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:10px 0}
.hscroll{display:flex;gap:10px;overflow-x:auto;scroll-snap-type:x mandatory;-webkit-overflow-scrolling:touch;padding:4px 2px 12px;margin:0 -16px;padding-left:16px;padding-right:16px;scrollbar-width:none}
.hscroll::-webkit-scrollbar{display:none}
.hscroll>*{scroll-snap-align:start;flex:0 0 auto}
.chips.hscroll{flex-wrap:nowrap}
.chips:not(.hscroll) .chip{white-space:normal;max-width:100%}
.badge{display:inline-block;font-size:.66rem;font-weight:800;letter-spacing:.06em;text-transform:uppercase;padding:3px 7px;border-radius:5px;vertical-align:middle;border:1px solid;white-space:nowrap}
.b-est{color:var(--green);border-color:color-mix(in srgb,var(--green) 40%,transparent);background:color-mix(in srgb,var(--green) 8%,transparent)}
.b-pat{color:var(--blue);border-color:color-mix(in srgb,var(--blue) 40%,transparent);background:color-mix(in srgb,var(--blue) 8%,transparent)}
.b-co{color:var(--cyan);border-color:color-mix(in srgb,var(--cyan) 40%,transparent);background:color-mix(in srgb,var(--cyan) 8%,transparent)}
.b-em{color:var(--violet);border-color:color-mix(in srgb,var(--violet) 40%,transparent);background:color-mix(in srgb,var(--violet) 8%,transparent)}
.b-sp{color:var(--amber);border-color:color-mix(in srgb,var(--amber) 40%,transparent);background:color-mix(in srgb,var(--amber) 8%,transparent)}
.b-an{color:var(--pink);border-color:color-mix(in srgb,var(--pink) 40%,transparent);background:color-mix(in srgb,var(--pink) 8%,transparent)}
.muted{color:var(--tx2)} .small{font-size:.95rem} .tiny{font-size:.82rem;color:var(--tx3)}
.kicker{font-size:.72rem;font-weight:800;letter-spacing:.14em;text-transform:uppercase;color:var(--red)}
.lead{font-size:1.06rem;color:var(--tx2)}
.progressbar{height:6px;border-radius:99px;background:var(--surf3);overflow:hidden}
.progressbar>i{display:block;height:100%;background:var(--red);border-radius:99px;transition:width .4s}

/* ================= HERO / COVER ================= */
.hero{position:relative;border-radius:18px;padding:26px 22px;background:var(--navy);color:#fff;overflow:hidden}
.hero::after{content:"";position:absolute;right:-60px;top:-60px;width:220px;height:220px;border-radius:50%;border:28px solid rgba(255,255,255,.06)}
.hero h1{color:#fff;margin-top:.25em}
.hero .kicker{color:#ff8a8a}
.hero .lead{color:rgba(255,255,255,.82)}
.hero .btn{border-color:rgba(255,255,255,.25);background:rgba(255,255,255,.08);color:#fff}
.hero .btn.pri{background:var(--red);border-color:var(--red)}
.hero .stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:18px}
.hero .stat b{display:block;font-size:1.35rem;color:#fff;font-family:var(--disp)}
.hero .stat span{font-size:.7rem;color:rgba(255,255,255,.65);line-height:1.2;display:block}
.hero .progressbar{background:rgba(255,255,255,.15)}
@media (max-width:420px){.hero .stats{grid-template-columns:repeat(2,1fr)}}

/* ================= BAIN-STYLE BLOCKS ================= */
.exec{border-top:3px solid var(--red);background:var(--surf);border-radius:0 0 var(--r) var(--r);padding:18px 18px 8px;box-shadow:var(--sh);margin:16px 0}
.exec .ttl{font-size:.7rem;font-weight:900;letter-spacing:.14em;text-transform:uppercase;color:var(--red);margin-bottom:6px}
.exec .so{font-family:var(--disp);font-size:1.25rem;font-weight:750;line-height:1.35;margin:0 0 12px;letter-spacing:-.01em}
.exec ol{list-style:none;padding:0;counter-reset:e;margin:0}
.exec ol li{counter-increment:e;position:relative;padding:10px 0 10px 38px;border-top:1px solid var(--line);font-size:1rem}
.exec ol li::before{content:counter(e);position:absolute;left:0;top:9px;width:24px;height:24px;border-radius:50%;background:var(--navy);color:#fff;display:grid;place-items:center;font-size:.74rem;font-weight:800}
.sowhat{background:var(--navy);color:#fff;border-radius:var(--r2);padding:14px 16px;margin:14px 0;font-weight:650;font-size:.98rem;line-height:1.45}
.sowhat b{color:#ffb3b3;font-size:.68rem;letter-spacing:.14em;text-transform:uppercase;display:block;margin-bottom:4px}
.metarow{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:.86rem;color:var(--tx3);font-weight:600;margin:8px 0}
.metarow span::before{content:"●";color:var(--red);margin-right:5px;font-size:.6rem;vertical-align:middle}

/* ================= MODULE ================= */
.modhead{margin:6px 0 4px}
.sec{margin:34px 0;scroll-margin-top:118px}
.sec>h2{display:flex;gap:12px;align-items:baseline;padding-top:16px;border-top:1px solid var(--line)}
.sec>h2 .sn{color:var(--red);font-size:1rem;font-weight:900;font-family:var(--disp);flex:0 0 auto}
.gterm,.case,.panel,#cmB,#finRes{scroll-margin-top:72px}
.toc{position:sticky;top:calc(var(--top) + env(safe-area-inset-top));z-index:20;background:color-mix(in srgb,var(--bg) 92%,transparent);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);margin:0 -16px;padding:6px 16px;border-bottom:1px solid var(--line)}
.toc .chips{margin:0}
.toc .hscroll{margin:0;padding:0 0 2px}
.layers{border:1px solid var(--line);border-radius:var(--r);background:var(--surf);overflow:hidden;margin:12px 0;box-shadow:var(--sh)}
.ltabs{display:grid;grid-template-columns:repeat(4,1fr);gap:3px;padding:4px;margin:10px 10px 0;background:var(--surf2);border-radius:11px}
.ltab{padding:9px 4px;border:0;background:transparent;color:var(--tx2);cursor:pointer;font-size:.86rem;font-weight:700;border-radius:8px;min-height:38px;line-height:1.15}
.ltab .ln{display:none}
.ltab .lf{display:inline}.ltab .ls{display:none}
@media (max-width:560px){.ltab .lf{display:none}.ltab .ls{display:inline}}
.ltab.on{background:var(--surf);color:var(--tx);box-shadow:0 1px 3px rgba(0,0,0,.12)}
.lbody{padding:14px 18px 8px}
.lpane{display:none;animation:fade .25s ease}
.lpane.on{display:block}
.lpane>:first-child{margin-top:0}
.lhint{font-size:.7rem;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:var(--tx3);margin-bottom:6px}
@keyframes fade{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
.call{border-radius:var(--r2);padding:13px 15px;margin:14px 0;border:1px solid var(--line);border-left:4px solid;background:var(--surf)}
.call .ct{font-weight:900;font-size:.68rem;letter-spacing:.12em;text-transform:uppercase;margin-bottom:4px}
.call>p:last-child,.call>ul:last-child{margin-bottom:0}
.c-nova{border-left-color:var(--cyan);background:color-mix(in srgb,var(--cyan) 5%,var(--surf))} .c-nova .ct{color:var(--cyan)}
.c-mis{border-left-color:var(--red)} .c-mis .ct{color:var(--red)}
.c-key{border-left-color:var(--navy);background:color-mix(in srgb,var(--navy) 6%,var(--surf))} .c-key .ct{color:var(--navy)}
[data-theme=dark] .c-key .ct{color:var(--blue2)}
.c-fail{border-left-color:var(--amber)} .c-fail .ct{color:var(--amber)}
.c-note{border-left-color:var(--violet)} .c-note .ct{color:var(--violet)}
.c-src{font-size:.88rem}
.myth{display:grid;grid-template-columns:1fr 1fr;border:1px solid var(--line);border-radius:var(--r2);overflow:hidden;margin:10px 0;background:var(--surf)}
.myth>div{padding:12px 14px;font-size:.98rem}
.myth>div:first-child{background:color-mix(in srgb,var(--red) 6%,var(--surf));border-right:1px solid var(--line)}
.myth b{display:block;font-size:.66rem;letter-spacing:.14em;text-transform:uppercase;margin-bottom:4px}
.myth>div:first-child b{color:var(--red)} .myth>div:last-child b{color:var(--green)}
@media (max-width:520px){.myth{grid-template-columns:1fr}.myth>div:first-child{border-right:0;border-bottom:1px solid var(--line)}}
.terms{display:grid;gap:10px;grid-template-columns:repeat(auto-fit,minmax(220px,1fr))}
.terms.hscroll{display:flex}
.term{padding:14px;border:1px solid var(--line);border-radius:12px;background:var(--surf);box-shadow:var(--sh);width:min(250px,72vw)}
.terms:not(.hscroll) .term{width:auto}
.term b{display:block;color:var(--red);font-size:1.02rem;margin-bottom:3px}
.term span{font-size:.95rem;color:var(--tx2)}
.notes{background:var(--note);border:1px solid var(--noteLine);border-radius:var(--r);padding:16px 18px 10px;box-shadow:var(--sh);
}
.notes .ttl{font-size:.7rem;font-weight:900;letter-spacing:.14em;text-transform:uppercase;color:var(--amber);margin-bottom:8px}
.take{counter-reset:t;list-style:none;padding:0;margin:0}
.take li{counter-increment:t;position:relative;padding:4px 0 6px 30px;margin:0 0 4px;line-height:1.55}
.take li::before{content:counter(t) ".";position:absolute;left:0;top:4px;font-weight:900;color:var(--red);font-family:var(--disp)}
.pn{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:30px}
.pn .btn{min-height:56px;font-size:.84rem;text-align:left;justify-content:flex-start;line-height:1.25}
.pn .btn.pri{justify-content:flex-end;text-align:right}

/* ================= TABLES ================= */
.tblw{overflow-x:auto;border-top:2px solid var(--tx);margin:14px 0;-webkit-overflow-scrolling:touch;background:var(--surf);border-radius:0 0 10px 10px}
table{border-collapse:collapse;width:100%;font-size:.92rem;min-width:540px}
th,td{padding:10px 12px;text-align:left;vertical-align:top;border-bottom:1px solid var(--line)}
th{color:var(--tx);font-weight:800;font-size:.78rem;text-transform:uppercase;letter-spacing:.06em;background:var(--surf)}
td:first-child{color:var(--tx);font-weight:700}
tr:last-child td{border-bottom:0}

/* ================= EXHIBITS / DIAGRAMS ================= */
.dia{border:1px solid var(--line);border-radius:var(--r);background:var(--surf);padding:14px;margin:16px 0;overflow-x:auto;-webkit-overflow-scrolling:touch;box-shadow:var(--sh)}
.exlbl{font-size:.68rem;font-weight:900;letter-spacing:.14em;text-transform:uppercase;color:var(--red);margin:0 0 10px;display:flex;justify-content:space-between;gap:10px;position:sticky;left:0}
.exlbl{flex-direction:column;gap:2px}
.exlbl span{color:var(--tx3);font-weight:700;letter-spacing:.02em;text-transform:none;font-size:.78rem}
.dia .cap{font-size:.76rem;color:var(--tx3);margin-top:10px;border-top:1px solid var(--line);padding-top:8px;position:sticky;left:0}
.dia svg{display:block;margin:0 auto}
@media (max-width:620px){.dia svg[width]{min-width:540px}}
.flow{display:flex;align-items:stretch;min-width:min-content;padding:4px 2px}
.flow.v{flex-direction:column;align-items:center}
.fbox{flex:0 0 auto;min-width:124px;max-width:200px;padding:10px 12px;border-radius:10px;border:1px solid var(--line2);background:var(--surf2);font-size:.86rem;line-height:1.35;text-align:center}
.fbox b{display:block;font-size:.9rem;color:var(--tx);margin-bottom:2px}
.fbox span{color:var(--tx2);font-size:.8rem}
.fbox.c1{border-color:color-mix(in srgb,var(--blue) 50%,transparent);background:color-mix(in srgb,var(--blue) 8%,var(--surf))}
.fbox.c2{border-color:color-mix(in srgb,var(--cyan) 50%,transparent);background:color-mix(in srgb,var(--cyan) 8%,var(--surf))}
.fbox.c3{border-color:color-mix(in srgb,var(--violet) 50%,transparent);background:color-mix(in srgb,var(--violet) 8%,var(--surf))}
.fbox.c4{border-color:color-mix(in srgb,var(--green) 50%,transparent);background:color-mix(in srgb,var(--green) 8%,var(--surf))}
.fbox.c5{border-color:color-mix(in srgb,var(--red) 50%,transparent);background:color-mix(in srgb,var(--red) 7%,var(--surf))}
.farr{flex:0 0 auto;display:grid;place-items:center;width:26px;color:var(--red);font-size:1.1rem;font-weight:900}
.flow.v .farr{width:auto;height:24px}
.stk{display:flex;flex-direction:column;gap:5px;min-width:290px}
.stk .row{display:flex;gap:5px}
.stk .lay{flex:1;padding:11px 13px;border-radius:9px;border:1px solid var(--line2);font-size:.9rem;background:var(--surf2)}
.stk .lay b{display:block;font-size:.93rem}
.stk .lay span{font-size:.82rem;color:var(--tx2)}
.stk .lay.click{cursor:pointer;transition:transform .12s,border-color .12s}
.stk .lay.click:hover{border-color:var(--red)}
.stk .lay.sel{border-color:var(--red);box-shadow:0 0 0 1px var(--red) inset}
.panel{border:1px solid var(--line);border-radius:var(--r2);background:var(--surf);padding:14px 16px;margin-top:12px;min-height:70px;animation:fade .2s;box-shadow:var(--sh)}

.panel dl{display:grid;grid-template-columns:minmax(110px,max-content) 1fr;gap:6px 14px;margin:8px 0 0;font-size:.96rem}
.panel dt{color:var(--tx3);font-weight:800;font-size:.8rem}
.panel dd{margin:0;color:var(--tx2)}
@media (max-width:560px){.panel dl{grid-template-columns:1fr}.panel dt{margin-top:6px}}
svg text{font-family:var(--font)}
.hot{cursor:pointer;transition:opacity .15s}
.hot.sel rect,.hot.sel circle,.hot.sel path{stroke:var(--red)!important;stroke-width:2.6!important}

/* ================= QUIZ ================= */
.quiz{border:1px solid var(--line);border-radius:var(--r);background:var(--surf);padding:18px;margin:16px 0;box-shadow:var(--sh);border-top:3px solid var(--navy)}
.qhead{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:6px}
.qitem{border-top:1px solid var(--line);padding:16px 0}
.qitem:first-of-type{border-top:0}
.qq{font-weight:700;margin-bottom:10px;line-height:1.45}
.qq .qn{color:var(--red);font-weight:900;margin-right:6px}
.qtype{font-size:.66rem;color:var(--violet);text-transform:uppercase;letter-spacing:.1em;font-weight:900;display:block;margin-bottom:4px}
.opt{display:flex;gap:10px;align-items:flex-start;width:100%;text-align:left;padding:13px 14px;margin:8px 0;border-radius:12px;border:1px solid var(--line2);background:var(--surf);cursor:pointer;font-size:1rem;line-height:1.45;min-height:46px;color:var(--tx)}

.qexp.on{display:block;animation:fade .25s}
textarea{width:100%;min-height:96px;border-radius:12px;border:1px solid var(--line2);background:var(--surf);color:var(--tx);padding:12px;font-family:inherit;font-size:16px;resize:vertical}

/* ================= SEARCH ================= */
.searchbox{display:flex;gap:8px;align-items:center;border:1px solid var(--line2);background:var(--surf);border-radius:14px;padding:4px 6px 4px 14px}

.sres .st{font-weight:700}
.sres .ss{font-size:.85rem;color:var(--tx2)}
.overlay{position:fixed;inset:0;z-index:80;background:color-mix(in srgb,var(--bg) 96%,transparent);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);display:none;padding:14px;padding-top:calc(14px + env(safe-area-inset-top));overflow-y:auto}

/* ================= GLOSSARY ================= */
.alpha{display:flex;flex-wrap:wrap;gap:5px;margin:10px 0}
.alpha button{width:36px;height:36px;border-radius:9px;border:1px solid var(--line2);background:var(--surf);color:var(--tx2);cursor:pointer;font-weight:700;font-size:.82rem}
.alpha button.on{background:var(--tx);color:var(--bg);border-color:var(--tx)}
.alpha button:disabled{opacity:.3;cursor:default}
.gterm{border:1px solid var(--line);border-radius:12px;background:var(--surf);margin:8px 0;overflow:hidden}
.gterm summary{list-style:none;cursor:pointer;padding:13px 16px;display:flex;align-items:center;gap:10px;min-height:50px}
.gterm summary::-webkit-details-marker{display:none}
.gterm summary::after{content:"+";margin-left:auto;color:var(--tx3);font-weight:700;font-size:1.2rem}
.gterm[open] summary::after{content:"–"}
.gterm summary .gf{color:var(--tx3);font-size:.84rem;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.gterm .gb{padding:0 16px 14px;font-size:.98rem}
.gterm .gb p{margin:.3em 0 .5em}
.gterm .gb .lbl{color:var(--red);font-weight:900;font-size:.66rem;text-transform:uppercase;letter-spacing:.12em;display:block;margin-top:8px}
.learned{font-size:.72rem;color:var(--green);font-weight:700}
.chk{display:inline-flex;align-items:center;gap:8px;font-size:.85rem;color:var(--tx2);cursor:pointer;margin-top:8px}
.chk input{width:20px;height:20px;accent-color:var(--green)}

/* ================= FLASHCARDS ================= */
.fc-stage{perspective:1200px;max-width:520px;margin:16px auto}
.fc{position:relative;height:340px;cursor:pointer;transform-style:preserve-3d;transition:transform .55s cubic-bezier(.2,.7,.2,1)}
.fc.flip{transform:rotateY(180deg)}
.fc .face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;border-radius:20px;border:1px solid var(--line);padding:24px;display:flex;flex-direction:column;justify-content:center;overflow:auto;box-shadow:var(--sh)}
.fc .front{background:var(--navy);color:#fff;text-align:center}
.fc .front .tiny{color:rgba(255,255,255,.6)}
.fc .front .w{font-size:2rem;font-weight:850;font-family:var(--disp)}
.fc .back{background:var(--surf);transform:rotateY(180deg);font-size:.95rem}
.fc .back b{color:var(--red)}

/* ================= CAPSTONE / MASTER / FLOWS ================= */
.cap-step{border:1px solid var(--line);border-radius:var(--r);background:var(--surf);padding:18px;margin:14px 0;box-shadow:var(--sh);border-top:3px solid var(--red)}
.cap-opt{display:block;width:100%;text-align:left;padding:13px 14px;margin:8px 0;border-radius:12px;border:1px solid var(--line2);background:var(--surf);cursor:pointer;line-height:1.45;color:var(--tx)}
.cap-opt.on{border-color:var(--red);box-shadow:0 0 0 1px var(--red) inset}
.cap-opt b{display:block;margin-bottom:2px}
.cap-opt span{font-size:.88rem;color:var(--tx2)}
.stepper{display:flex;gap:4px;flex-wrap:wrap;margin:12px 0}
.stepper i{width:22px;height:6px;border-radius:3px;background:var(--surf3);display:block}
.stepper i.d{background:var(--navy)} .stepper i.c{background:var(--red)}
.ma-layer{border:1px solid var(--line);border-radius:12px;margin:8px 0;padding:10px 12px;background:var(--surf)}
.ma-layer .lt{display:flex;align-items:center;gap:10px;margin-bottom:8px;font-weight:800;font-size:.88rem}
.ma-layer .lt i{font-style:normal;width:24px;height:24px;border-radius:7px;display:grid;place-items:center;font-size:.72rem;color:#111;font-weight:900}
.ma-comps{display:flex;flex-wrap:wrap;gap:6px}
.ma-c{padding:7px 11px;border-radius:9px;border:1px solid var(--line2);background:var(--surf2);font-size:.8rem;cursor:pointer;color:var(--tx2);min-height:36px;font-weight:600}
.ma-c.sel{color:var(--tx);border-color:var(--red);box-shadow:0 0 0 1px var(--red) inset;background:var(--surf)}
.ma-c.lit{color:#fff;border-color:var(--red);background:var(--red)}
.ma-c.dim{opacity:.35}
.sticky-panel{position:sticky;top:calc(var(--top) + 14px)}
.fstep{border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin:8px 0;background:var(--surf);cursor:pointer;opacity:.55;transition:opacity .2s,border-color .2s}
.fstep.on{opacity:1;border-color:var(--red);box-shadow:inset 3px 0 0 var(--red)}
.fstep.past{opacity:.85}
.fstep .fl{font-size:.66rem;color:var(--red);font-weight:900;letter-spacing:.1em;text-transform:uppercase}

/* ================= HOME / LISTS ================= */
.home-mod{display:flex;gap:12px;align-items:center;padding:13px 14px;border:1px solid var(--line);border-radius:12px;background:var(--surf);cursor:pointer;color:var(--tx);transition:border-color .15s}
.home-mod:hover{border-color:var(--tx3);text-decoration:none}
.home-mod .num{width:34px;height:34px;border-radius:9px;display:grid;place-items:center;background:var(--surf2);font-weight:850;font-size:.8rem;flex:0 0 auto;border:1px solid var(--line)}
.home-mod.done .num{background:var(--green);color:#fff;border-color:var(--green)}
.home-mod b{display:block;font-size:1rem;line-height:1.3}
.home-mod span{font-size:.85rem;color:var(--tx3)}
.home-mod .go{margin-left:auto;color:var(--tx3);font-size:1.1rem}
.chap{border:1px solid var(--line);border-radius:var(--r);background:var(--surf);margin:12px 0;overflow:hidden;box-shadow:var(--sh)}
.chap-h{padding:14px 16px;display:flex;gap:12px;align-items:center;border-bottom:1px solid var(--line)}
.chap-h .rn{font-family:Georgia,"Times New Roman",serif;font-size:1.5rem;font-weight:700;color:var(--red);width:38px;text-align:center}
.chap-h b{display:block;font-size:1rem}
.chap .home-mod{border:0;border-radius:0;border-bottom:1px solid var(--line)}
.chap .home-mod:last-child{border-bottom:0}
.jcard{width:min(240px,70vw);border-radius:var(--r);padding:16px;background:var(--surf);border:1px solid var(--line);box-shadow:var(--sh);color:var(--tx);display:block}
.jcard:hover{text-decoration:none}
.jcard .rn{font-family:Georgia,serif;color:var(--red);font-size:1.4rem;font-weight:700}
.tile{display:flex;flex-direction:column;gap:6px;padding:16px;border-radius:var(--r);background:var(--surf);border:1px solid var(--line);color:var(--tx);box-shadow:var(--sh);min-height:120px}
.tile:hover{text-decoration:none;border-color:var(--tx3)}
.tile .ic{width:38px;height:38px;border-radius:10px;display:grid;place-items:center;font-weight:900;color:#fff;font-size:1rem}
.tile b{font-size:1.04rem}
.tile span{font-size:.86rem;color:var(--tx3);line-height:1.35}
.ladder{display:flex;flex-direction:column-reverse;gap:6px}
.rung{display:flex;align-items:center;gap:12px;padding:11px 14px;border-radius:12px;border:1px solid var(--line2);background:var(--surf);cursor:pointer;min-height:48px}
.rung .lv{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;font-weight:800;font-size:.85rem;flex:0 0 auto}
.rung.sel{border-color:var(--red);box-shadow:0 0 0 1px var(--red) inset}
.toast{position:fixed;left:50%;bottom:calc(var(--tab) + 18px + var(--sb));transform:translateX(-50%) translateY(30px);background:var(--tx);color:var(--bg);padding:10px 16px;border-radius:12px;z-index:90;opacity:0;transition:all .3s;font-size:.9rem;pointer-events:none;max-width:90vw;font-weight:600}
.toast.on{opacity:1;transform:translateX(-50%)}
.case{border:1px solid var(--line);border-radius:var(--r);background:var(--surf);margin:12px 0;overflow:hidden;box-shadow:var(--sh)}
.case summary{list-style:none;cursor:pointer;padding:16px 18px;display:flex;gap:12px;align-items:center}
.case summary::-webkit-details-marker{display:none}
.case summary .cn{width:38px;height:38px;border-radius:10px;background:var(--navy);color:#fff;display:grid;place-items:center;font-weight:900;flex:0 0 auto}
.case .cb{padding:0 18px 18px}
.case h4{margin-top:16px;color:var(--red)}
.srcs{font-size:.78rem;color:var(--tx3);margin-top:8px}
.srcs a{word-break:break-word}
.lvl{display:flex;gap:12px;padding:12px 14px;border:1px solid var(--line);border-radius:12px;background:var(--surf);margin:8px 0}
.lvl .lb{width:46px;height:46px;border-radius:12px;display:grid;place-items:center;font-weight:850;flex:0 0 auto;font-size:.8rem}
.lvl.me{border-color:var(--red);box-shadow:0 0 0 1px var(--red) inset}

/* ================= SDV-DEX (classic 2016 Pokédex-app style) ================= */
.dexapp{max-width:620px;margin:0 auto;background:var(--surf);min-height:70vh;border-radius:18px;overflow:hidden;box-shadow:var(--sh)}
@media (max-width:700px){.dexapp{margin:-18px -16px 0;border-radius:0;box-shadow:none}}
.tpill{display:inline-flex;align-items:center;padding:2px 9px;border-radius:99px;font-size:.68rem;font-weight:850;letter-spacing:.06em;text-transform:uppercase;color:#fff;white-space:nowrap;line-height:1.6}
.tpills{display:flex;flex-wrap:wrap;gap:4px}
.tdot{width:9px;height:9px;border-radius:50%;display:inline-block}
.sprite{display:inline-grid;place-items:center;border-radius:50%;border:2px solid;flex:0 0 auto;background-clip:padding-box}
.dexbar{background:#d32f2f;color:#fff;padding:12px 16px 16px;position:relative;border-bottom:5px solid #9a1b1b}
.dexbar-top{display:flex;align-items:center;gap:8px;margin-bottom:8px}
.dexlens{width:38px;height:38px;border-radius:50%;background:radial-gradient(circle at 35% 35%,#e3f6ff,#29b6f6 45%,#0277bd);border:3px solid #fff;box-shadow:0 0 0 2px #7f1515;margin-right:6px}
.dexled{width:11px;height:11px;border-radius:50%;border:1.5px solid rgba(0,0,0,.25)}
.dexbar h1{color:#fff;margin:0;font-size:1.7rem;letter-spacing:-.01em}
.dexsub{font-size:.8rem;opacity:.9;margin:2px 0 10px}
.dexsub b{color:#fff}
.dexsearch{display:flex;align-items:center;gap:8px;background:#fff;color:#777;border-radius:12px;padding:0 12px;box-shadow:inset 0 2px 4px rgba(0,0,0,.15)}
.dexsearch input{flex:1;border:0;outline:0;background:transparent;font-size:16px;padding:11px 0;color:#141414;font-family:inherit;min-width:0}
.dexfilters{padding:10px 16px 6px;border-bottom:1px solid var(--line);background:var(--surf)}
.dexsort{display:inline-flex;background:var(--surf2);border-radius:9px;padding:3px;margin:8px 0 4px}
.dexsort button{border:0;background:transparent;padding:6px 12px;border-radius:7px;font-size:.78rem;font-weight:750;color:var(--tx2);cursor:pointer}
.dexsort button.on{background:var(--surf);color:var(--tx);box-shadow:0 1px 3px rgba(0,0,0,.12)}
.dexreg{padding:8px 16px;background:var(--surf2);font-size:.68rem;font-weight:850;letter-spacing:.12em;text-transform:uppercase;color:var(--tx3);border-bottom:1px solid var(--line)}
.dexrow{display:flex;align-items:center;gap:14px;padding:12px 16px;border-bottom:1px solid var(--line);color:var(--tx);background:var(--surf)}
.dexrow:hover{background:var(--surf2);text-decoration:none}
.dexrow:active{background:var(--surf3)}
.dr-mid{flex:1;min-width:0;display:flex;flex-direction:column;gap:3px}
.dr-no{font-family:var(--mono);font-size:.8rem;color:var(--tx3);font-weight:700}
.dr-nm{font-weight:800;font-size:1.1rem;line-height:1.2}
.ball{flex:0 0 auto;color:var(--tx3);opacity:.55}
.ball.on{opacity:1}
.dexhero{position:relative;color:#fff;padding:12px 16px 84px;overflow:hidden}
.dexhero h1{color:#fff;margin:10px 0 2px;font-size:2rem;text-shadow:0 1px 0 rgba(0,0,0,.08)}
.dh-top{display:flex;justify-content:space-between;align-items:center}
.dh-back{color:#fff;font-weight:800;font-size:.95rem;padding:6px 0}
.dh-no{font-family:var(--mono);font-weight:800;font-size:1.05rem;opacity:.9}
.dh-genus{font-size:.86rem;opacity:.9;font-weight:600;margin-bottom:8px}
.dh-types .tpill{background:rgba(255,255,255,.25)!important;border:1px solid rgba(255,255,255,.45)}
.dh-ball{position:absolute;right:-50px;top:30px;width:210px;height:210px;border-radius:50%;border:26px solid rgba(255,255,255,.14);pointer-events:none}
.dh-ball::before{content:"";position:absolute;left:-26px;right:-26px;top:50%;height:26px;margin-top:-13px;background:rgba(255,255,255,.14)}
.dh-ball::after{content:"";position:absolute;left:50%;top:50%;width:54px;height:54px;margin:-27px 0 0 -27px;border-radius:50%;border:16px solid rgba(255,255,255,.14);background:transparent}
.dh-nav{display:flex;justify-content:space-between;margin-top:12px;position:relative;z-index:2}
.dh-nav a{color:#fff;font-family:var(--mono);font-weight:800;font-size:.82rem;background:rgba(0,0,0,.14);padding:6px 10px;border-radius:99px}
.dh-sprite{position:absolute;left:50%;top:-80px;transform:translateX(-50%);z-index:3}
.dh-sprite .sprite{background:var(--surf)!important;border-width:4px;box-shadow:0 8px 24px rgba(0,0,0,.18)}
.dexpanel{position:relative;background:var(--surf);border-radius:26px 26px 0 0;margin-top:-26px;padding:60px 18px 20px;z-index:2}
.dextabs{display:flex;border-bottom:1px solid var(--line);margin:0 -4px 14px;overflow-x:auto;scrollbar-width:none}
.dextabs::-webkit-scrollbar{display:none}
.dextabs a{flex:1;text-align:center;padding:11px 4px;font-size:.9rem;font-weight:800;color:var(--tx3);border-bottom:3px solid transparent;white-space:nowrap}
.dextabs a:hover{text-decoration:none;color:var(--tx)}
.dexentry{font-size:1rem;line-height:1.6}
.dexinfo{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:14px 0;background:var(--surf2);border-radius:14px;padding:12px}
.dexinfo div{text-align:center}
.dexinfo small{display:block;font-size:.66rem;color:var(--tx3);font-weight:800;text-transform:uppercase;letter-spacing:.08em}
.dexinfo b{font-size:.86rem}
.dxh{margin:16px 0 4px}
.weak{color:#e5533d;font-weight:900}
.bstat{display:grid;grid-template-columns:122px 40px 1fr;align-items:center;gap:10px;padding:9px 0;font-size:.95rem}
.bs-k{color:var(--tx2);font-weight:700}
.bs-v{font-weight:850;text-align:right;font-family:var(--mono)}
.bs-bar{height:7px;border-radius:5px;background:var(--surf3);overflow:hidden}
.bs-bar i{display:block;height:100%;border-radius:5px}
.bstat.tot{border-top:1px solid var(--line);margin-top:4px}
.evochain{display:flex;align-items:center;justify-content:center;gap:4px;flex-wrap:wrap;padding:12px 0;border-bottom:1px solid var(--line)}
.evochain:last-child{border-bottom:0}
.evomon{display:flex;flex-direction:column;align-items:center;gap:4px;color:var(--tx);width:96px;text-align:center;padding:6px;border-radius:12px}
.evomon:hover{text-decoration:none;background:var(--surf2)}
.evomon b{font-size:.8rem;line-height:1.2}
.evomon small{font-family:var(--mono);font-size:.68rem;color:var(--tx3)}
.evomon.me{background:var(--surf2);box-shadow:inset 0 0 0 2px var(--line2)}
.evoarrow{display:flex;flex-direction:column;align-items:center;width:78px;text-align:center;color:var(--tx3)}
.evoarrow span{font-size:1.3rem;line-height:1}
.evoarrow small{font-size:.64rem;font-weight:700;line-height:1.2;margin-top:2px}
.evomon.me .sprite{box-shadow:0 0 0 3px var(--surf),0 0 0 5px currentColor}
@media (max-width:560px){.evochain{flex-direction:column;gap:0}.evoarrow{flex-direction:row;gap:8px;width:auto;padding:2px 0}.evoarrow span{transform:rotate(90deg)}.evomon{width:100%;flex-direction:row;gap:12px;padding:6px 14px;justify-content:flex-start}.evomon b{font-size:.92rem}}
.dexnote{color:var(--tx2);font-size:.92rem;padding:8px 0}
.pairs{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}
.pair{display:flex;align-items:center;gap:8px;padding:5px 12px 5px 5px;border:1px solid var(--line);border-radius:99px;color:var(--tx);font-size:.82rem;font-weight:700;background:var(--surf)}
.pair:hover{text-decoration:none;border-color:var(--tx3)}
.moves{border:1px solid var(--line);border-radius:12px;overflow:hidden}
.move{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:12px 14px;border-bottom:1px solid var(--line);font-size:.97rem}
.move:last-child{border-bottom:0}
.mv-nm{font-weight:700}
.catchbtn{width:100%;margin:22px 0 8px;min-height:52px}
.catchbtn .ball{opacity:1;color:#fff}
.print-only{display:none}
@media print{.topbar,.side,.scrim,.tabbar,.pn,.toc,.readbar{display:none!important}main{margin:0!important}.lpane{display:block!important}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

/* ===== Authoring helpers (used by content files) ===== */
const MODULES=[];

const L=(e,g,i,s)=>({e,g,i,s});
let _uid=0; const uid=p=>(p||'u')+(++_uid);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function layersHTML(o){
  const id=uid('ly');

  const have=T.filter(t=>o[t[2]]);
  return `<div class="layers" id="${id}"><div class="ltabs" role="tablist" style="grid-template-columns:repeat(${have.length},1fr)">${have.map((t,k)=>`<button class="ltab${k?'':' on'}" data-ly="${id}" data-k="${t[2]}" role="tab"><span class="lf">${t[0]}</span><span class="ls">${t[1]}</span></button>`).join('')}</div><div class="lbody">${have.map((t,k)=>`<div class="lpane${k?'':' on'}" data-p="${t[2]}"><div class="lhint">${['Simple version','How it works','In production','How it connects'][['e','g','i','s'].indexOf(t[2])]}</div>${o[t[2]]}</div>`).join('')}</div></div>`;
}
/* flow diagram: items = ['A|sub', ...] ; cls per item via 'c1:' prefix */
function flow(items,opt){
  opt=opt||{};
  const parts=items.map(it=>{let c='';const m=/^(c\d):/.exec(it);if(m){c=m[1];it=it.slice(3);}const [a,b]=it.split('|');return `<div class="fbox ${c}"><b>${a}</b>${b?`<span>${b}</span>`:''}</div>`;});
  const arrow=opt.v?'↓':(opt.both?'⇄':'→');
  return `<div class="dia"><div class="flow${opt.v?' v':''}">${parts.join(`<div class="farr">${arrow}</div>`)}</div>${opt.cap?`<div class="cap">${opt.cap}</div>`:''}</div>`;
}
/* stack diagram: rows top→bottom, each row array of 'Title|sub|color' */
function stack(rows,cap){
  const col={b:'rgba(59,130,246,.14)',c:'rgba(34,211,238,.12)',v:'rgba(167,139,250,.14)',g:'rgba(52,211,153,.12)',a:'rgba(251,191,36,.12)',r:'rgba(248,113,113,.12)',n:'var(--surf2)'};
  return `<div class="dia"><div class="stk">${rows.map(r=>`<div class="row">${r.map(x=>{const [t,s,c]=x.split('|');return `<div class="lay" style="background:${col[c||'n']}"><b>${t}</b>${s?`<span>${s}</span>`:''}</div>`}).join('')}</div>`).join('')}</div>${cap?`<div class="cap">${cap}</div>`:''}</div>`;
}
function tbl(head,rows,cap){
  return `<div class="tblw"><table><thead><tr>${head.map(h=>`<th>${h}</th>`).join('')}</tr></thead><tbody>${rows.map(r=>`<tr>${r.map(c=>`<td>${c}</td>`).join('')}</tr>`).join('')}</tbody></table></div>${cap?`<p class="tiny">${cap}</p>`:''}`;
}
const CT={nova:'Project NOVA',mis:'Common misconception',key:'Key insight',fail:'What happens when it fails',note:'Note',src:'Sources'};
function call(t,html,title){return `<div class="call c-${t}"><div class="ct">${title||CT[t]}</div>${html}</div>`;}
const nova=h=>call('nova',h);
const mis=(m,r)=>`<div class="myth"><div><b>Myth</b>${m}</div><div><b>Fact</b>${r}</div></div>`;

/* ============ MODULE 01 ============ */
MOD({n:1,id:'m01',t:'Understanding the Automotive Industry',s:'How a car works, why it is a network of computers, and who builds it',mins:40,
intro:`<p>Before we can understand software-defined vehicles, we need to understand the machine software is taking over. A modern car is not “a car with some computers in it” — it is a <strong>network of interconnected physical and electronic systems</strong>, built by a layered global supply chain, governed by safety regulation, and designed years before it is sold. Every SDV idea in later modules is a reaction to the problems described here.</p>`,
sec:[
{h:'How a traditional vehicle works',l:L(
`<p>Think of a car as a body with organs. The <strong>engine or motor</strong> is the heart that makes power. The <strong>transmission</strong> is like gears on a bicycle — it lets the heart work efficiently at different speeds. <strong>Brakes, steering and suspension</strong> are the muscles and joints that control where the body goes. The <strong>body</strong> (doors, lights, wipers, seats) is the skin and senses. And for the last 40 years, the car has also grown a <strong>nervous system</strong>: dozens of small computers and kilometres of wires that let all those organs talk to each other.</p><p>When you press the accelerator in a modern car, you are not pulling a cable to the engine. You are moving a sensor. A computer reads it, decides how much power to give, and commands the engine or motor. That one fact — <em>driver intent goes through software</em> — is where the whole SDV story begins.</p>`,
`<p>Energy flows from a store (fuel tank or battery) through a converter (internal combustion engine or electric motor + inverter) to a drivetrain (transmission, differential, half-shafts) to the wheels. Around that chain sit the <strong>chassis systems</strong> — braking (hydraulic circuits with ABS/ESC modulators), steering (today mostly electric power steering, EPS), suspension (passive, adaptive dampers or air) — and the <strong>body systems</strong> — lighting, access, climate (HVAC), seats, wipers.</p><p>Since the 1980s, most of these are <strong>mechatronic</strong>: a mechanical part, an electrical actuator (motor, solenoid, valve), sensors measuring its state, and an <strong>Electronic Control Unit (ECU)</strong> running a control loop: <em>read sensors → compute → command actuators → repeat</em>, often every 1–10 ms. The accelerator is “drive-by-wire” (electronic throttle). EPS uses a torque sensor in the column and an electric motor to assist. Brake systems use wheel-speed sensors and valves to prevent wheel lock.</p>`,
`<p>In production, each mechatronic system is usually bought as a complete unit from a supplier: the EPS rack <em>with</em> its ECU <em>and</em> its software comes from one Tier 1, the brake modulator from another. The OEM integrates them. This “black-box” buying model kept development parallel and liability clear for decades, but it is precisely what makes cross-system software features (and updates) hard — the OEM often does not own the code in its own car.</p>`,
`<p>Hold onto three ideas for the rest of the course: (1) <strong>control loops</strong> with timing deadlines are the fundamental unit of vehicle behaviour; (2) each loop historically lived in its <strong>own box</strong> from its <strong>own supplier</strong>; (3) the boxes communicate over <strong>in-vehicle networks</strong>. SDV architecture is about re-organising those three things — where loops run, who owns them, and how they talk.</p>`)},
{h:'Major subsystems — interactive vehicle overview',b:`<p>Tap any subsystem on the diagram to see what it does, which ECUs typically control it, which signals it exchanges and how it changes in an SDV. This is a generic vehicle; Project NOVA’s specific design comes later.</p>${W('vehicleOverview')}`},
{h:'Mechanical, electrical, electronic and software components',l:L(
`<p>Every function in a car uses up to four kinds of parts. Take the power window: the <strong>mechanical</strong> part is the glass and the regulator that slides it. The <strong>electrical</strong> part is the motor and wires. The <strong>electronic</strong> part is the little circuit board that decides when to run the motor. The <strong>software</strong> is the program on that board — which is why your window can do “one-touch up” and stop if it detects your hand (anti-pinch).</p>`,
`${tbl(['Kind','Examples','What it contributes'],[
['Mechanical','Gears, brake calipers, steering rack, suspension links, glass regulator','Force, motion, structure — the physical function'],
['Electrical','Wiring harness, fuses, relays, motors, batteries, connectors, 12 V/48 V/HV networks','Energy delivery and raw actuation'],
['Electronic','ECUs, sensors, power stages (MOSFET H-bridges), transceivers, PMICs','Sensing, signal conditioning, switching power precisely'],
['Software','Control algorithms, diagnostics, communication stacks, bootloaders, HMI','Behaviour, coordination, adaptability']])}<p>The trend over 40 years: functions that were mechanical became electrical, then electronic, then software-controlled. Anti-pinch, launch control, regenerative braking blend, “sport mode”: these are software behaviours on top of hardware capabilities.</p>`,
`<p>Industry rule of thumb ${B.an}: hardware cost is paid per vehicle; software cost is paid once and amortised across every vehicle (and can be improved after sale). That asymmetry is the economic engine of SDV — but it only works if the hardware was over-provisioned enough to run future software.</p>`,
`<p>An SDV deliberately pushes <em>variation</em> out of mechanical/electronic parts and into software, so one hardware design can serve many variants and evolve. The hardware becomes a stable, capable platform; software becomes where products are differentiated.</p>`)},
{h:'What is an ECU — and why does a car have so many?',l:L(
`<p>An <strong>ECU (Electronic Control Unit)</strong> is a small, rugged computer dedicated to one job — like a calculator wired into your car’s window, brakes or airbag. Why so many? Because every time engineers added a feature over the decades (ABS, airbags, parking sensors, heated seats), the easiest thing was to add <em>another little box</em> with its own chip and program. After 30 years of adding boxes, premium cars ended up with around a hundred of them.</p>`,
`<p>A typical ECU contains: a <strong>microcontroller (MCU)</strong> with CPU, on-chip flash and RAM; <strong>power supply</strong> circuitry (regulators, often a system-basis chip); <strong>input conditioning</strong> (ADCs, filters, protection) for sensors; <strong>output drivers</strong> (low/high-side switches, H-bridges, PWM) for actuators; <strong>network transceivers</strong> (CAN, LIN, Ethernet PHY); a <strong>watchdog</strong>; all in a sealed housing rated for heat, vibration, humidity and electromagnetic compatibility.</p><p>Its software runs in a fixed cycle: the bootloader starts, the OS schedules tasks (e.g., a 1 ms task for current control, a 10 ms task for logic, a 100 ms task for diagnostics), the communication stack packs and unpacks network messages, and diagnostics store fault codes (DTCs).</p><p><strong>Why many ECUs?</strong> (1) <em>Proximity</em>: putting electronics near sensors/actuators kept wires short. (2) <em>Supplier ownership</em>: each Tier 1 sold a complete box. (3) <em>Fault isolation</em>: a crash in the radio cannot affect the airbag. (4) <em>Real-time and safety</em>: dedicated hardware made timing and certification easier. (5) <em>Variants</em>: optional features = optional boxes.</p>`,
`<p>Commonly cited figures put modern premium vehicles at roughly 70–150 ECUs and tens of millions of lines of code ${B.an}. The costs of this model are now severe: wiring harnesses measured in kilometres and tens of kilograms; dozens of different chips (a vulnerability exposed by the 2021–2022 semiconductor shortage); software from dozens of suppliers that must be integrated and validated together; and updating the car means touching many boxes with different update mechanisms.</p>`,
`<p>The ECU count is the single best proxy for E/E architecture maturity. Distributed architectures have many small ECUs; domain and zonal architectures consolidate functions into fewer, more powerful computers (Module 03). Note that consolidation moves <em>software</em>, not physics — something still has to drive each motor and read each sensor, which is the job of zone controllers and smart actuators (Module 10).</p>`),
x:fail(`<p>If a single-purpose ECU fails, its function is lost (e.g., the seat stops moving) and the ECU logs a <code>DTC</code>; other ECUs notice missing messages (“timeout”) and enter substitute behaviour. Safety-relevant ECUs are designed to fail into a safe state — e.g., an EPS that loses its controller reverts to manual steering. Consolidation changes this calculus: when many functions share one computer, its failure modes must be engineered far more carefully (redundancy, partitioning — Modules 05 and 14).</p>`)},
{h:'Sensors and actuators — how the car feels and moves',l:L(
`<p><strong>Sensors</strong> are the car’s senses: they turn the physical world (speed, temperature, pressure, light) into electrical signals. <strong>Actuators</strong> are its muscles: they turn electrical commands into motion, heat, light or sound. An ECU sits between them like a brain.</p>`,
`${tbl(['Type','Examples','Typical interface'],[
['Position / angle','Accelerator pedal, steering angle, motor rotor resolver','Analog voltage, SENT, SPI, resolver excitation'],
['Speed','Wheel-speed sensors (Hall / magnetoresistive)','Current-modulated digital signal'],
['Pressure / temperature','Brake pressure, tyre pressure (TPMS), coolant, cell temperature','Analog, SENT, RF (TPMS), isoSPI (battery)'],
['Inertial','Accelerometers, gyros (airbag, ESC, IMU)','SPI, PSI5'],
['Environment','Cameras, radar, LiDAR, ultrasonic','GMSL / FPD-Link SerDes, Ethernet, CAN'],
['Actuators','Motors (windows, seats, EPS), solenoid valves (ABS), injectors, LEDs, heaters, compressors','PWM, H-bridge, high/low-side switch, LIN/CAN smart actuators']])}<p>Sensor values become <strong>signals</strong> (e.g., <code>VehicleSpeed = 87.4 km/h</code>, updated every 10 ms) that other ECUs consume. A “smart” sensor or actuator contains its own small MCU and speaks a bus protocol (LIN, CAN, SENT) instead of raw analog.</p>`,
`<p>The cost and reliability of sensors drive architecture. ADAS sensors (cameras, radar) generate huge data volumes — a single automotive camera can produce several Gbit/s of raw video — which forces high-speed links and powerful central processors. Meanwhile, body sensors (door switches) are cheap and numerous, favouring local aggregation in zone controllers.</p>`,
`<p>In an SDV, sensors and actuators become <strong>shared resources exposed as services</strong>: the rain sensor is not “owned” by the wiper ECU; its data is published so the wipers, the headlights and a cloud weather-map feature can all use it (Module 09).</p>`)},
{h:'How automotive electronics evolved',b:tbl(['Era','Milestones','What it meant'],[
['1960s–70s','Electronic fuel injection; emissions regulation (US Clean Air Act)','Electronics enter the engine bay for efficiency and emissions'],
['1978–80s','ABS in series production (1978); CAN bus developed by Bosch (published 1986)','Safety electronics; ECUs start talking over a shared bus'],
['1990s','First production CAN networks (early 1990s); OBD-II mandatory in the US (1996); ESC (1995); airbags widespread','Diagnostics standardised; networked chassis control'],
['2000s','FlexRay (first production 2006), MOST for media, LIN for body; navigation and Bluetooth','Dozens of ECUs, multiple networks, gateway ECUs appear'],
['2010s','Telematics and connected services; Tesla Model S OTA updates (2012); ADAS cameras/radar; Automotive Ethernet','Cars connect to the cloud; software updates become possible'],
['2017–2020s','Centralised compute (e.g., Tesla Model 3); domain controllers; UN R155/R156 (2021); zonal architectures','The software-defined vehicle era begins'],
])+`<p class="tiny">Dates are widely documented industry milestones ${B.est}.</p>`},
{h:'OEMs, Tier 1, Tier 2 and Tier 3 — the supply chain',l:L(
`<p>An <strong>OEM</strong> (Original Equipment Manufacturer) is the car brand — Toyota, BMW, Tata Motors. The OEM designs the car and assembles it, but buys most parts. <strong>Tier 1</strong> suppliers sell complete systems (a brake system, a seat, an infotainment unit) directly to the OEM. <strong>Tier 2</strong> suppliers sell parts to Tier 1s (chips, sensors, circuit boards). <strong>Tier 3</strong> supply raw materials and basic components. It is like a restaurant (OEM) buying ready-made sauces (Tier 1), whose makers buy tomatoes (Tier 2) from farms (Tier 3).</p>`,
`${flow(['c1:Tier 3|raw materials, basic parts','c2:Tier 2|chips, sensors, PCBs, software stacks','c3:Tier 1|complete systems: brakes, EPS, IVI, ADAS ECUs','c4:OEM|design, integration, assembly, brand','c5:Customer|dealer / direct sales'],{cap:'Classic automotive value chain. Typically 70–80% of vehicle value is commonly cited as purchased from suppliers (estimate).'})}<p>Contracts are awarded per vehicle program through <strong>sourcing</strong> (RFQ → nomination), and suppliers deliver against specifications (requirements documents, interface definitions such as DBC/ARXML files). Quality is governed by IATF 16949 and processes like PPAP (Production Part Approval Process).</p>`,
`<p>SDV is reshaping this pyramid. Semiconductor companies (NVIDIA, Qualcomm) now negotiate directly with OEMs — sometimes called “Tier 0.5”. Software vendors (QNX, Elektrobit, Vector) supply platform software that OEMs integrate themselves. Many OEMs now <em>in-source</em> software and specify hardware “white-box”, with the OEM writing the application code that the Tier 1 used to own ${B.pat}. Some Tier 1s respond by offering central computers and zone controllers as products (e.g., Bosch, ZF, Aptiv, Continental’s automotive spin-off AUMOVIO).</p>`,
`<p>Who owns the software determines who can update it, who can monetise it and who carries liability. Keep this question — “who owns this layer?” — in mind when we reach business models (Module 21) and the ecosystem map (Module 20).</p>`)},
{h:'Vehicle development lifecycle, platforms and variants',l:L(
`<p>Designing a new car traditionally takes about 3–5 years, and then the model is sold for about 6–7 years (with a mid-life facelift). So the computer chips chosen at the start are 10+ years old by the end! Carmakers also reuse a <strong>platform</strong> — a shared skeleton of floor, axles and electronics — across many models, the way a phone maker reuses one chip across several phones.</p>`,
`${flow(['Concept|targets, packaging','Design & engineering|CAD, E/E, software specs','Prototypes|mules, test cars','Validation|durability, winter/summer, crash','Homologation|type approval','SOP|start of production','In-market|updates, facelift','EOP|end of production'],{cap:'Gated development (milestone reviews at each gate). Software historically froze months before SOP.'})}<p><strong>Variants</strong> multiply complexity: engines × trims × markets × options can yield an astronomical number of theoretical configurations. Each needs the right software configuration (variant coding), the right ECUs, and validation.</p>`,
`<p>Traditional software followed the hardware gate plan: frozen before SOP, rarely changed afterwards except via dealer reflash. SDV programs decouple the software cadence from the vehicle cadence — software releases continue for the vehicle’s life. This is why OEMs now talk about the <strong>“vehicle as a product that ships, then keeps improving”</strong>. It requires sufficient spare compute (“headroom”), OTA, and continuous validation (Module 18).</p>`,
`<p>Platforms are where SDV economics live: one E/E architecture + one software platform reused across many models (e.g., Volvo’s “Superset” idea, Module 23 & case studies) amortises enormous software investment.</p>`)},
{h:'ICE, HEV, PHEV, BEV, FCEV — and why electrification exploded software complexity',l:L(
`<p><strong>ICE</strong>: only a combustion engine. <strong>HEV</strong> (hybrid): engine + small battery + motor; you never plug it in. <strong>PHEV</strong> (plug-in hybrid): bigger battery you can charge, some pure-electric range. <strong>BEV</strong> (battery electric): only battery and motors. <strong>FCEV</strong> (fuel cell): makes electricity from hydrogen on board. Electric cars are mechanically simpler but electronically busier: a computer must manage every battery cell, the charging, the heat and the motors.</p>`,
`${tbl(['Type','Energy store','Key electronics/software added'],[
['ICE','Fuel tank','Engine control (injection, ignition), transmission control, emissions aftertreatment'],
['HEV','Fuel + small HV battery','Hybrid supervisory controller blending engine and motor, regen braking, BMS'],
['PHEV','Fuel + medium HV battery','All of HEV + on-board charger (OBC), charge scheduling, EV-mode strategy'],
['BEV','Large HV battery (often 400 V or 800 V)','BMS with cell monitoring, inverter control, OBC, DC-DC, thermal heat pump, charging communication (e.g., ISO 15118), range prediction'],
['FCEV','Hydrogen tank + buffer battery','Fuel-cell stack control, hydrogen safety monitoring, power split']])}<p>Electrification adds <strong>energy-management software that couples many domains</strong>: the BMS, thermal system, motors, brakes (regen blending) and navigation (route-based preconditioning) must cooperate in real time.</p>`,
`<p>Electrification was the forcing function for SDV: new EV platforms were clean-sheet designs, so OEMs could choose new E/E architectures without legacy constraints. Range, charging speed and efficiency are heavily software-defined (battery models, thermal strategies), so improvements can ship by OTA — making the software-update capability commercially valuable.</p>`,
`<p>EVs turn the car into an <strong>energy system</strong> — the BMS talks to the charger, the grid (V2G, Module 23), the thermal system and the cloud (battery analytics, Module 17). That cross-domain coupling is exactly what a centralised, service-oriented architecture handles better than isolated boxes.</p>`),
x:nova(`<p>Project NOVA is a BEV crossover with an 800 V battery, two motors, a heat-pump thermal system and DC fast charging. Its battery-management function alone touches the battery pack, the thermal loop, the charge port, the motors, the dashboard and the cloud — a perfect example of why NOVA’s designers chose central compute plus zones (Module 03) instead of dozens of separate boxes.</p>`)}
],
