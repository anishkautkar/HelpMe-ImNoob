WIDGETS.otaLife=function(el){
  const S=[['Develop','Code change, review, CI build, unit tests.','Cloud / developer'],['Verify & validate','SIL/HIL/vehicle tests, regression, safety & security assessment.','Test infrastructure'],['Release','Freeze, SBOM, compatibility matrix, R156 impact assessment.','Release mgmt'],['Package & sign','Manifest, delta generation, signatures from backend HSM.','Signing service'],['Campaign','Targeting, phases, preconditions, halt rules.','OTA backend'],['Notify & download','Vehicle polls/receives notification; downloads via CDN over TLS.','TCU'],['Verify on-board','Signature and hash checks, compatibility checks.','CVC update master'],['Install','Write to inactive slots/banks across ECUs.','CVC + ECUs'],['Activate','Safe state, consent, atomic switch, reboot.','Vehicle'],['Post-check & rollback','Health checks; automatic rollback if failure.','Bootloader / PHM'],['Report & monitor','Status, inventory, telemetry; expand or halt.','Cloud analytics']];
  let i=0;
  el.innerHTML=`<div class="dia"><svg viewBox="0 -22 640 335" width="640" id="otaSvg"></svg></div><div class="btns"><button class="btn sm" id="otaP">← Back</button><button class="btn sm pri" id="otaN">Next →</button><button class="btn sm ghost" id="otaPlay">▶ Auto-play</button></div><div class="panel" id="otaD"></div>`;
  function draw(){let s='';const cx=320,cy=150,R=118;
    S.forEach((st,k)=>{const a=-Math.PI/2+k*2*Math.PI/S.length;const x=cx+R*1.85*Math.cos(a)*0.72,y=cy+R*Math.sin(a);const on=k===i,past=k<i;
      s+=`<g class="hot" data-k="${k}"><circle cx="${x}" cy="${y}" r="${on?24:19}" fill="${on?'rgba(34,211,238,.25)':(past?'rgba(52,211,153,.15)':'#111a2c')}" stroke="${on?'#22d3ee':(past?'#34d399':'#2c3d5c')}" stroke-width="2"/><text x="${x}" y="${y+4}" text-anchor="middle" font-size="12" fill="#fff" font-weight="700">${k+1}</text><text x="${x}" y="${y+(y<cy?-30:38)}" text-anchor="middle" font-size="10.5" fill="${on?'#e6edf8':'#7d8aa3'}">${st[0]}</text></g>`;});
    s+=`<text x="${cx}" y="${cy-4}" text-anchor="middle" font-size="13" fill="#e6edf8" font-weight="700">OTA lifecycle</text><text x="${cx}" y="${cy+14}" text-anchor="middle" font-size="10.5" fill="#7d8aa3">continuous loop</text>`;
    el.querySelector('#otaSvg').innerHTML=s;
    el.querySelector('#otaD').innerHTML=`<div class="kicker">Stage ${i+1} of ${S.length} · ${S[i][2]}</div><h3>${S[i][0]}</h3><p>${S[i][1]}</p>`;
    el.querySelectorAll('#otaSvg .hot').forEach(g=>g.onclick=()=>{i=+g.dataset.k;draw()});}
  el.querySelector('#otaN').onclick=()=>{i=(i+1)%S.length;draw()};
  el.querySelector('#otaP').onclick=()=>{i=(i-1+S.length)%S.length;draw()};
  let t=null;el.querySelector('#otaPlay').onclick=e=>{if(t){clearInterval(t);t=null;e.target.textContent='▶ Auto-play';return;}e.target.textContent='❚❚ Pause';t=setInterval(()=>{if(!document.body.contains(el)){clearInterval(t);return;}i=(i+1)%S.length;draw()},2200)};
  draw();
};

/* ============ MODULE 14 ============ */
MOD({n:14,id:'m14',t:'Functional Safety and Automotive Standards',s:'ISO 26262, ASILs, safety concepts, SOTIF, ASPICE, ISO/SAE 21434, UN R155/R156',mins:65,
intro:`<p>A software bug in a phone is annoying; in a steering system it can kill. Functional safety is the discipline that ensures electrical/electronic systems don’t cause unacceptable risk when they malfunction. It deeply shapes SDV architecture — especially consolidation and OTA.</p>`,
sec:[
{h:'Functional safety and ISO 26262',l:L(`<p>Functional safety asks: “If this electronic system breaks or misbehaves, could someone get hurt — and what have we done to prevent it?” ISO 26262 is the rulebook carmakers follow to answer that question systematically.</p>`,
`<p><strong>ISO 26262</strong> “Road vehicles — Functional safety” (2nd edition 2018, 12 parts) addresses hazards caused by <em>malfunctioning behaviour</em> of E/E systems — from systematic faults (design/software errors) and random hardware faults. Structure: Part 2 safety management; Part 3 concept phase (item definition, HARA, functional safety concept); Part 4 system; Part 5 hardware; Part 6 software; Part 7 production/operation; Part 8 supporting processes (configuration, change, tool qualification); Part 9 ASIL-oriented analyses (decomposition, dependent failures); Part 10 guideline; Part 11 semiconductors; Part 12 motorcycles. It uses a <strong>V-model safety lifecycle</strong>.</p>`,
`<p>ISO 26262 is not a law but is the state of the art used in product-liability and type-approval contexts; OEMs require supplier compliance contractually ${B.est}.</p>`,
`<p>Safety drives architecture: ASIL decomposition, redundancy, freedom from interference and safety monitors are architectural patterns, not afterthoughts.</p>`)},
{h:'HARA and ASIL determination (interactive)',b:`<p>Hazard Analysis and Risk Assessment rates each hazardous event by <strong>Severity</strong> (S0–S3), <strong>Exposure</strong> (E0–E4) and <strong>Controllability</strong> (C0–C3) to determine the ASIL (A lowest, D highest; QM = no ASIL needed). Try it:</p>${W('asilCalc')}`},
{h:'Safety goals, functional and technical safety concepts',l:L(`<p>First write the big promise (“the steering must never suddenly turn on its own”). Then decide what the system must do to keep that promise. Then decide exactly which hardware and software will do it.</p>`,
`${flow(['c1:Item definition|function, boundaries','c2:HARA|hazardous events → ASIL','c3:Safety goals|top-level requirements','c4:Functional safety concept|FSRs, safe states, FTTI','c5:Technical safety concept|TSRs mapped to HW/SW','c1:HW & SW safety requirements|implementation'])}<ul><li><strong>Safety goal</strong> (example, EPS): “Avoid unintended steering torque exceeding X Nm” — ASIL D.</li><li><strong>Safe state</strong>: e.g., assist off (manual steering), or degraded assist.</li><li><strong>FTTI</strong> (Fault Tolerant Time Interval): time from fault to hazard — detection + reaction must be faster.</li><li><strong>Functional safety concept</strong>: e.g., torque command plausibility check, independent monitoring channel.</li><li><strong>Technical safety concept</strong>: e.g., dual torque sensors, lockstep MCU, independent watchdog, motor shutdown path.</li></ul>`,
`<p>OEMs typically own items and safety goals; Tier 1s deliver systems with safety cases; semiconductor suppliers provide Safety Elements out of Context (SEooC) with assumptions of use ${B.pat}.</p>`,
`<p>In SDVs, OTA changes can affect safety concepts; impact analysis must be part of every release.</p>`)},
{h:'Safety mechanisms: redundancy, detection, tolerance, fail-safe vs fail-operational',l:L(`<p>A safety mechanism is a built-in watchdog. Some systems simply stop safely when something breaks (fail-safe). Others, like steering in a car that drives itself, must keep working even after a failure (fail-operational) — they need a backup.</p>`,
`<ul><li><strong>Fault detection</strong>: watchdogs, lockstep comparison, ECC, CRC/E2E protection on messages, plausibility checks, range checks, sensor cross-checks.</li><li><strong>Fault tolerance</strong>: redundancy (hardware duplication, diverse software), voting (2oo3), graceful degradation.</li><li><strong>Fail-safe</strong>: transition to safe state on fault (e.g., disable assist). Works when a human driver can take over.</li><li><strong>Fail-operational</strong>: continue operating (perhaps degraded) after a fault — needed for steer-by-wire, brake-by-wire and higher automation (L3+) where the human is not immediately available.</li><li><strong>ASIL decomposition</strong>: splitting a requirement onto independent redundant elements (e.g., ASIL D = ASIL B(D) + ASIL B(D)) — requires proof of independence.</li></ul>`,
`<p>Examples: dual-winding EPS motors and redundant power feeds; brake-by-wire with hydraulic or electronic backup; L3 systems with redundant compute, power and actuation ${B.pat}.</p>`,
`<p>Fail-operational requirements ripple across zonal design: redundant power paths, dual backbone paths, two compute channels.</p>`)},
{h:'Freedom from interference, safety cases, V&V and safety management',l:L(`<p>When safe and less-safe software share one computer, you must prove the less-safe one can’t mess up the safe one — that’s freedom from interference. A safety case is the evidence folder that convinces experts the system is safe.</p>`,
`<ul><li><strong>Freedom from interference (FFI)</strong>: in space (memory protection), time (scheduling budgets, watchdogs) and communication (E2E protection) — enabling mixed-criticality integration.</li><li><strong>Software safety requirements</strong>: derived from TSRs; implemented with coding guidelines, architectural design principles; verified by reviews, static analysis, testing with coverage.</li><li><strong>Verification</strong> (did we build it right?) vs <strong>validation</strong> (did we build the right thing — is the vehicle-level safety goal met?).</li><li><strong>Safety case</strong>: structured argument + evidence that safety goals are achieved.</li><li><strong>Safety management</strong>: roles, safety plans, confirmation measures (confirmation reviews, functional safety audits, functional safety assessment), independence levels by ASIL.</li></ul>`,
`<p>Safety cases for continuously updated software are an active challenge — how to keep the case valid across frequent releases (incremental safety cases, automated evidence generation) ${B.em}.</p>`,
`<p>Safety evidence generation is increasingly automated in CI pipelines (Module 18).</p>`)},
{h:'Beyond ISO 26262: SOTIF, ASPICE, ISO/SAE 21434, UN R155 and R156',b:tbl(['Standard','Addresses','Key idea','Example'],[
['ISO 26262','Malfunctions of E/E systems','Risk-based ASIL, safety lifecycle','EPS sends unintended torque due to fault'],
['ISO 21448 (SOTIF)','Hazards from functional insufficiencies with no fault (performance limits, misuse)','Identify and reduce unknown unsafe scenarios','Camera misclassifies a white truck against bright sky — no component failed'],
['Automotive SPICE (ASPICE)','Process capability for system/software development','Assessed capability levels 0–5 (v4.0 released 2023)','OEM requires suppliers at level 2 or 3'],
['ISO/SAE 21434','Cybersecurity engineering across lifecycle','TARA (threat analysis and risk assessment), CAL','Attack path analysis for TCU'],
['UN R155','Cybersecurity Management System (CSMS) for type approval','Organisation must manage cyber risk across lifecycle','Mandatory for new vehicles in EU since July 2024'],
['UN R156','Software Update Management System (SUMS)','Controlled, documented updates; RXSWIN','OTA process audited'],
['UN R157','Automated Lane Keeping Systems (ALKS)','Approval of certain L3 functions','Highway L3 systems'],
],'Applicability and dates depend on jurisdiction; UNECE regulations apply in contracting parties (e.g., EU, Japan, Korea), not automatically in the US or China (China has adopted comparable national standards).')+key(`<p><strong>How they complement:</strong> ISO 26262 handles faults; SOTIF handles hazards without faults; ISO/SAE 21434 handles attacks; ASPICE ensures the processes producing all of it are capable; R155/R156 turn cybersecurity and update management into type-approval obligations.</p>`)},
{h:'Worked examples: steering, braking, ADAS',b:`<h3>Electric power steering</h3><p>Hazard: unintended steering at speed (S3, E4, C3 → ASIL D). Mechanisms: redundant torque sensors with plausibility, lockstep MCU, independent motor-shutoff path, dual-winding motor for degraded assist. Safe state: assist off with warning (fail-safe acceptable when driver steers).</p><h3>Braking (brake-by-wire)</h3><p>Hazard: loss of braking or unintended braking. Mechanisms: dual-circuit hydraulics or redundant electronic actuators, independent power supplies, pedal-sensor redundancy, fallback to mechanical push-through where available. Increasingly fail-operational for automated driving.</p><h3>ADAS — Automatic Emergency Braking</h3><p>Two risks: false negative (no braking) and false positive (unintended hard braking). The false-positive braking hazard at high speed is often rated high ASIL; SOTIF analysis addresses perception limitations (glare, unusual objects). Architecture: perception on ADAS SoC (ASIL B), plausibility checks and actuator command limits enforced by a safety MCU (ASIL D) — an example of ASIL decomposition and monitor architecture ${B.pat}.</p>`+nova(`<p>NOVA’s CVC runs ADAS perception on an ASIL B-capable SoC partition. Every braking or steering request passes through the ASIL D safety MCU, which checks plausibility against independent radar data and limits rate/magnitude before forwarding to the brake ECU. If the SoC stops sending heartbeats, the safety MCU executes a minimal-risk manoeuvre request to the chassis controllers.</p>`)}
],

take:['ISO 26262 manages risk from E/E malfunctions via a lifecycle and ASILs.','ASIL = f(Severity, Exposure, Controllability); D is most demanding.','Safety goals → functional safety concept → technical safety concept → HW/SW requirements.','Fail-safe suffices with a human fallback; fail-operational is needed for by-wire and higher automation.','SOTIF, ASPICE, ISO/SAE 21434, R155 and R156 complement ISO 26262.'],
quiz:[
['Which three factors determine ASIL?',['Speed, mass, cost','Severity, Exposure, Controllability','Latency, jitter, bandwidth','Supplier, OEM, regulator'],1,'S, E and C classes.'],
['A camera fails to detect an unusual object due to its training limits — no component is faulty. Which standard primarily addresses this?',['ISO 26262','ISO 21448 (SOTIF)','UN R156','ASPICE'],1,'SOTIF handles functional insufficiencies.','Scenario'],
['Which needs fail-operational design?',['Seat heater','Steer-by-wire without mechanical backup','Radio','Ambient lighting'],1,'No fallback → must continue operating.'],
['UN R155 requires…',['A Software Update Management System','A Cybersecurity Management System','An ASIL D brake','An Ethernet backbone'],1,'R155 = CSMS; R156 = SUMS.'],
['Verification vs validation:',['Identical','Verification: built right per spec; validation: right system for intended use','Validation is unit testing','Verification is only for hardware'],1,'Classic distinction.'],
['ASIL D decomposed as ASIL B(D) + ASIL B(D) requires…',['Same software copied twice','Sufficient independence between the redundant elements','No testing','A cloud server'],1,'Independence must be demonstrated.'],
['S3, E4, C3 gives…',['QM','ASIL B','ASIL C','ASIL D'],3,'Highest classes in all three → ASIL D.']
]});

WIDGETS.asilCalc=function(el){
  const Sd=['S0 — no injuries','S1 — light/moderate injuries','S2 — severe, survival probable','S3 — life-threatening/fatal'];
  const Ed=['E0 — incredible','E1 — very low probability','E2 — low probability','E3 — medium probability','E4 — high probability'];
  const Cd=['C0 — controllable in general','C1 — simply controllable','C2 — normally controllable','C3 — difficult to control/uncontrollable'];
  const st={s:3,e:4,c:3};
  const ex=[['EPS unintended torque at highway speed',3,4,3],['Seat heater overheating (mild burns, rare)',1,2,2],['Unintended full braking at highway speed',3,4,2],['Loss of headlights at night on unlit road',3,2,2],['Window anti-pinch failure (child)',2,3,2]];
  function asil(){if(!st.s||!st.e||!st.c)return 'QM';const t=st.s+st.e+st.c;return t>=10?'D':t===9?'C':t===8?'B':t===7?'A':'QM';}
  function sel(name,arr,key){return `<label class="small muted" style="display:block;margin-top:8px">${name}</label><div class="chips" style="margin:4px 0">${arr.map((d,i)=>`<button class="chip${st[key]===i?' on':''}" data-k="${key}" data-v="${i}">${d}</button>`).join('')}</div>`;}
  function draw(){const a=asil();const col={QM:'#64748b',A:'#059669',B:'#0891b2',C:'#d97706',D:'#dc2626'}[a];
    el.innerHTML=`<div class="card"><div class="small muted">Try an example:</div><div class="chips">${ex.map((x,i)=>`<button class="chip" data-ex="${i}">${x[0]}</button>`).join('')}</div>${sel('Severity',Sd,'s')}${sel('Exposure',Ed,'e')}${sel('Controllability',Cd,'c')}
    <div style="display:flex;align-items:center;gap:16px;margin-top:14px;flex-wrap:wrap"><div style="width:84px;height:84px;border-radius:20px;display:grid;place-items:center;font-size:${a==='QM'?'1.6':'2.2'}rem;font-weight:800;background:${col}22;border:2px solid ${col};color:${col}">${a==='QM'?'QM':'ASIL '+a}</div><p class="small muted" style="flex:1;min-width:200px;margin:0">${a==='QM'?'No ASIL required: normal quality management suffices for this hazardous event.':`ASIL ${a}: requirements on development rigour, safety mechanisms and hardware metrics scale with level. ${a==='D'?'D demands the most rigorous measures (e.g., MC/DC coverage, high diagnostic coverage, independent assessment).':''}`}</p></div>
    <p class="tiny">Mapping follows the ISO 26262-3 risk graph (equivalent to S+E+C: 10→D, 9→C, 8→B, 7→A, else QM; any class 0 → QM). Real HARA ratings require documented rationale and review.</p></div>`;
    el.querySelectorAll('[data-k]').forEach(b=>b.onclick=()=>{st[b.dataset.k]=+b.dataset.v;draw()});
    el.querySelectorAll('[data-ex]').forEach(b=>b.onclick=()=>{const x=ex[b.dataset.ex];st.s=x[1];st.e=x[2];st.c=x[3];draw()});}
  draw();
};

MOD({n:15,id:'m15',t:'Automotive Cybersecurity',s:'Attack surfaces, defences, operations and a full attack-to-mitigation walkthrough',mins:60,
intro:`<p>A connected, updatable, software-defined car is a computer network on wheels — and an attractive target. Cybersecurity in SDVs spans hardware roots of trust, network protections, secure updates, a 24/7 security operations function, and regulatory obligations under UN R155 and ISO/SAE 21434.</p>`,
sec:[
{h:'Threat landscape and attack surfaces',l:L(`<p>Think of the car as a house. Doors and windows are the ways in: the mobile connection, Wi-Fi, Bluetooth, the diagnostic port, the charging cable, the phone app and the carmaker’s servers. Attackers try every door; defenders lock each one and put alarms inside in case someone gets through.</p>`,
`${tbl(['Surface','Examples','Typical threats'],[
['Long-range wireless','Cellular (TCU), backend APIs, mobile apps','Remote exploitation, API abuse, account takeover, fleet-wide attacks'],
['Short-range wireless','Wi-Fi, Bluetooth, keyless entry (RF/UWB/BLE), TPMS, V2X','Protocol-stack exploits, relay attacks on keyless entry, spoofing'],
['Physical / wired','OBD-II, USB, infotainment media, charging port (PLC comms), ECU tampering','Malicious diagnostics, flashing unauthorised software, CAN injection'],
['Supply chain','Third-party libraries, supplier ECUs, build systems, signing keys','Backdoors, vulnerable components, compromised updates'],
['Backend & OTA','Campaign servers, CDNs, signing infrastructure','Malicious update distribution'],
])}<p>Motivations range from research and theft (keyless relay attacks are a real-world theft method) to fraud (odometer, feature unlocking), privacy invasion and, potentially, safety-impacting attacks.</p>`,
`<p>A landmark 2015 research demonstration by Charlie Miller and Chris Valasek remotely compromised a Jeep Cherokee via its cellular-connected head unit and pivoted to CAN, leading to a recall of about 1.4 million vehicles ${B.est}. Since then, regulation (UN R155) and industry practice have matured substantially.</p>`,
`<p>Every SDV capability (connectivity, OTA, APIs, apps) is also an attack surface. Security must be designed into architecture, not bolted on.</p>`)},
{h:'Why CAN and legacy ECUs are vulnerable',l:L(`<p>CAN was designed in the 1980s when cars had no internet. It trusts everyone on the bus — like a meeting where anyone can stand up and say “I’m the brake controller” and nobody checks ID.</p>`,
`<ul><li>No sender authentication — any node can transmit any ID.</li><li>No encryption — all traffic readable.</li><li>Broadcast — all nodes receive everything.</li><li>Limited payload (8/64 bytes) makes adding MACs costly.</li><li>Legacy ECUs: weak or no secure boot, seed-key diagnostic access with weak algorithms, outdated libraries, long-lived unpatched software.</li></ul>`,
`<p>Mitigations: SecOC (truncated MACs + freshness), gateway filtering, network segmentation, IDS, secure diagnostics; CAN XL and Ethernet allow stronger protections (MACsec) ${B.pat}.</p>`,
`<p>Zonal architectures help: zone controllers terminate legacy buses locally and enforce policy before traffic reaches the backbone.</p>`)},
{h:'Defences inside the vehicle: secure boot, HSMs, authentication, encryption',l:L(`<p>Every computer checks its own software is genuine when it starts (secure boot). Secret keys are kept in a tiny vault chip (HSM) that never lets them out. Messages carry tamper-proof seals, and sensitive data is scrambled.</p>`,
`<ul><li><strong>Secure boot</strong>: immutable ROM verifies bootloader signature → bootloader verifies OS/application → chain of trust. <strong>Measured boot</strong> records hashes for attestation.</li><li><strong>HSM</strong> (Hardware Security Module) on-chip or discrete: isolated secure core, key storage, crypto accelerators, true random number generator; levels inspired by the EVITA project (full/medium/light) and the simpler SHE specification ${B.est}.</li><li><strong>Authentication</strong>: who is talking? (certificates, mutual TLS, SecOC MACs). <strong>Authorisation</strong>: what may they do? (access-control lists for services and diagnostics, least privilege).</li><li><strong>Secure diagnostics</strong>: move from weak seed-key SecurityAccess (UDS 0x27) to certificate-based Authentication (UDS 0x29) and role-based access tied to backend authorisation.</li><li><strong>Encryption</strong>: TLS for external links; MACsec/IPsec on internal Ethernet where needed; encrypted storage for personal data and IP.</li><li><strong>Hardening</strong>: memory-safe practices, exploit mitigations, minimal services, sandboxing, debug ports locked in production.</li></ul>`,
`<p>Industry pattern: defence in depth with multiple independent layers; no single control is assumed sufficient ${B.pat}.</p>`,
`<p>The HSM is the vehicle’s root of trust; secure boot, OTA verification, SecOC, V2X and digital keys all depend on it.</p>`)},
{h:'Key and certificate management, IDS and secure OTA',l:L(`<p>Keys are like house keys for millions of cars — they must be made safely, given to the right car, replaced if stolen, and never copied. Alarms (intrusion detection) watch for strange behaviour and report it to a security team.</p>`,
`<ul><li><strong>Key management</strong>: generation in secure environments, injection at end-of-line or supplier, per-ECU unique keys (avoid fleet-wide shared secrets), rotation, revocation, lifecycle beyond 15 years.</li><li><strong>Certificate management (PKI)</strong>: vehicle and ECU certificates for mTLS to backend; certificate authorities; revocation; time validity (needs trusted time); V2X uses dedicated PKIs with pseudonym certificates for privacy.</li><li><strong>Intrusion detection</strong>: network IDS (anomalies in CAN/Ethernet timing, IDs, payloads), host IDS (process/file integrity), AUTOSAR IdsM collects security events and forwards them.</li><li><strong>Secure OTA</strong>: signed, versioned metadata (Uptane-style), anti-rollback, encrypted payloads, verified installation (Module 13).</li></ul>`,
`<p>Vendors offering vehicle IDS/VSOC solutions include Upstream Security, VicOne and others; many OEMs operate their own VSOCs ${B.co}.</p>`,
`<p>Detection without response is useless — events must flow to an operations team with authority to act (e.g., issue an OTA fix, revoke a key, disable a service).</p>`)},
{h:'Security operations: VSOC, vulnerability management, testing and incident response',l:L(`<p>A Vehicle Security Operations Centre is like a 24/7 control room watching the whole fleet for signs of attack and coordinating fixes.</p>`,
`<ul><li><strong>VSOC</strong>: aggregates vehicle security events, backend logs and threat intelligence; correlates fleet-wide anomalies; triages and escalates.</li><li><strong>Vulnerability management</strong>: monitor CVEs against SBOMs of every software version in the field; assess exploitability; prioritise; patch via OTA; coordinate disclosure (PSIRT, bug bounties).</li><li><strong>Penetration testing</strong>: white/grey/black-box testing of ECUs, TCU, apps and backends; fuzzing of protocol stacks (CAN, SOME/IP, Bluetooth, Wi-Fi).</li><li><strong>Security monitoring</strong>: continuous; part of R155 obligations to monitor, detect and respond across the vehicle lifecycle.</li><li><strong>Incident response</strong>: playbooks, forensics, containment, fixes, regulator/customer communication.</li></ul>`,
`<p>UN R155 requires the manufacturer’s CSMS to cover the full lifecycle, including post-production monitoring and response ${B.est}.</p>`,
`<p>SBOMs connect security operations to the software lifecycle (Module 18): you cannot patch what you cannot inventory.</p>`)},
{h:'Software supply chain security, zero trust and secure development lifecycle',l:L(`<p>Modern car software is built from thousands of parts made by others. You must know every ingredient (SBOM), trust nobody by default (zero trust), and build security in from the first design sketch.</p>`,
`<ul><li><strong>Supply chain</strong>: SBOMs (SPDX, CycloneDX), provenance (signed builds, reproducible builds, frameworks such as SLSA), dependency scanning, supplier cybersecurity interface agreements (CIA, from ISO/SAE 21434).</li><li><strong>Zero trust</strong>: no implicit trust based on network location; every service call authenticated and authorised; least privilege; continuous verification — applied inside vehicles via service-level access control and segmentation.</li><li><strong>Secure SDLC (ISO/SAE 21434)</strong>: item definition → TARA (asset identification, threat scenarios, impact rating, attack feasibility, risk determination) → cybersecurity goals and concept → secure design/coding → verification (testing, pen tests) → validation → production → operations and decommissioning.</li></ul>`,
`<p>Cybersecurity Assurance Levels (CAL 1–4) in ISO/SAE 21434 guide rigour, analogous in spirit to ASILs ${B.est}.</p>`,
`<p>Security and safety engineering must be coordinated: a security control (e.g., blocking messages) must not create a safety hazard, and vice versa.</p>`)},
{h:'Hypothetical attack: from initial access to mitigation',b:`<p>A fictional scenario on NOVA to show defence in depth. ${B.an}</p>`+tbl(['Stage','Attacker action','NOVA defence / response'],[
['1. Reconnaissance','Researches NOVA’s media app; finds an outdated image-parsing library version listed in a public teardown','SBOM-based vulnerability monitoring had already flagged the CVE; patch scheduled'],
['2. Initial access','Crafted album-art file delivered via a streaming service exploits the media app in the Android Automotive VM','Exploit succeeds inside the app sandbox (only QM VM affected)'],
['3. Privilege escalation','Attempts to escape the Android sandbox','SELinux policy and hypervisor isolation prevent access to other VMs; host IDS logs anomalous syscalls'],
['4. Lateral movement','Tries to send SOME/IP requests to the door-lock service from the IVI VM','Service access control: IVI identity not authorised for DoorLock.Unlock; request rejected; IdsM reports event'],
['5. Detection','Multiple vehicles report similar events','VSOC correlates fleet-wide pattern within hours; incident declared'],
['6. Containment','—','Backend disables album-art fetching via remote configuration; streaming partner blocks malicious file'],
['7. Remediation','—','Patched media app delivered via SOTA (container update) in phased campaign; signature-verified; rollback-ready'],
['8. Recovery & lessons','—','Forensics, regulator notification per obligations, TARA updated, faster patch SLAs for media libraries'],
])+key(`<p>No single defence stopped the attack — layers did: sandboxing, hypervisor isolation, service authorisation, IDS, VSOC, remote configuration and OTA.</p>`)},
{h:'Functional safety vs cybersecurity',b:tbl(['Aspect','Functional safety','Cybersecurity'],[
['Protects against','Malfunctions (random HW faults, systematic errors)','Intentional malicious actions'],
['Standard','ISO 26262 (+ ISO 21448 SOTIF)','ISO/SAE 21434; UN R155'],
['Analysis','HARA → ASIL','TARA → risk value, CAL'],
['Threat model','Faults are non-adaptive and statistically characterisable','Adversaries adapt, learn and scale'],
['Lifecycle emphasis','Design-time assurance; field monitoring','Continuous monitoring and response for the vehicle’s lifetime'],
['Example','Lockstep MCU detects bit flip','SecOC rejects spoofed brake message'],
['Interaction','Security failures can create safety hazards; security measures must not compromise safety (e.g., fail-safe vs lock-down)',''],
])}
],
terms:[['Attack surface','Points where an attacker can try to enter or extract data.'],['HSM','Hardware Security Module.'],['Secure boot','Boot-time verification of software signatures.'],['SecOC','Secure Onboard Communication.'],['IDS','Intrusion Detection System.'],['VSOC','Vehicle Security Operations Centre.'],['TARA','Threat Analysis and Risk Assessment.'],['SBOM','Software Bill of Materials.'],['Zero trust','No implicit trust; verify every access.'],['PKI','Public Key Infrastructure.'],['CSMS','Cybersecurity Management System (UN R155).']],

MOD({n:16,id:'m16',t:'ADAS, Autonomous Driving and AI',s:'Sensors, perception to control, compute, the data engine, and why ADAS depends on the whole SDV stack',mins:60,
intro:`<p>Advanced driver assistance and automated driving are the most compute-, data- and safety-intensive workloads in a vehicle. They are also the strongest reason OEMs moved to central compute, Ethernet backbones and cloud data loops.</p>`,
sec:[
{h:'ADAS fundamentals and SAE automation levels',l:L(`<p>ADAS features help the driver — warning about cars in your blind spot, braking if you’re about to hit something, keeping you in your lane. Automated driving goes further: at higher levels, the car does the driving and you are allowed to look away — under specific conditions.</p>`,
`${tbl(['SAE level','Name','Who drives / monitors','Example'],[
['0','No driving automation','Driver; system may warn/momentarily intervene','Forward collision warning, AEB (momentary)'],
['1','Driver assistance','Driver + system controls steering OR speed','Adaptive cruise control'],
['2','Partial automation','System steers AND controls speed; driver must supervise constantly','Lane-centering + ACC; hands-free highway systems are still L2'],
['3','Conditional automation','System drives within ODD; driver must take over when requested','Certified highway traffic-jam/“eyes-off” systems'],
['4','High automation','System drives within ODD with no driver fallback needed','Robotaxis in geofenced areas'],
['5','Full automation','System drives everywhere a human could','Not commercially available'],
])}<p class="tiny">Based on SAE J3016. <strong>ODD</strong> = Operational Design Domain (road types, speeds, weather, geography).</p>`,
`<p>“L2+” and “L2++” are marketing terms, not J3016 levels ${B.est}. GM has announced an “eyes-off” highway system for the Cadillac Escalade IQ in 2028 ${B.co}; L3 approvals exist in some markets for specific ODDs (e.g., under UN R157). Liability shifts at L3+: the manufacturer is responsible while the system is engaged within its ODD (jurisdiction-dependent).</p>${src([['SAE J3016','https://www.sae.org/standards/content/j3016_202104/'],['GM eyes-off 2028 (WardsAuto)','https://www.wardsauto.com/news/gm-ai-plans-debut-eyes-off-driving-super-cruise-cadillac-esclade-iq/803665']])}`,
`<p>Level determines architecture: L2 can be fail-safe (driver fallback); L3+ requires fail-operational sensing, compute, power and actuation.</p>`),
x:key(`<p><strong>ADAS vs autonomous driving:</strong> ADAS (L0–L2) <em>assists</em> a driver who remains responsible and must supervise. Autonomous/automated driving systems (ADS, L3–L5) <em>perform</em> the entire driving task within an ODD, with the system responsible while engaged.</p>`)},
{h:'Sensors: camera, radar, LiDAR, ultrasonic',b:tbl(['Sensor','Measures','Strengths','Weaknesses','Interface'],[
['Camera','Colour/texture images','Classification, lanes, signs, lights; cheap','Depth estimation indirect; glare, darkness, weather','SerDes (GMSL/FPD-Link), MIPI'],
['Radar','Range, velocity (Doppler), angle','All-weather, direct velocity; 4D imaging radar adds elevation','Lower resolution; clutter, ghost targets','CAN FD / Ethernet'],
['LiDAR','3D point clouds via laser','Precise geometry, works in dark','Cost, weather sensitivity, packaging','Ethernet'],
['Ultrasonic','Short-range distance','Cheap, parking','Range < few metres','LIN/CAN/direct'],
['Others','IMU, GNSS, wheel odometry, driver-monitoring camera','Localisation, driver attention','—','Various'],
])+mis('More sensors always means safer driving.','Sensor sets are trade-offs between cost, redundancy, compute load and validation burden; architecture and software matter as much as sensor count. Approaches differ: Tesla relies on cameras; many others add radar and LiDAR.')},
{h:'The pipeline: perception, localisation, mapping, prediction, planning, control',l:L(`<p>Driving is: see (perception), know where you are (localisation, maps), guess what others will do (prediction), decide what to do (planning), and do it smoothly (control).</p>`,
`${flow(['c1:Sensors','c2:Perception|detection, segmentation, tracking, fusion','c3:Localisation & maps|GNSS/IMU, landmarks, HD/SD maps','c4:Prediction|trajectories of agents','c5:Planning|behaviour + motion','c1:Control|trajectory → steering/brake/torque','c2:Actuators|via safety gate'])}<ul><li><strong>Sensor fusion</strong>: early (raw data), mid (features, e.g., bird’s-eye-view representations) or late (object lists). Modern stacks increasingly fuse in learned BEV spaces.</li><li><strong>Mapping</strong>: HD maps (cm-level lanes) vs “map-light” approaches relying on online perception plus navigation maps.</li><li><strong>Planning</strong>: behaviour decisions + trajectory optimisation with comfort and safety constraints.</li><li><strong>Control</strong>: lateral/longitudinal controllers; commands pass through a safety monitor to brake/EPS/powertrain.</li></ul>`,
`<p>Two approaches coexist: <strong>modular pipelines</strong> (separately engineered stages, easier to validate) and <strong>end-to-end learned</strong> models (sensor input to trajectory, sometimes with language reasoning — e.g., NVIDIA’s Alpamayo vision-language-action models) ${B.em}. Many production systems are hybrids with rule-based safety envelopes.</p>${src([['NVIDIA automotive (Alpamayo, Hyperion)','https://www.nvidia.com/en-in/self-driving-cars/hardware/']])}`,
`<p>Each stage consumes data published by middleware and publishes results — a dense real-time data graph inside the ADAS compute.</p>`)},
{h:'Autonomous driving compute, AI inference and edge AI',l:L(`<p>Running AI models on dozens of camera frames every second needs a special chip — like a gaming graphics card, but designed to survive in a car and to be safe.</p>`,
`<ul><li><strong>SoCs</strong>: CPU clusters for planning/middleware, GPU/NPU for neural networks, ISPs for cameras, safety islands. Examples: NVIDIA DRIVE AGX Orin and Thor, Qualcomm Snapdragon Ride, Mobileye EyeQ, Tesla’s in-house FSD computer ${B.co}.</li><li><strong>Inference optimisation</strong>: quantisation (INT8/FP8), pruning, compiler optimisation (e.g., TensorRT-class tools), batching across cameras.</li><li><strong>Edge AI</strong>: everything runs on-board for latency and availability; cloud only for training and fleet learning.</li><li><strong>Safety</strong>: AI components are typically treated as QM/ASIL B elements supervised by deterministic monitors (ASIL D) — runtime safety envelopes.</li></ul>`,
`<p>NVIDIA states its Hyperion L4 reference platform uses two DRIVE AGX Thor SoCs with 14 cameras, nine radars, one LiDAR and 12 ultrasonics, and lists BYD, Geely, Isuzu and Nissan as adopters for L4 vehicles ${B.co}. GM’s 2028 centralised platform is built on DRIVE Thor ${B.co}.</p>${src([['NVIDIA in-vehicle computing','https://www.nvidia.com/en-in/self-driving-cars/hardware/'],['GM computing (S&P Global)','https://autotechinsight.spglobal.com/news/5284762/gm-to-introduce-centralized-vehicle-computing-platform-in-2028']])}`,
`<p>ADAS compute selection constrains the whole SDV (thermal, power, cost, software stack); some OEMs merge ADAS and cockpit on one SoC to cut cost ${B.em}.</p>`)},
{h:'The data engine: collection, training, simulation, validation, fleet learning',l:L(`<p>Self-driving AI learns like a student: it needs examples (data), lessons (training), practice exams (simulation), real exams (validation), and then keeps learning from the whole class’s experiences (fleet learning).</p>`,
`${flow(['c1:Fleet data collection|triggers, shadow mode','c2:Data pipeline|ingest, curate, anonymise','c3:Labelling|auto-label + human QA','c4:Model training|GPU clusters','c5:Simulation|log replay, synthetic, closed-loop','c1:Validation|scenario coverage, KPIs, SOTIF','c2:OTA model deployment|staged','c3:Monitoring|disengagements, near-misses'],{cap:'Closed-loop “data engine” — the defining capability of AI-driven ADAS development.'})}<ul><li><strong>Trigger-based collection</strong>: upload clips only when interesting (hard braking, disagreement between model and driver — “shadow mode”).</li><li><strong>Simulation</strong>: replay logs (open-loop), closed-loop simulation with reactive agents, synthetic scenario generation, neural reconstruction of real scenes.</li><li><strong>Validation</strong>: scenario-based testing (e.g., ISO 34502 framework), statistical safety arguments, SOTIF triggering-condition analysis; regulator requirements (e.g., UN R157 for ALKS).</li><li><strong>OTA model updates</strong>: models versioned, validated and deployed like software — with compatibility to perception/planning interfaces.</li></ul>`,
`<p>Data volume and labelling costs are major economic factors; companies with large fleets have a data advantage ${B.an}. NVIDIA describes a “three-computer” approach — training (DGX), simulation (Omniverse/Cosmos) and in-vehicle (DRIVE AGX) ${B.co}.</p>${src([['NVIDIA three-computer solution','https://www.nvidia.com/en-sg/solutions/autonomous-vehicles/in-vehicle-computing/']])}`,
`<p>The data engine links Modules 12 (cloud), 13 (OTA), 17 (data) and 18 (CI/CD) into one loop.</p>`)},
{h:'How ADAS depends on the entire SDV stack',b:tbl(['Layer','ADAS dependency'],[
['Physical sensors & actuators','Sensor quality, placement, cleaning; by-wire actuators with redundancy'],
['Hardware','High-TOPS SoC, memory bandwidth, safety MCU, thermal capacity, redundant power'],
['Networks','Multi-Gbit SerDes for cameras; TSN Ethernet for object lists; deterministic links to brake/EPS'],
['OS & hypervisor','Linux/QNX with real-time tuning; isolation from cockpit workloads'],
['Middleware','Zero-copy IPC, DDS/SOME/IP with deadlines, time sync (gPTP) for fusion'],
['Platform software','Health monitoring, logging, data recorders, model management, calibration'],
['Cloud','Data ingestion, labelling, training, simulation, fleet monitoring'],
['OTA','Model and software updates with validation and rollback'],
['Safety & security','ISO 26262, SOTIF, R157; secure sensors and model integrity'],
])+nova(`<p>NOVA ships with 8 cameras, 5 radars, 12 ultrasonics and an optional LiDAR. Perception runs on the ADAS SoC (Linux + AUTOSAR Adaptive + DDS); plans pass through the safety MCU. Triggered clips upload over Wi-Fi when parked; new perception models arrive quarterly via OTA after closed-loop simulation and shadow-mode validation.</p>`)}
],
terms:[['ADAS','Advanced Driver Assistance Systems (L0–L2).'],['ADS','Automated Driving System (L3–L5).'],['ODD','Operational Design Domain.'],['Sensor fusion','Combining multiple sensors into a coherent world model.'],['BEV','Bird’s-eye-view representation (also Battery Electric Vehicle — context!).'],['Shadow mode','Running a model passively and comparing to driver behaviour.'],['End-to-end model','Neural model mapping sensors directly to driving output.'],['AEB','Automatic Emergency Braking.'],['HD map','High-definition lane-level map.']],
mis:[['L2 hands-free systems are self-driving.','Hands-free L2 still requires continuous driver supervision; responsibility remains with the driver.'],['AI models can be updated like any app without safety concerns.','Model updates change vehicle behaviour and must be validated (safety, SOTIF) and staged like any safety-relevant release.']],

quiz:[

['Which sensor directly measures relative velocity via Doppler?',['Camera','Radar','Ultrasonic','GNSS'],1,'Radar measures Doppler velocity.'],
['“Shadow mode” means…',['Driving at night','Running a model passively to compare its decisions with the driver’s, without controlling the car','Hiding sensors','A LiDAR feature'],1,'Used for data collection and validation.'],
['Why are AI perception outputs often passed through a deterministic safety monitor?',['To speed up training','Neural networks are hard to verify; an ASIL D monitor bounds unsafe commands','To reduce sensors','To encrypt data'],1,'Runtime safety envelopes.'],
['A highway system lets drivers read a book in traffic jams within its ODD and requests takeover when needed. Level?',['L1','L2','L3','L5'],2,'Conditional automation.','Scenario'],

MOD({n:17,id:'m17',t:'Vehicle Data, Digital Twins and Analytics',s:'From signals to insights: collection, pipelines, analytics, twins, monetisation and governance',mins:45,
intro:`<p>Data is the feedback loop that makes software-defined vehicles improve. This module explains how raw vehicle signals become insights and products — and the governance needed to do it legally and ethically.</p>`,
sec:[
{h:'Vehicle signals vs vehicle data; telemetry and signal databases',l:L(`<p>A <strong>signal</strong> is one live reading, like the speedometer needle right now. <strong>Data</strong> is what you get when you record, label and organise many readings over time — like a trip diary that can be analysed.</p>`,
`<ul><li><strong>Vehicle signals</strong>: real-time values on in-vehicle networks/services (e.g., <code>BatteryCellVoltage[37]</code> every 100 ms), defined in DBC/ARXML or a VSS-style catalogue with names, types, units, ranges.</li><li><strong>Vehicle data</strong>: signals (and events, logs, images) collected, contextualised (VIN, time, location, software version, configuration), stored and processed for use outside real-time control.</li><li><strong>Telemetry</strong>: periodic or event-driven transmission of selected data to the cloud.</li><li><strong>Signal databases</strong>: DBC (CAN), ARXML (AUTOSAR), ODX (diagnostics), VSS (COVESA, vendor-neutral tree) — mapping between them is a real integration task.</li></ul>`,
`<p>Signal catalogues often contain tens of thousands of signals; selecting and normalising them across vehicle generations is a major cost driver for data platforms ${B.an}.</p>`,
`<p>Standardised semantic models (e.g., VSS) let cloud analytics work across models and generations — the data analogue of hardware abstraction.</p>`),
x:key(`<p><strong>Vehicle data vs vehicle signals:</strong> signals are real-time, in-vehicle, transient values used for control; vehicle data is collected, contextualised and persisted information used for analytics, services and engineering.</p>`)},
{h:'Vehicle data lifecycle',b:flow(['c1:Generate|signals, events, logs, video','c2:Select|collection campaigns & triggers','c3:Edge process|filter, aggregate, compress, anonymise','c4:Transmit|MQTT/HTTPS, store-and-forward','c5:Ingest|validate, enrich (VIN, SW version)','c1:Store|hot (time-series) / cold (lake)','c2:Process & analyse|stream, batch, ML','c3:Act|OTA, alerts, services, product decisions','c4:Retain / delete|policies, consent, legal'],{cap:'Vehicle data lifecycle. Governance and privacy controls apply at every stage.'})+tbl(['Collection approach','How','Pros / cons'],[
['Fixed telemetry','Always send a fixed signal set','Simple; costly and inflexible'],
['Campaign-based','Cloud defines what/when to collect for which vehicles (e.g., AWS IoT FleetWise-style)','Targeted, cheap; needs on-board agent and governance'],
['Event-triggered','Capture window around trigger (DTC, hard braking)','Rich context; sampling bias'],
['On-demand','Engineer requests data from specific VINs','Great for debugging; consent and security needed'],
])},
{h:'Processing, storage and real-time analytics',l:L(`<p>Some questions need answers now (“this car’s battery is overheating”), some can wait until tonight (“which battery batch ages fastest?”). Data systems handle both: a fast lane and a slow lane.</p>`,
`<ul><li><strong>Stream processing</strong>: real-time rules and models on incoming events (alerts, geofences, anomaly detection).</li><li><strong>Batch processing</strong>: large-scale analytics, model training, reports.</li><li><strong>Storage</strong>: time-series databases for recent high-frequency data; data lakes/lakehouses (columnar formats such as Parquet) for history; object storage for video.</li><li><strong>Feature stores</strong> and ML platforms for reusable model inputs.</li></ul>`,
`<p>Cost management (storage, egress, compute) is significant at fleet scale; edge filtering often saves more than cloud optimisation ${B.an}.</p>`,
`<p>Analytics outputs must flow back into engineering (defect fixes) and products (features) to close the SDV loop.</p>`)},
{h:'Use cases: predictive maintenance, battery, driver behaviour, fleet analytics',b:tbl(['Use case','Data','Value','Caveats'],[
['Predictive maintenance','DTCs, sensor trends, usage','Fix before failure; fewer breakdowns','False positives; workshop integration'],
['Battery analytics','Cell voltages/temps, charge sessions, SoH estimates','Warranty forecasting, charging optimisation, safety early warning, residual value','Model accuracy across chemistries'],
['Driver behaviour','Acceleration, braking, speed, time of day','Usage-based insurance, coaching, fleet safety','Highly personal — explicit consent'],
['Fleet analytics','Location, utilisation, energy, maintenance','Commercial fleet efficiency, TCO','Data sharing contracts'],
['Engineering quality','Field failure rates by software/hardware version','Faster root cause, OTA fixes','Requires good version context'],
['Feature adoption','Usage of features','Product decisions, pricing','Privacy-safe aggregation'],
])},
{h:'Digital twins and simulation',l:L(`<p>A digital twin is a virtual copy of a real car living in the computer, kept up to date with real data — so engineers can test “what if” on the copy without touching the real car.</p>`,
`<ul><li><strong>Instance twin</strong>: per-vehicle model: configuration (hardware, software versions, options), state (last known values), history, health models.</li><li><strong>Fleet twin</strong>: aggregate model of a population for planning updates and analysing trends.</li><li><strong>Design/engineering twin</strong>: virtual prototype (virtual ECUs, plant models) for development and validation (Module 18).</li><li>Uses: OTA compatibility checks (“which vehicles can take v4.2?”), remote diagnostics, battery ageing prediction, simulation of feature behaviour on real configurations.</li></ul>`,
`<p>“Digital twin” is used loosely in industry — from a database record to a physics-based simulator; ask which kind ${B.an}.</p>`,
`<p>The instance twin is the cloud’s source of truth for each vehicle’s configuration — essential for campaigns and compliance (R156 RXSWIN tracking).</p>`)},
{h:'Data monetisation, privacy, ownership and governance',l:L(`<p>Car data can be valuable — for insurers, cities, map makers — but it belongs to people’s lives. Laws increasingly give owners rights to access and share their car’s data, and require permission for personal uses.</p>`,
`<ul><li><strong>Monetisation models</strong>: internal value (quality, product decisions — usually the largest), direct services to customers, B2B data products (aggregated/anonymised traffic, EV charging insights), insurance partnerships.</li><li><strong>Ownership & access</strong>: legal concepts differ; the EU Data Act (applicable from September 2025) gives users rights to access data generated by connected products and to share it with third parties.</li><li><strong>Privacy</strong>: consent, purpose limitation, minimisation, anonymisation; location and driver-behaviour data are especially sensitive.</li><li><strong>Governance</strong>: catalogues, lineage, quality, access control, retention, audits.</li></ul>`,
`<p>Early expectations of large direct data-monetisation revenue have frequently been revised downward; internal efficiency use cases tend to deliver the clearest value ${B.an}.</p>`,
`<p>Governance requirements feed back into vehicle design: collection agents must enforce consent and policies on-board.</p>`)}
],

MOD({n:18,id:'m18',t:'Software Development and Engineering Lifecycle',s:'Requirements to release: MBSE, V-model meets DevOps, MIL/SIL/HIL, traceability, variants and SBOMs',mins:55,
intro:`<p>How is SDV software actually built? This module connects classical automotive systems engineering (V-model, ASPICE, ISO 26262) with modern software practice (agile, DevOps, CI/CD, virtual testing) — and shows where they clash and how teams reconcile them.</p>`,
sec:[
{h:'End-to-end lifecycle: the V-model meets DevOps',b:stack([['Requirements engineering|stakeholder → system → software requirements|b','Validation|vehicle-level: does it meet intent?|g'],['System architecture|functions, E/E, allocation|b','System integration & test|HIL, vehicle test|g'],['Software architecture|components, interfaces, ARXML|b','Software integration & test|SIL, integration benches|g'],['Detailed design / models|Simulink, UML|b','Unit verification|MIL/SIL, coverage|g'],['Implementation|code, auto-generated code|c']],'Left side: specification & design. Right side: verification & validation. Each level verifies against its counterpart.')+flow(['c1:Plan','c2:Code','c3:Build (CI)','c4:Test (virtual)','c5:Release','c1:Deploy (OTA)','c2:Operate','c3:Monitor → Plan'],{cap:'DevOps loop. In SDVs, the V-model governs safety-relevant rigour while DevOps governs cadence — many teams run “V-model per increment” inside continuous pipelines.'})},
{h:'Requirements, architecture and model-based systems engineering',l:L(`<p>Before building, you write down exactly what the system must do (requirements), draw how it will be organised (architecture), and increasingly you build a computer model of the system first (MBSE) so you can check it before any code exists.</p>`,
`<ul><li><strong>Requirements engineering</strong>: elicitation, specification (functional, non-functional, safety, security), attributes (ID, ASIL, verification method), reviews; tools like DOORS, Polarion, Codebeamer, Jama.</li><li><strong>System architecture</strong>: logical functions → allocation to hardware/software → E/E architecture (Module 03).</li><li><strong>Software architecture</strong>: components, interfaces, deployment, timing; AUTOSAR descriptions.</li><li><strong>MBSE</strong>: system model as the primary artefact (SysML; SysML v2 is the newer, API-centric generation); simulation of behaviour; consistency checks.</li><li><strong>UML</strong> for software design; <strong>SysML</strong> extends/adapts it for systems (requirements, blocks, parametrics).</li><li><strong>Model-based software</strong>: Simulink/Stateflow models auto-generated to C (common for control software).</li></ul>`,
`<p>ASPICE assessments check these processes (SYS.1–5, SWE.1–6 in v4.0). Many OEMs require ASPICE capability level 2–3 from software suppliers ${B.est}.</p>`,
`<p>Requirements and models are the anchor of <strong>traceability</strong> — every test, line of code and safety argument must link back.</p>`)},
{h:'MIL, SIL, PIL, HIL and vehicle testing',b:tbl(['Method','What runs','Against what','Use'],[
['MIL — Model-in-the-Loop','Control model (e.g., Simulink)','Plant model in simulation','Early algorithm validation'],
['SIL — Software-in-the-Loop','Compiled production code on PC/cloud (incl. virtual ECUs)','Simulated environment','Fast, scalable regression; CI'],
['PIL — Processor-in-the-Loop','Code on target processor','Simulated plant','Check compiler/target effects'],
['HIL — Hardware-in-the-Loop','Real ECU hardware + software','Real-time simulator emulating sensors/actuators/networks','Integration, fault injection, timing'],
['VIL / vehicle test','Complete vehicle','Proving ground, public roads, chambers','Validation, homologation'],
])+key(`<p><strong>SIL vs HIL vs MIL:</strong> MIL tests the <em>model</em>; SIL tests the <em>code</em> on non-target hardware; HIL tests the <em>real ECU</em> against a simulated world. SDV strategies “shift left”: push as much testing as possible into SIL/virtual ECUs in the cloud, keep HIL for timing, hardware and safety evidence.</p>`)},
{h:'Agile, DevOps, CI/CD and continuous testing',l:L(`<p>Instead of building everything for years and testing at the end, teams build in small slices every few weeks, and robots automatically build and test every change within hours.</p>`,
`<ul><li><strong>Agile</strong> at scale (often SAFe or similar) with program increments aligned to vehicle milestones.</li><li><strong>CI</strong>: every commit builds, runs static analysis, unit tests, SIL integration tests; ARXML/interface consistency checks.</li><li><strong>CD</strong>: automated packaging, signing and promotion through environments (bench → test fleet → customer fleet via OTA).</li><li><strong>Continuous testing</strong>: thousands of virtual scenarios nightly; HIL farms scheduled by pipeline; regression suites; test result dashboards.</li><li><strong>Regression testing</strong>: re-running suites after any change; test selection by impact analysis.</li></ul>`,
`<p>GM reports running around 180,000 software simulations four times a day for its next-generation platform pilot builds ${B.co}. Toyota says Arene reduced ADAS software assessment time on the latest RAV4 by 70% ${B.co}.</p>${src([['CarExpert on GM simulations','https://www.carexpert.com.au/car-news/gms-next-gen-brain-coming-to-petrol-suvs-and-utes-and-itll-get-new-chips-every-two-years'],['Toyota Arene expansion (Global Sources)','https://www.globalsources.com/sourcing-digest/toyota-plans-to-expand-arene-software-platform-to-50-models-by-2030/']])}`,
`<p>Continuous delivery to vehicles is bounded by safety and regulation — CD pipelines must generate the evidence (test reports, traceability, SBOM, safety case updates) automatically.</p>`)},
{h:'Integration, release, configuration and variant management',l:L(`<p>Hundreds of teams’ work must fit together like a giant jigsaw, every version must be tracked, and the right pieces must go into the right car model.</p>`,
`<ul><li><strong>Software integration</strong>: combining components into ECU images and vehicle software sets; integration is often the critical path.</li><li><strong>Release management</strong>: release trains, release candidates, gates (quality, safety, security), release notes, vehicle software baselines.</li><li><strong>Configuration management</strong>: version control (Git), baselines, change control, reproducible builds.</li><li><strong>Variant management</strong>: feature models, “150% models” (superset with variant conditions), product-line engineering, calibration datasets per variant/market.</li><li><strong>Verification vs validation</strong>: verification checks work products against specifications; validation checks the system meets intended use in its environment.</li></ul>`,
`<p>Variant explosion is a top source of SDV defects: the more combinations, the less each is tested. Superset hardware strategies (Volvo’s “Superset tech stack” concept) aim to reduce variance ${B.co}.</p>`,
`<p>Release baselines link to the vehicle’s software identity (R156 RXSWIN) and the cloud’s per-vehicle twin.</p>`)},
{h:'SBOM, supply chain, defects and traceability',l:L(`<p>An SBOM is the ingredient list of software. Traceability is a web of links proving each requirement was designed, built and tested. Defect management makes sure every bug is tracked until it’s fixed.</p>`,
`<ul><li><strong>SBOM</strong> (SPDX, CycloneDX): components, versions, licences, suppliers — for vulnerability management and licence compliance (open-source obligations).</li><li><strong>Software supply chain</strong>: supplier deliveries (binaries, source), integration contracts, provenance, signing.</li><li><strong>Defect management</strong>: tracking, severity/priority, root-cause analysis, links to requirements/tests/releases; field defects from telemetry.</li><li><strong>Traceability</strong>: bidirectional links requirements ↔ architecture ↔ code ↔ tests ↔ results ↔ releases — required by ISO 26262 and ASPICE.</li><li><strong>Engineering toolchains</strong>: integrated via APIs/OSLC; tool qualification (ISO 26262-8) for tools whose errors could introduce faults.</li></ul>`,
`<p>Traceability at SDV scale requires automation; manual matrices break under weekly releases ${B.an}.</p>`,
`<p>SBOM + traceability + telemetry let you answer the critical post-release question: “which vehicles have which code, and is it safe and secure?”</p>`)}
],

WIDGETS.ecosystem=function(el){
  const cats=['All','OEM','Tier 1','Semiconductor','Software & platform','Cloud & tech','Open source'];let cur='All';
  function draw(){el.innerHTML=`<div class="chips">${cats.map(c=>`<button class="chip${c===cur?' on':''}" data-c="${c}">${c}</button>`).join('')}</div><div class="grid g2">${ECO.filter(e=>cur==='All'||e[1]===cur).map(e=>`<div class="card"><div class="tiny">${e[1]}</div><h3 style="margin:.2em 0 .4em">${e[0]}</h3><p class="small"><b>Position:</b> ${e[2]}</p><p class="small muted"><b>Representative examples:</b> ${e[3]}</p>${e[4].length?src(e[4]):'<div class="srcs">General industry knowledge; verify current details with the company.</div>'}</div>`).join('')}</div>`;
    el.querySelectorAll('[data-c]').forEach(b=>b.onclick=()=>{cur=b.dataset.c;draw()});}
  draw();
};
MOD({n:20,id:'m20',t:'SDV Industry Ecosystem',s:'OEMs, Tier 1s, chipmakers, software vendors, cloud providers and open source — who does what',mins:45,
intro:`<p>No company builds an SDV alone. This module maps the value chain, contrasts strategies, and distinguishes OEM-developed platforms, supplier platforms, joint ventures, partnerships, open source and commercial software. Company facts are current as of November 2026 and linked to sources where specific.</p>`,
sec:[
{h:'The SDV value chain',b:stack([['Customer experience & services|apps, subscriptions, data services|c'],['Cloud & backend|hyperscalers, OEM clouds, data platforms|b'],['Applications & features|OEM feature teams, partners, app developers|v'],['Platform software|OS, hypervisor, middleware, AUTOSAR, vehicle APIs|g'],['Compute & E/E hardware|SoCs, MCUs, central computers, zone controllers|a'],['Vehicle systems|powertrain, chassis, body, sensors, actuators|n']],'Value-chain layers; companies compete and partner across them.')},
{h:'Explore the ecosystem (interactive)',b:W('ecosystem')},
{h:'Platform strategies: how companies organise',b:tbl(['Model','Description','Examples (as publicly described)','Trade-offs'],[
['OEM-developed platform','OEM builds core software platform in-house','Tesla; Mercedes-Benz MB.OS; BMW Neue Klasse; Toyota Arene; Hyundai Pleos','Control and differentiation vs huge cost and talent needs'],
['Supplier-developed platform','Tier 1/vendor provides computers + platform software','Central computers and zone controllers from major Tier 1s; vendor stacks (Vector, Elektrobit, ETAS)','Faster/cheaper vs less differentiation, dependency'],
['Joint venture','Shared entity co-develops platform','RV Tech (VW Group + Rivian); CARIZON (VW + Horizon Robotics in China)','Shared cost and expertise vs governance complexity'],
['Strategic partnership','Long-term co-development without new entity','Mercedes–NVIDIA, Mercedes–Google, GM–NVIDIA, Mahindra–Qualcomm','Access to capability vs coordination and lock-in'],
['Open-source ecosystem','Shared non-differentiating code under open governance','Eclipse SDV / S-CORE, COVESA VSS, Automotive Grade Linux','Lower duplication vs need for qualification and support'],
['Commercial software platform','Licensed products integrated by OEM','QNX, Android Automotive OS, AUTOSAR stacks, cloud IoT services','Mature, supported vs licence costs, less control'],
])+mis('Every OEM pursues the same SDV strategy.','Strategies range from full vertical integration (Tesla, BYD) to partnership-led approaches (VW–Rivian) and platform-licensing approaches; many mix models per layer.')},
{h:'Contrasting strategies — layered view',l:L(`<p>Some carmakers want to cook everything themselves; others prefer to buy ready-made ingredients and focus on the recipe. Both can work — but switching halfway is very expensive.</p>`,
`<p>A practical way to compare: for each layer (silicon, central computer hardware, OS, middleware, vehicle functions, ADAS, cockpit, cloud) ask <em>make, buy, partner, or open-source?</em> Tesla and BYD make most layers; Mercedes and BMW make the platform and many apps while partnering for silicon and some AI; VW moved from “make” (CARIAD) to “partner” (RV Tech, China partners); Toyota and Hyundai build branded platforms with supplier ecosystems; Mahindra combines a proprietary architecture with chip and software partners ${B.an}.</p>`,
`<p>Recent events show volatility: Intel exited its Intel-architecture automotive business in 2025; Continental spun off its automotive unit as AUMOVIO; CARIAD restructured; open-source collaboration expanded via Eclipse S-CORE ${B.co}.</p>${src([['SiliconANGLE (Intel)','https://siliconangle.com/?p=701908'],['CARIAD','https://cariad.technology/de/en/news/stories/CARIAD-reports-strong-progress.html'],['VDA/Eclipse','https://www.vda.de/en/press/press-releases/2026/260107_Automotive-innovation-through-open-collaboration--Momentum-builds-around-open-source-software-as-a-key-driver-of-efficiency-and-success']])}`,
`<p>Ecosystem position determines bargaining power and who captures software value. Expect continued consolidation, partnerships and open-source growth in non-differentiating layers ${B.sp}.</p>`)}
],
terms:[['Value chain','Sequence of activities creating value from components to customer.'],['Joint venture','Jointly owned company created by partners.'],['Vertical integration','Owning multiple layers of the value chain.'],['Tier 0.5','Informal term for suppliers (often chipmakers) working directly with OEMs.'],['Open-source governance','Shared development rules within a foundation.']],

MOD({n:21,id:'m21',t:'SDV Business Models and Economics',s:'Monetisation, lifecycle value, cost structures, build-vs-buy — with a scenario calculator',mins:45,
intro:`<p>SDV is as much a business transformation as a technical one. This module covers how OEMs hope to make money from software, what it costs, what can go wrong, and how to reason about the numbers with explicitly labelled assumptions.</p>`,
sec:[
{h:'Software monetisation models',b:tbl(['Model','How it works','Examples (publicly reported)','Risks'],[
['One-time software purchase','Pay once to unlock a capability for the vehicle’s life','Performance boosts, ADAS packages sold as upgrades','Hardware must already be fitted; resale value treatment'],
['Subscription','Monthly/annual fee','Connected services, premium connectivity, some ADAS tiers','Fatigue, churn, backlash on hardware already installed'],
['Feature-on-demand trial/rent','Short-term activation (e.g., for a trip)','Seasonal features, trailer assist','Low uptake, complexity'],
['Bundled in price','Software capability included, recovered via vehicle price','BYD includes “God’s Eye” ADAS across models in China','No direct recurring revenue'],
['Services & ecosystem','Revenue from apps, charging, insurance, energy','App stores, charging networks, usage-based insurance','Partner economics, data privacy'],
['Cost-side value','OTA reduces warranty, recalls, workshop visits','Recall fixes via OTA','Hard to attribute, but often largest real value'],
])+call('mis',`<p><strong>Case:</strong> BMW offered heated seats (with hardware already fitted) as a subscription in some markets from 2022, then stopped in September 2023 after customer backlash, while continuing subscriptions for software-and-service-type functions such as driving and parking assistance ${B.co}.</p>${src([['Carscoops','https://www.carscoops.com/2023/09/bmw-has-stopped-its-subscription-service-for-heated-seats-after-widespread-backlash/'],['Edmunds','https://www.edmunds.com/car-news/bmw-relents-on-heated-seat-subscription.html']])}`,'Lesson: consumer acceptance')},
{h:'Lifecycle value, retention and differentiation',l:L(`<p>Instead of earning money only when a car is sold, a carmaker can keep earning — and keep the customer happy — by improving the car for years. Happy owners come back to buy the next one.</p>`,
`<ul><li><strong>Vehicle lifecycle value</strong>: initial margin + software/services over 10–15 years + lower warranty costs + better residual values.</li><li><strong>Customer retention</strong>: continuous relationship (app, updates) raises loyalty and repurchase.</li><li><strong>Differentiation</strong>: experience (HMI, assistance quality, efficiency) increasingly differentiates when hardware converges.</li><li><strong>Hardware reuse & platform standardisation</strong>: one platform across models amortises development; fewer part numbers.</li></ul>`,
`<p>Industry forecasts of software revenue have often been optimistic; many OEMs now emphasise cost savings and customer experience over standalone software revenue ${B.an}.</p>`,
`<p>Lifecycle value only materialises if the architecture supports it: hardware headroom, OTA, entitlement systems and data loops.</p>`)},
{h:'Cost structures, supplier economics and build vs buy',l:L(`<p>Building your own software platform is like building your own power station: expensive at the start, cheaper later — if you have enough customers. Buying is cheaper at first but you pay forever and depend on someone else.</p>`,
`${tbl(['Cost element','Notes'],[
['Development cost','Platform engineering: thousands of engineers; multi-year investments'],
['Integration cost','Often the largest hidden cost — integrating supplier components, variants, validation'],
['Hardware BOM','Central compute and sensors cost more; fewer ECUs and less wiring save'],
['Operations (OPEX)','Cloud, connectivity, OTA bandwidth, VSOC, support — per vehicle per year for life'],
['Compliance','R155/R156 management systems, safety cases, privacy'],
['Total cost of ownership (customer)','Energy, maintenance, software fees, residual value'],
])}<p><strong>Build vs buy</strong> criteria: differentiation, volume (amortisation), talent availability, time-to-market, risk, IP ownership, ecosystem maturity, exit options.</p>`,
`<p>Supplier economics shift: Tier 1s lose some per-ECU revenue but gain in central computers and services; software vendors move to licence/royalty models; chipmakers capture more value per vehicle ${B.an}. IP ownership clauses (who owns code, who may reuse it) are now central to contracts.</p>`,
`<p>Economics drive architecture: an OEM with modest volume may rationally buy a supplier platform; a high-volume OEM may justify building.</p>`)},
{h:'Scenario calculator (illustrative)',b:`<p>Explore how assumptions change the economics of a software feature on NOVA. All numbers are <strong>hypothetical teaching assumptions</strong> — not industry data. ${B.an}</p>${W('bizCalc')}`},
{h:'Commercial risks, consumer acceptance and regulation',b:tbl(['Risk','Example','Mitigation'],[
['Consumer backlash','Paying for already-installed hardware','Sell software-based value; transparent pricing; include basics'],
['Low attach rates','Features few people buy','Validate demand; bundles; trials'],
['Cost overruns','Platform programs over budget and late','Phased scope, reuse, partnerships'],
['Regulatory limits','Restrictions on post-sale changes to type-approved functions; consumer-protection rules; data laws','Engage regulators; R156 processes'],
['Residual value uncertainty','Do unlocked features transfer to second owners?','Clear transfer policies'],
['Liability','Software-induced incidents','Safety processes, insurance, clear terms'],
])+nova(`<p>NOVA’s product team decides: core safety and comfort features included; ADAS “highway pilot” sold as a one-time upgrade or subscription; performance boost one-time; connectivity bundle free for 3 years then subscription; no subscriptions on installed hardware comfort features.</p>`)}
],

mis:[['Software subscriptions will soon make up most OEM profits.','Software revenue is growing but forecasts have often proved optimistic; cost savings and retention are major (if less visible) benefits.']],

WIDGETS.bizCalc=function(el){
  const P={units:100000,attach:15,price:1500,subPrice:15,subMix:40,churn:20,dev:20,opex:3};
  const F=[['units','Vehicles sold per year',10000,500000,10000,''],['attach','Attach rate (%)',1,60,1,'%'],['subMix','Share choosing subscription (%)',0,100,5,'%'],['price','One-time price ($)',100,5000,100,'$'],['subPrice','Subscription ($/month)',1,100,1,'$'],['churn','Annual subscription churn (%)',0,60,5,'%'],['dev','Up-front development cost ($M)',1,200,1,'$M'],['opex','Operating cost per active user ($/yr)',0,50,1,'$']];
  function calc(){const yrs=5;let cum=-P.dev*1e6,rows=[],activeSubs=0,be=null;
    for(let y=1;y<=yrs;y++){const buyers=P.units*P.attach/100;const one=buyers*(1-P.subMix/100);const newSubs=buyers*P.subMix/100;activeSubs=activeSubs*(1-P.churn/100)+newSubs;
      const rev=one*P.price+activeSubs*P.subPrice*12;const cost=(activeSubs+one)*P.opex;const net=rev-cost;cum+=net;if(be===null&&cum>=0)be=y;rows.push([y,rev,cost,net,cum]);}
    return{rows,be};}
  const fm=v=>(v<0?'−':'')+'$'+(Math.abs(v)/1e6).toFixed(1)+'M';
  const lab=(k,u)=>`${u==='$'||u==='$M'?'$':''}${P[k].toLocaleString()}${u==='%'?'%':(u==='$M'?'M':'')}`;
  el.innerHTML=`<div class="card"><div class="grid g2">${F.map(([k,l,mn,mx,st,u])=>`<label class="small" style="display:block">${l}: <b id="bz-${k}">${lab(k,u)}</b><input type="range" min="${mn}" max="${mx}" step="${st}" value="${P[k]}" data-k="${k}" data-u="${u}" style="width:100%;accent-color:#22d3ee"></label>`).join('')}</div><div id="bzOut"></div></div>`;
  function out(){const {rows,be}=calc();

MOD({n:22,id:'m22',t:'SDV Challenges and Industry Realities',s:'Why transformations take longer than promised — and what separates success from failure',mins:40,
intro:`<p>SDVs are not a solved problem. Several high-profile programs have been delayed, restructured or required hardware retrofits. Understanding why is as valuable as understanding the technology.</p>`,
sec:[
{h:'The challenge map',b:tbl(['Challenge','What it looks like','Why it is hard'],[
['Software complexity','Hundreds of millions of lines across many suppliers','Interactions, timing, variants'],
['Legacy architecture','Carry-over ECUs and buses','Rewrite cost; validated assets'],
['Integration difficulties','Late integration, unstable builds','Many suppliers, interfaces, versions'],
['Hardware fragmentation','Many SoCs/MCUs across models','Ports, BSPs, toolchains'],
['Software compatibility','Mixed versions across ECUs and fleet','Dependency matrices'],
['Cybersecurity threats','Growing attack surface','Adaptive adversaries, long lifecycles'],
['Functional safety','Consolidation + frequent updates','Keeping safety cases valid'],
['Technical debt','Shortcuts to hit SOP','Compounds across years of OTA'],
['Supplier dependency','Black-box components, lock-in','Contracts, IP ownership'],
['Talent shortages','Embedded + cloud + AI + safety skills','Competition with tech sector'],
['Development costs','Multi-billion investments','Uncertain returns'],
['Validation challenges','Infinite scenarios, variants','Need for virtual testing, evidence'],
['OTA risks','Bricked vehicles, failed campaigns','Fleet diversity, field conditions'],
['Software recalls','Recalls fixed by OTA — or needing workshop','Regulatory processes'],
['Organisational silos','Domain teams vs platform teams','Conway’s law'],
['Data privacy','Legal limits across markets','Divergent regulations'],
['Regulatory complexity','R155/R156, regional rules','Moving targets'],
['Platform lock-in','Chip/OS/cloud dependencies','Switching costs'],
['Consumer expectations','“Phone-like” UX and frequent updates','Automotive constraints'],
['Unrealistic promises','Timelines, autonomy claims, revenue forecasts','Hype cycles'],
])},
{h:'Real-world lessons',l:L(`<p>Even giant companies have stumbled. Software programs ran years late, cars shipped with buggy features, and some had to replace computers in customer cars. The lessons: start with architecture, organise teams around the platform, test virtually and early, and don’t over-promise.</p>`,
`<ul><li><strong>VW / CARIAD</strong>: ambitious in-house unified software platform faced delays (e.g., software architecture 1.2 reportedly delayed 16–18 months) and large operating losses; restructured to be ~30% leaner and shifted to partnerships (RV Tech, China partners) ${B.co}.</li><li><strong>Volvo EX90</strong>: early vehicles shipped with software issues; Volvo is replacing the core computer of every 2025 EX90 with the upgraded NVIDIA DRIVE AGX Orin-based unit free of charge, since the new software is not compatible with the old unit ${B.co}.</li><li><strong>Hardware headroom</strong>: the EX90 case illustrates that insufficient compute headroom can force hardware retrofits — expensive but sometimes necessary.</li></ul>${src([['InsideEVs (CARIAD delays)','https://insideevs.com/news/693654/volkswagen-group-cariad-job-cuts/'],['CARIAD FY2025','https://cariad.technology/de/en/news/stories/CARIAD-reports-strong-progress.html'],['Volvo support page','https://www.volvocars.com/us/support/topic/47d2c97fd33effd3c0a8cc3718c999b7-ee74549933d85020c0a83205327890cd-8664b2fa77a7e089c0a8296870d1a409']])}`,
`<p>Common failure patterns ${B.an}: (1) trying to change architecture, organisation and every vehicle program at once; (2) underestimating integration and validation; (3) separating “software org” from vehicle programs with unclear ownership; (4) choosing silicon before software readiness; (5) committing to marketing dates before platform maturity; (6) insufficient compute headroom.</p>`,
`<p>Success patterns ${B.an}: clear platform ownership, stable interfaces, incremental migration, heavy virtual testing, tight hardware/software co-design, and realistic sequencing of programs.</p>`)},
{h:'Why SDV transformations take longer than expected',b:`<ol><li><strong>Coupled change:</strong> E/E architecture, software platform, toolchain, organisation, suppliers and business model must change together.</li><li><strong>Long cycles:</strong> a platform decision today reaches customers in 3–5 years; mistakes surface late.</li><li><strong>Safety and regulation:</strong> evidence generation doesn’t scale linearly with features.</li><li><strong>Legacy gravity:</strong> existing programs, suppliers and validated components resist change.</li><li><strong>Skills:</strong> embedded, cloud, AI, safety and security expertise in one organisation is rare.</li><li><strong>Economic pressure:</strong> EV demand cycles, tariffs and cost-cutting interrupt long programs.</li></ol>`+key(`<p>SDV is a decade-long transformation, not a product launch. Judge progress by architecture maturity, release cadence and field quality — not by announcements.</p>`)}
],
terms:[['Technical debt','Future cost of shortcuts taken now.'],['Conway’s law','Systems mirror the communication structure of the organisations that build them.'],['Software recall','Recall remedied by a software update.'],['Lock-in','High switching costs to alternative suppliers/platforms.']],
mis:[['SDV problems are mostly coding problems.','Most are architecture, integration, organisation and process problems.']],
links:[[18,'Process responses.'],[20,'Strategy shifts.'],[21,'Economic pressures.'],[23,'What comes next.']],
take:['SDV challenges are systemic: technical, organisational, regulatory and commercial.','Real programs (CARIAD, EX90) show integration, headroom and organisation risks.','Coupled change and long cycles explain delays.','Success comes from clear ownership, incremental migration and virtual validation.'],
quiz:[

['Conway’s law suggests…',['Software is always fast','System structure mirrors organisational communication structure','CAN is secure','Chips get faster'],1,'Organisation shapes architecture.'],
['Which is a common SDV failure pattern?',['Incremental migration','Changing architecture, organisation and all programs at once','Virtual testing','Stable interfaces'],1,'Coupled big-bang change.'],
['VW’s strategic shift around 2024–2026 was from…',['Partnerships to in-house','In-house unified software (CARIAD) toward partnerships such as RV Tech','Software to mechanics','ICE to diesel'],1,'Documented restructuring.'],
['Best indicator of genuine SDV progress?',['Press releases','Architecture maturity, release cadence and field quality','Screen size','Number of ECUs added'],1,'Outcomes over announcements.']
]});
