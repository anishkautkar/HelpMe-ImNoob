MOD({n:7,id:'m07',t:'AUTOSAR: A Critical SDV Building Block',s:'Classic and Adaptive platforms — and how their pieces actually interact',mins:65,
intro:`<p>AUTOSAR (AUTomotive Open System ARchitecture) is the industry’s standardised software architecture for ECUs. It is often listed as an acronym soup — BSW, RTE, MCAL, ARXML — but the goal here is to understand <em>how the pieces interact</em> when a real signal travels through a real ECU.</p>`,
sec:[
{h:'Why AUTOSAR was created',l:L(`<p>Imagine every Lego set used different-sized bricks — you couldn’t combine them. Before AUTOSAR, every supplier’s ECU software was built differently, so carmakers couldn’t easily move software between suppliers or reuse it. AUTOSAR created standard “brick sizes” for car software.</p>`,
`<p>Founded in 2003 by major OEMs and suppliers (initially BMW, Bosch, Continental, DaimlerChrysler, Siemens VDO and Volkswagen, with others joining as core partners), AUTOSAR standardises: (1) a <strong>layered architecture</strong> separating application from infrastructure; (2) <strong>standardised basic software</strong> modules and their interfaces; (3) a <strong>methodology</strong> and exchange format (ARXML) for configuring and integrating software; (4) <strong>application interfaces</strong> for common functions. Motto: “cooperate on standards, compete on implementation”.</p>`,
`<p>AUTOSAR publishes three standards — Classic Platform (CP), Adaptive Platform (AP) and Foundation (FO) — in annual releases; the latest at the time of writing is <strong>R25-11</strong> (released November 2025), with the next annual release expected around the end of 2026 ${B.est}. Implementations are commercial products (Vector MICROSAR, Elektrobit EB tresos/corbos, ETAS RTA, KPIT, Tata Elxsi and others) ${B.co}.</p>${src([['AUTOSAR R25-11 release event','https://www.autosar.org/news-events/detail/autosar-release-event-r25-11']])}`,
`<p>AUTOSAR is the lingua franca between OEMs and suppliers: ARXML files are how interface contracts are exchanged at scale across the supply chain.</p>`)},
{h:'Classic Platform architecture — visual breakdown',b:stack([['Application layer|Software Components (SWCs): DoorLock, SeatControl, WiperLogic — composed of runnables, communicating via ports|c'],['Runtime Environment (RTE)|generated glue: implements ports, triggers runnables, maps communication intra-/inter-ECU|b'],['Services layer|OS, COM, PduR, Dcm/Dem (diag), NvM (memory), EcuM/BswM (modes), ComM/NM, WdgM, Crypto (Csm), SecOC|v','Complex Device Drivers|direct HW access for special/timing-critical functions (spans layers)|a'],['ECU abstraction layer|IoHwAb, CanIf/EthIf/LinIf, MemIf: map logical I/O to physical, independent of MCU|g'],['Microcontroller Abstraction Layer (MCAL)|Dio, Adc, Pwm, Can, Eth, Spi, Fls, Gpt, Mcu, Wdg drivers|a'],['Microcontroller|e.g., AURIX, RH850, S32K|n']],'AUTOSAR Classic layered architecture (simplified). BSW = Services + ECU abstraction + MCAL + CDD.')},
{h:'How the Classic pieces interact — following one signal',l:L(
`<p>Press the NOVA driver’s door-unlock switch. The signal is passed from hand to hand like a relay race: a low-level driver reads the pin, a translator turns it into “unlock pressed”, the app decides “unlock all doors”, and a postal service packages that message onto the network for other computers.</p>`,
`<ol><li><strong>MCAL</strong> <code>Dio</code> driver reads the switch pin state (or <code>Adc</code> for an analog input).</li><li><strong>ECU abstraction</strong> (<code>IoHwAb</code>) converts the raw pin to a logical signal <code>DoorUnlockRequest</code>, debounced.</li><li>The <strong>RTE</strong> triggers a <strong>runnable</strong> of the <code>DoorLockSWC</code> (e.g., a 10 ms <em>TimingEvent</em>, or a <em>DataReceivedEvent</em>); the runnable reads the value through its <strong>R-port</strong> (<code>Rte_Read_...</code>).</li><li>The runnable decides to unlock, writes <code>LockCommand</code> to a <strong>P-port</strong> (<code>Rte_Write_...</code>) and calls a client-server operation on the local actuator SWC.</li><li>The RTE, configured with the communication matrix, hands the signal to <strong>COM</strong>, which packs it into an <strong>I-PDU</strong> with other signals.</li><li><strong>PduR</strong> routes the PDU to <code>CanIf</code> (CAN) or <code>SoAd</code>/<code>EthIf</code> (Ethernet, e.g., via SOME/IP transformer), then to the MCAL driver and onto the wire. <strong>SecOC</strong> may add a MAC for authenticity.</li><li>Meanwhile <strong>Dem</strong> records any detected fault (e.g., actuator open load) and <strong>Dcm</strong> answers diagnostic requests; <strong>NvM</strong> persists data; <strong>BswM/EcuM</strong> manage modes such as sleep.</li></ol>`,
`<p>In production, almost all of this is <strong>generated from configuration</strong>: the RTE and BSW configuration code are produced by tools from ARXML. Engineers write the SWC runnables (often generated from Simulink models) and configure the rest ${B.est}.</p>`,
`<p>The RTE is the key decoupling element: SWCs do not know whether their partner is on the same ECU or across the network — enabling functions to move between ECUs (relevant for consolidation).</p>`)},
{h:'SWCs, ports, interfaces and runnables',b:tbl(['Concept','Meaning','Example'],[
['Software Component (SWC)','Encapsulated application unit with defined ports','SeatHeatingSWC'],
['Port (P-port / R-port)','Provided / required communication point','R-port CabinTemp; P-port HeaterDuty'],
['Sender-Receiver interface','Data distribution (signals)','VehicleSpeed broadcast'],
['Client-Server interface','Operation call with arguments/return','SetSeatPosition(pos)'],
['Mode-switch / Parameter / NvData interfaces','Modes, calibration parameters, non-volatile data','IgnitionMode, calibration curves'],
['Runnable entity','Schedulable function inside an SWC, triggered by RTE events','HeatControl_10ms()'],
['RTE event','Trigger: TimingEvent, DataReceivedEvent, OperationInvokedEvent, ModeSwitchEvent…','Run every 10 ms'],
['VFB','Virtual Functional Bus — design-time view of all SWCs connected, before mapping to ECUs','System-level composition'],
])},
{h:'Methodology and ARXML',l:L(`<p>AUTOSAR comes with a recipe: first describe the whole system (which apps, which signals), then cut out each ECU’s part, configure it, and let tools generate the code. All of these descriptions are written in a standard file format called ARXML.</p>`,
`${flow(['c1:System description|SWCs, interfaces, network, ECUs (ARXML)','c2:ECU extract|the part relevant to one ECU','c3:ECU configuration|BSW + RTE + OS parameters','c4:Generation|RTE, BSW config code','c5:Build & integrate|compile with SWC code, flash'])}<p><strong>ARXML</strong> is an XML format defined by the AUTOSAR meta-model; it carries SWC descriptions, interface definitions, communication matrices, ECU configurations, and (for Adaptive) manifests. Exchanged between OEM tools and supplier tools.</p>`,
`<p>ARXML interoperability between tools is good but not perfect; integration teams often spend significant effort on configuration consistency ${B.an}. Tooling: Vector DaVinci/PREEvision, Elektrobit tresos, ETAS ISOLAR, dSPACE SystemDesk, Siemens Capital, and others ${B.co}.</p>`,
`<p>ARXML is the machine-readable contract of the vehicle network — a foundation for automated CI pipelines that validate interfaces on every change (Module 18).</p>`)},
{h:'Adaptive Platform architecture — visual breakdown',b:stack([['Adaptive Applications|C++ processes, e.g., ADAS fusion, OTA client, vehicle API gateway|c'],['ARA — AUTOSAR Runtime for Adaptive Applications (C++ APIs)|v'],['ara::com|service communication (SOME/IP, DDS, IPC bindings)|b','ara::exec|Execution Management|b','ara::sm|State Management|b','ara::diag|Diagnostics|b'],['ara::per|Persistency|g','ara::phm|Platform Health Mgmt|g','ara::crypto / ara::iam|crypto, identity & access|g','ara::ucm|Update & Config Mgmt|g','ara::log / ara::tsync|logging, time sync|g'],['POSIX OS (PSE51)|Linux, QNX|a'],['Hypervisor (optional) & SoC hardware|n']],'AUTOSAR Adaptive (simplified). Functional clusters expose ara:: C++ APIs; minimum C++ version raised to C++17 in R25-11.')},
{h:'How Adaptive works: services, manifests and execution management',l:L(`<p>Adaptive AUTOSAR is designed for powerful computers. Instead of fixed signals, apps offer and use <em>services</em>, like web services. Apps can be installed, started and updated while the system runs.</p>`,
`<ul><li><strong>Service-oriented communication</strong> via <code>ara::com</code>: a provider <em>offers</em> a service instance (methods, events, fields); consumers <em>find</em> it and get a proxy; generated proxy/skeleton classes hide the transport (SOME/IP, DDS, local IPC).</li><li><strong>Manifests</strong> (ARXML): Execution manifest (how to start a process, dependencies, resource groups), Service Instance manifest (bindings, IDs, ports), Machine manifest (platform configuration).</li><li><strong>Execution Management</strong> starts/stops processes per Function Group states requested by <strong>State Management</strong> (e.g., “Driving”, “Parking”, “Update”).</li><li><strong>UCM</strong> installs, verifies and activates software packages — the on-board side of OTA.</li><li><strong>PHM</strong> supervises alive/deadline/logical checkpoints and triggers recovery.</li></ul>`,
`<p>Adaptive is used on HPCs for ADAS, gateways and vehicle-API layers by several OEMs; others use alternative middleware (proprietary, DDS/ROS 2-derived, or open-source such as Eclipse S-CORE) ${B.pat}.</p>`,
`<p>Classic and Adaptive are designed to coexist: Classic ECUs (zones, safety controllers) exchange data with Adaptive machines over SOME/IP and signal-to-service translation.</p>`)},
{h:'Classic vs Adaptive — platform differences',b:tbl(['Aspect','Classic Platform','Adaptive Platform'],[
['Target','MCUs, deeply embedded control','High-performance MPUs/SoCs'],
['Language','C','C++ (C++17 minimum in R25-11)'],
['OS','OSEK-based AUTOSAR OS, static','POSIX (Linux, QNX)'],
['Configuration','Static, at build time','Dynamic deployment via manifests'],
['Communication','Signal-based (COM) + SOME/IP possible','Service-oriented (ara::com: SOME/IP, DDS, IPC)'],
['Updates','Whole ECU image (flash)','Package-level via UCM'],
['Real-time','Hard real-time','Soft to firm real-time'],
['Safety','Up to ASIL D','Typically up to ASIL B, higher with architecture measures'],
['Typical nodes','Zone controllers, brake/EPS, BMS','Central compute, ADAS HPC, gateways'],
],'Adaptive does not replace Classic; AUTOSAR describes them as complementary.')},
{h:'Where AUTOSAR fits in modern SDVs — and its limitations',l:L(`<p>AUTOSAR is still everywhere in the small control computers. On the big computers, it competes with other approaches. Engineers love its order but complain it is heavy and slow to work with.</p>`,
`<p><strong>Typical use:</strong> Classic in nearly all MCU-based ECUs including zone controllers; Adaptive or alternatives on HPCs; SOME/IP as the bridge. <strong>Limitations:</strong> configuration complexity (thousands of parameters), tool licensing costs, slow standard evolution relative to software industry, steep learning curve, generated-code debugging, and variation in implementations.</p>`,
`<p>Industry reaction includes “code-first” open-source efforts — Eclipse S-CORE, an open-source core stack for high-performance ECUs, released version 0.5 in November 2025 and is backed by a VDA-initiated memorandum signed by 32 companies as of CES 2026 ${B.em}. These complement rather than eliminate AUTOSAR; AUTOSAR itself has standardised further APIs and a Common Adaptive Platform Implementation effort ${B.co}.</p>${src([['Eclipse Foundation / VDA (Jan 2026)','https://newsroom.eclipse.org/node/43352'],['AUTOSAR release event page','https://www.autosar.org/news-events/release-event']])}`,
`<p>AUTOSAR’s strategic value is less its code than its <strong>shared vocabulary and contracts</strong>, which let hundreds of companies integrate software. Any successor must replicate that ecosystem function.</p>`)}
],

MOD({n:8,id:'m08',t:'Middleware and Communication',s:'The connective tissue: IPC, pub-sub, SOME/IP, DDS, MQTT, discovery, time and gateways',mins:55,
intro:`<p>Middleware is how software components find each other, exchange data and stay in sync — inside one chip, across a vehicle network and out to the cloud. Choosing the right mechanism for each data flow is one of the most consequential SDV design decisions.</p>`,
sec:[
{h:'What middleware is and why it exists',l:L(`<p>Middleware is the car’s postal and telephone system for software. Apps don’t need to know where other apps live or how the wires work — they just send a letter (“the cabin is 24 °C”) or make a call (“set fan to 3”), and middleware delivers it.</p>`,
`<p>Middleware provides: <strong>location transparency</strong> (local or remote), <strong>serialization</strong> (turning data structures into bytes), <strong>discovery</strong>, <strong>communication patterns</strong> (pub-sub, request-response), <strong>quality of service</strong> (reliability, deadlines), <strong>security</strong> hooks, and sometimes lifecycle/health integration. It sits above the OS and network stack, below applications.</p>`,
`<p>Without middleware, every application would hard-code sockets, byte layouts and addresses — making portability and updates impossible. Middleware choice is a long-lived platform decision with ecosystem effects ${B.an}.</p>`,
`<p>Middleware is where the <strong>logical architecture</strong> (services and data) meets the <strong>physical architecture</strong> (ECUs and networks).</p>`)},
{h:'Inter-process communication, pub-sub and request-response',l:L(`<p><strong>Publish-subscribe</strong> is like a radio station: the publisher broadcasts “vehicle speed is 80”, and anyone tuned in hears it. <strong>Request-response</strong> is like a phone call: “please set the temperature to 21” — “done”.</p>`,
`<ul><li><strong>IPC</strong> (within one machine): pipes, sockets, message queues, shared memory. High-bandwidth flows (camera frames) use <strong>zero-copy shared memory</strong> (e.g., Eclipse iceoryx) to avoid copying megabytes.</li><li><strong>Publish-subscribe</strong>: decoupled one-to-many distribution; subscribers come and go; suits sensor data, state updates, events.</li><li><strong>Request-response (RPC)</strong>: client invokes a method on a server and gets a result; suits commands and queries; needs timeouts and error handling.</li><li><strong>Fire-and-forget</strong>: one-way command without response.</li></ul>`,
`<p>Most automotive middleware supports both patterns (SOME/IP: events + methods; DDS: topics, with RPC extensions). Production choice hinges on latency, determinism, tooling and supplier support.</p>`,
`<p>Pattern choice affects coupling: pub-sub reduces dependencies but makes data flows harder to trace; RPC makes dependencies explicit but creates timing coupling.</p>`)},
{h:'SOME/IP',l:L(`<p>SOME/IP is the car industry’s own standard language for services over Ethernet — designed to be light enough for small car computers.</p>`,
`<p><strong>SOME/IP</strong> (Scalable service-Oriented MiddlewarE over IP) — specified within AUTOSAR. Message header: <code>Message ID</code> (Service ID + Method/Event ID), <code>Length</code>, <code>Request ID</code> (Client ID + Session ID), <code>Protocol Version</code>, <code>Interface Version</code>, <code>Message Type</code> (request, request-no-return, notification, response, error), <code>Return Code</code>, then the serialized payload. Runs over UDP or TCP.</p><p><strong>Elements</strong>: <em>methods</em> (RPC), <em>events</em> (notifications grouped into <em>eventgroups</em> that clients subscribe to), <em>fields</em> (value with getter/setter/notifier). <strong>SOME/IP-SD</strong> (service discovery) uses UDP multicast to <em>OfferService</em>, <em>FindService</em>, <em>SubscribeEventgroup</em>. Optional E2E protection and SecOC/TLS for safety/security.</p>`,
`<p>SOME/IP is the dominant service protocol between ECUs in production vehicles today, particularly linking AUTOSAR Classic and Adaptive nodes ${B.est}. Limits: AUTOSAR-specific tooling, less suited to very high-bandwidth streaming, QoS less rich than DDS.</p>`,
`<p>SOME/IP is the main bridge from signal-based zone ECUs to service-oriented central compute.</p>`)},
{h:'DDS',l:L(`<p>DDS is like a shared, self-updating whiteboard: anyone can write data on a topic, anyone interested sees it, and you can set rules like “I must get this at least every 50 ms”.</p>`,
`<p><strong>DDS</strong> (Data Distribution Service, OMG standard): data-centric pub-sub. <em>Topics</em> with typed data; <em>DataWriters</em>/<em>DataReaders</em>; decentralised <strong>discovery</strong> (no broker); wire protocol <strong>DDSI-RTPS</strong>; serialization CDR/XCDR. Rich <strong>QoS policies</strong>: Reliability (best-effort/reliable), Durability (late joiners get history), Deadline, Liveliness, History depth, Ownership, Latency budget. <strong>DDS Security</strong> adds authentication, access control and encryption.</p>`,
`<p>DDS is widely used in robotics (ROS 2 is built on DDS) and in some ADAS/autonomy stacks; AUTOSAR Adaptive supports a DDS binding for ara::com ${B.pat}. Trade-offs: heavier than SOME/IP, configuration complexity of QoS, discovery traffic on large systems.</p>`,
`<p>DDS fits high-rate sensor fusion graphs inside HPCs and between ADAS nodes; SOME/IP fits control-oriented services across ECUs.</p>`)},
{h:'MQTT and vehicle-to-cloud messaging',l:L(`<p>MQTT is a lightweight messaging system made for unreliable mobile connections — like text messages for machines through a central post office (the broker).</p>`,
`<p><strong>MQTT</strong> (OASIS standard; MQTT 5): client–broker pub-sub over TCP/TLS; hierarchical topics (<code>vehicles/VIN/telemetry/battery</code>); QoS 0 (at most once), 1 (at least once), 2 (exactly once); retained messages; last-will; persistent sessions to survive dropouts. Cloud IoT services (e.g., AWS IoT Core, Azure IoT Hub) support MQTT ${B.co}.</p>`,
`<p>MQTT is a common pattern for telemetry and commands between TCU and cloud; not used for in-vehicle control. Alternatives: HTTPS/gRPC for bulk/API calls, proprietary protocols, and emerging cross-domain protocols (e.g., Eclipse uProtocol) ${B.pat}.</p>`,
`<p>MQTT is the vehicle’s link into the cloud data pipeline (Modules 12 and 17).</p>`)},
{h:'Serialization, protocol stacks and service discovery',b:tbl(['Concern','Options','Notes'],[
['Serialization','SOME/IP serialization, CDR (DDS), Protobuf, FlatBuffers, JSON','Binary formats for in-vehicle efficiency; schemas = contracts'],
['Transport','UDP (low latency, multicast), TCP (reliable streams), shared memory','UDP for events, TCP for large payloads'],
['Discovery','SOME/IP-SD (multicast offers), DDS SPDP/SEDP, static configuration','Static config preferred for safety-critical paths; dynamic for flexibility'],
['Security','SecOC, MACsec (L2), IPsec, TLS/DTLS, DDS Security','Chosen per network layer and criticality'],
])+flow(['c3:Application|SetTemperature(21.5)','c1:Proxy (generated)|serialize args','c2:SOME/IP|header + payload','Transport|UDP/TCP + IP','Ethernet MAC/PHY|100/1000BASE-T1','c4:Skeleton at server|deserialize → call'],{cap:'A method call traversing a typical service protocol stack.'})},
{h:'API-based vehicle functionality and event-driven architecture',l:L(`<p>Instead of every app learning how the car works, the car offers a menu of simple commands and data — “getSpeed”, “setSeatHeat(level)” — like an app store’s developer kit.</p>`,
`<p><strong>Vehicle APIs</strong> standardise access to vehicle data and functions for applications: COVESA <strong>VSS</strong> defines a tree of signals (<code>Vehicle.Cabin.HVAC.Station.Row1.Driver.Temperature</code>); open-source data brokers (e.g., Eclipse Kuksa) expose VSS via gRPC; OEMs publish SDKs (e.g., Hyundai’s Pleos Playground for in-vehicle apps) ${B.co}. <strong>Event-driven architecture</strong>: components react to events (door opened, charge started) rather than polling — enabling loose coupling and efficient sleep/wake behaviour.</p>`,
`<p>API layers allow third-party and cross-model applications, but must enforce permissions (who may unlock doors?), rate limits and safety gating ${B.pat}.</p>${src([['Hyundai Pleos (Automotive Dive)','https://gcp.automotivedive.com/news/hyundai-announces-mobility-software-brand-pleos-sdvs-software/743913']])}`,
`<p>Vehicle APIs are the “northbound” contract of the platform; middleware protocols are the “southbound” plumbing.</p>`)},
{h:'Time synchronization, network management and gateways',l:L(`<p>All the car’s computers need to agree on the time — otherwise a camera image and a radar reading can’t be matched. And when the car is parked, computers must agree to go to sleep together to save the battery.</p>`,
`<ul><li><strong>Time sync</strong>: IEEE 802.1AS (gPTP) over Ethernet gives sub-microsecond synchronisation; AUTOSAR StbM distributes time bases; CAN/FlexRay have their own sync. Needed for sensor fusion timestamps, TSN scheduling, logs and security (certificate validity).</li><li><strong>Network management</strong>: coordinated sleep/wake (AUTOSAR CanNm/UdpNm), partial networking (only needed ECUs wake), wake-up sources; critical for 12 V battery drain.</li><li><strong>Gateways</strong>: route and translate between buses (CAN↔Ethernet, signal↔service), filter (firewall), aggregate diagnostics, and enforce domain separation.</li></ul>`,
`<p>Signal-to-service translation in zone controllers/gateways is a major integration workload in hybrid architectures ${B.pat}.</p>`,
`<p>These “invisible” functions often decide whether an SDV is reliable in daily life (battery not drained, data consistent).</p>`)},
{h:'When to use which mechanism',b:tbl(['Data flow','Recommended','Why'],[
['Brake pressure → ESC (1 ms loop)','Local in ECU / dedicated CAN FD','Hard real-time, safety-critical'],
['Door switch → body logic','LIN/CAN signal → zone → SOME/IP event','Low rate, legacy compatible'],
['Climate setpoint from HMI','SOME/IP method / field','Request-response with state'],
['Camera frames → perception','SerDes into SoC; zero-copy IPC / DDS inside HPC','Gbit/s, latency, no copies'],
['Object list → planning','DDS or SOME/IP events (TSN-scheduled)','Periodic, deadline-sensitive'],
['Telemetry → cloud','MQTT over TLS via TCU','Intermittent connectivity, broker-based'],
['OTA package download','HTTPS / CDN','Bulk, resumable'],
['Third-party app reads speed','Vehicle API (VSS via data broker)','Permissioned, stable contract'],
])+nova(`<p>NOVA uses: CAN FD/LIN inside zones; SOME/IP between zones and the CVC; DDS inside the ADAS partition; ara::com abstractions for apps; MQTT for telemetry; HTTPS for OTA downloads; gPTP time sync across the Ethernet backbone.</p>`)}
],

MOD({n:9,id:'m09',t:'Service-Oriented Architecture (SOA)',s:'Services, contracts, discovery and loose coupling — with a full climate-control walkthrough',mins:50,
intro:`<p>Service-oriented architecture reorganises vehicle software from “who sends which signal to whom” into “who provides which capability to anyone authorised to use it”. It is the conceptual heart of the software-defined vehicle.</p>`,
sec:[
{h:'Core concepts: services, providers, consumers, contracts',l:L(`<p>A <strong>service</strong> is like a shop counter: the shop (provider) offers things you can ask for, and customers (consumers) don’t need to know how the shop works behind the counter. As long as the counter stays the same, the shop can rebuild its kitchen.</p>`,
`<ul><li><strong>Service</strong>: a cohesive capability exposed via an interface (e.g., <code>ClimateControl</code>).</li><li><strong>Provider (server/skeleton)</strong> implements it; <strong>consumer (client/proxy)</strong> uses it.</li><li><strong>Interface elements</strong>: <em>methods</em> (request-response, e.g., <code>SetTargetTemp(zone, °C)</code>), <em>events</em> (notifications, e.g., <code>CabinTempChanged</code>), <em>fields</em> (state with get/set/notify, e.g., <code>FanLevel</code>).</li><li><strong>Service contract</strong>: interface definition + semantics + QoS + version + access rights + error behaviour.</li><li><strong>Service discovery</strong>: providers announce availability; consumers locate instances at runtime.</li><li><strong>Service lifecycle</strong>: design → versioning (major/minor compatibility) → deployment → deprecation.</li></ul>`,
`<p>Service design (granularity, naming, versioning) is hard: too fine → chatty networks and fragile coupling; too coarse → poor reuse. OEMs maintain service catalogues with governance boards ${B.pat}.</p>`,
`<p>SOA makes the vehicle a <strong>platform of capabilities</strong> that new features compose — the basis for features-on-demand and third-party apps.</p>`)},
{h:'Interactive: one climate service, many consumers',b:`<p>NOVA’s cabin climate service is used by the touchscreen HMI, the voice assistant, the phone app (via cloud) and the energy optimiser. Step through how it is exposed, discovered, consumed and executed.</p>${W('soaDemo')}`},
{h:'Loose coupling, reusability and distributed services',l:L(`<p>Loose coupling means you can swap one part without breaking the others — like changing a lightbulb without rewiring the house.</p>`,
`<p><strong>Loose coupling</strong> through stable interfaces, location transparency and discovery lets providers move between ECUs (e.g., from a domain controller into central compute) without changing consumers. <strong>Reusability</strong>: the same <code>SeatService</code> serves the HMI, memory-seat profiles and an “easy entry” feature. <strong>Distributed services</strong>: providers can be anywhere — zone controllers expose I/O services, central compute hosts logic, cloud hosts profile services.</p>`,
`<p>Reality check: loose coupling at interface level does not remove <em>temporal</em> coupling (latency, availability) or <em>semantic</em> coupling (shared assumptions). Safety analysis must still consider the full chain ${B.an}.</p>`,
`<p>SOA is what allows logical architecture to be independent of physical topology (zonal).</p>`)},
{h:'SOME/IP and DDS implementations of SOA',b:tbl(['Aspect','SOME/IP-based SOA','DDS-based SOA'],[
['Model','Service-oriented (service instances, methods/events/fields)','Data-centric (topics); RPC available as extension'],
['Discovery','SOME/IP-SD offers/finds','SPDP/SEDP participant and endpoint discovery'],
['QoS','Basic (UDP/TCP choice, E2E protection)','Rich QoS policies'],
['Footprint','Small; fits MCUs','Larger; fits HPCs (micro variants exist)'],
['Ecosystem','AUTOSAR Classic & Adaptive','Robotics, ROS 2, Adaptive DDS binding'],
['Typical use','Zone ↔ central, cross-ECU services','ADAS data flows inside/between HPCs'],
])},
{h:'SOA vs traditional signal-based communication',b:tbl(['Aspect','Signal-based','Service-oriented'],[
['Unit','Signal in a periodic frame (VehicleSpeed in 0x1A0 every 10 ms)','Service with methods/events/fields'],
['Binding','Static, design-time communication matrix','Dynamic or configured discovery at runtime'],
['Sender awareness','Broadcast regardless of need','Send to subscribers / on request'],
['Change impact','Changing a frame touches all ECUs on the bus','Add a consumer without changing provider'],
['Bandwidth','Efficient for small periodic data','Overhead per message; needs Ethernet'],
['Determinism','Very predictable','Needs engineering (TSN, static config) for determinism'],
['Best for','Low-level control, legacy ECUs','Cross-domain features, apps, scalability'],
])+key(`<p><strong>SOA vs microservices:</strong> SOA is the broader architectural style of exposing capabilities as services. Microservices are a specific cloud-native style (small, independently deployable services, own data, typically HTTP/gRPC, orchestrated on Kubernetes). Vehicle SOA borrows ideas but operates under real-time, safety and resource constraints — vehicle services are rarely “micro” in the cloud sense.</p>`)},
{h:'Advantages and challenges in automotive SOA',l:L(`<p>SOA makes cars easier to extend, but it can become a tangled web of services if not managed — like a city with too many delivery companies.</p>`,
`<p><strong>Advantages</strong>: reuse, extensibility, OTA-friendly modularity, cross-domain features, alignment with cloud APIs, parallel development by contract. <strong>Challenges</strong>: latency/jitter and determinism; network load; safety (E2E protection, timeouts, fallbacks); security (authentication/authorisation per service); version compatibility across fleet variants; tooling for tracing distributed calls; governance of hundreds of services; startup ordering and discovery timing at boot.</p>`,
`<p>Common pattern: <strong>hybrid</strong> — signals for low-level control within zones; services for cross-domain functions; gateways translating between them ${B.pat}.</p>`,
`<p>Failure analysis must ask: what if the provider is unavailable, slow, or returns wrong data? Every consumer needs defined degraded behaviour.</p>`),
x:fail(`<p>If NOVA’s climate service provider crashes, Platform Health Management detects missed checkpoints and restarts it; consumers see service “unavailable” via discovery, show “climate temporarily unavailable” and the zone controller holds the last safe actuator state (with defrost prioritised for visibility). Safety-relevant functions such as windscreen defrost may have a fallback path not dependent on the service.</p>`)}
],

links:[[8,'Middleware protocols that implement SOA.'],[7,'Adaptive AUTOSAR ara::com.'],[10,'SOA enables zonal logical/physical separation.'],[21,'Services enable features on demand.']],

['What allows the climate service to move from a domain ECU to central compute without changing the HMI app?',['Hard-coded addresses','Location transparency and stable service contracts','More CAN buses','A larger screen'],1,'Consumers depend on the contract, not location.'],
['Which is a genuine SOA challenge in vehicles?',['Too few ECUs','Determinism, version compatibility and per-service security','Lack of interfaces','Excessive signals'],1,'These are core engineering challenges.'],
['SOA vs microservices: which is true?',['They are identical','Microservices are a specific cloud-native style; SOA is the broader concept','SOA is only for the cloud','Microservices require CAN'],1,'Microservices are a subset/style of service orientation.'],
['Signal-based communication is still preferred for…',['Third-party apps','Low-level periodic control within a zone or legacy ECUs','Cloud APIs','OTA downloads'],1,'Signals are efficient and deterministic.'],

]});

WIDGETS.soaDemo=function(el){
  const steps=[
   ['Expose','At start-up, Execution Management launches the <b>ClimateService</b> provider in the CVC vehicle-functions partition. Its skeleton registers interface <code>ClimateControl v2.1</code>: methods <code>SetTargetTemp</code>, <code>SetFan</code>; fields <code>TargetTemp</code>, <code>FanLevel</code>; event <code>CabinTempChanged</code>.',['prov']],
   ['Announce','SOME/IP-SD sends an <b>OfferService</b> (service ID, instance, version, endpoint) over UDP multicast on the Ethernet backbone. Access policy says which clients may call which methods.',['prov','net']],
   ['Discover','The HMI app (Android Automotive VM, via a gateway service), the voice assistant and the energy optimiser issue <b>FindService</b>; each gets a proxy bound to the provider endpoint.',['hmi','voice','energy','net']],
   ['Subscribe','Consumers <b>subscribe</b> to the eventgroup containing <code>CabinTempChanged</code> and the <code>TargetTemp</code> notifier, so all screens show the same state.',['hmi','voice','energy','prov']],
   ['Consume','Driver says “set 21 degrees”. Voice assistant calls <code>SetTargetTemp(DRIVER, 21.0)</code>. Simultaneously the phone app (via cloud → TCU → remote-command gateway, authenticated) requests 23 °C for the passenger zone.',['voice','phone','prov']],
   ['Execute','The provider validates permissions and ranges, arbitrates priorities (in-car occupant beats remote), consults the energy optimiser’s constraints (e.g., heat-pump mode) and computes actuator targets.',['prov','energy']],
   ['Actuate','The provider sends commands to front-left and front-right <b>zone controllers</b> (SOME/IP → AUTOSAR Classic SWCs) which drive blend-door motors via LIN and the blower via PWM; the thermal system adjusts the heat pump.',['prov','zone']],
   ['Feedback','Zone sensors report duct/cabin temperatures; the provider publishes <code>CabinTempChanged</code>; HMI, voice and phone app update. Method calls return <code>OK</code>; telemetry logs the session.',['zone','prov','hmi','phone','voice']]];
  const N={hmi:[70,40,'HMI app'],voice:[70,100,'Voice assistant'],phone:[70,160,'Phone app (cloud)'],energy:[70,220,'Energy optimiser'],net:[270,130,'SOME/IP-SD'],prov:[430,130,'ClimateService'],zone:[570,130,'Zone ctrls → actuators']};
  let i=0;
  el.innerHTML=`<div class="dia"><svg viewBox="0 0 660 260" width="660" id="soaSvg"></svg></div><div class="btns"><button class="btn sm" id="soaPrev">← Back</button><button class="btn sm pri" id="soaNext">Next step →</button><span class="tiny" id="soaN" style="align-self:center"></span></div><div class="panel" id="soaP"></div>`;
  function draw(){const act=steps[i][2];let s='';
    ['hmi','voice','phone','energy'].forEach(k=>{s+=`<line x1="${N[k][0]+60}" y1="${N[k][1]}" x2="${N.prov[0]-60}" y2="130" stroke="${act.includes(k)&&act.includes('prov')?'#22d3ee':'#22304a'}" stroke-width="2"/>`});
    s+=`<line x1="${N.prov[0]+60}" y1="130" x2="${N.zone[0]-60}" y2="130" stroke="${act.includes('zone')?'#22d3ee':'#22304a'}" stroke-width="2"/>`;
    Object.entries(N).forEach(([k,[x,y,t]])=>{const on=act.includes(k);s+=`<rect x="${x-62}" y="${y-18}" width="124" height="36" rx="9" fill="${on?'rgba(34,211,238,.18)':'#111a2c'}" stroke="${on?'#22d3ee':'#2c3d5c'}" stroke-width="1.6"/><text x="${x}" y="${y+4}" text-anchor="middle" font-size="11" fill="#e6edf8" font-weight="600">${t}</text>`});
    el.querySelector('#soaSvg').innerHTML=s;
    el.querySelector('#soaP').innerHTML=`<div class="kicker">Step ${i+1} of ${steps.length}</div><h3>${steps[i][0]}</h3><p>${steps[i][1]}</p>`;
    el.querySelector('#soaN').textContent=`${i+1}/${steps.length}`;}
  el.querySelector('#soaNext').onclick=()=>{i=(i+1)%steps.length;draw()};
  el.querySelector('#soaPrev').onclick=()=>{i=(i-1+steps.length)%steps.length;draw()};

};
/* ============ MODULE 10 ============ */
MOD({n:10,id:'m10',t:'Zonal Architecture Deep Dive',s:'Zones, zone controllers, power, backbone, wiring — and the hard trade-offs',mins:60,
intro:`<p>Zonal architecture is the physical foundation most next-generation SDV platforms are moving to. This module goes deep: what a zone controller actually does, how power and data are aggregated, how the backbone is built, and what you give up in exchange for a lighter harness and a cleaner software architecture.</p>`,
sec:[
{h:'Full-vehicle zonal diagram (Project NOVA)',b:`<p>Tap any node to see its responsibilities, connected devices, silicon and failure behaviour.</p>${W('zonalMap')}`},
{h:'Why zonal architecture emerged',l:L(`<p>In older cars, a wire for the rear-left window might run all the way from a body computer near the dashboard. Multiply that by hundreds of functions and you get kilometres of wire. Zonal design puts a local hub in each corner of the car, so wires stay short and the hubs talk to the main computer over a single fast cable.</p>`,
`<p>Drivers: (1) <strong>harness cost, weight and manufacturing</strong> — harnesses are among the heaviest, most expensive and least automatable parts of a vehicle; (2) <strong>ECU proliferation</strong> and chip diversity; (3) <strong>centralised compute</strong> needs an I/O layer that is generic and location-based; (4) <strong>scalability</strong> — the same zone controllers can serve many models; (5) <strong>software</strong> — removing function logic from scattered ECUs makes OTA and cross-domain features simpler.</p>`,
`<p>Rivian reports its Gen 2 R1 zonal redesign cut ECUs from 17 to 7 and removed about 1.6 miles of wiring (≈44 lb), with a further 2.3 miles removed on R2 ${B.co}. BMW describes its Neue Klasse iX3 as using four “superbrain” high-performance computers replacing dozens of control units ${B.co}.</p>${src([['InsideEVs — Rivian zonal','https://insideevs.com/news/761865/rivian-zonal-architecture-development/'],['TechCrunch/Yahoo — Rivian wiring reduction','https://ca.news.yahoo.com/rivian-overhauled-r1s-r1t-entice-160015197.html'],['WardsAuto — BMW iX3 superbrains','https://www.wardsauto.com/news/bmw-unveils-clean-sheet-electric-ix3/798927/']])}`,
`<p>Zonal is the physical half of the SDV transformation; central compute + SOA is the logical half. Neither delivers full value alone.</p>`)},
{h:'Physical zones and zone controller responsibilities',l:L(`<p>A zone controller is a neighbourhood hub with five jobs: collect sensor readings, switch power to local devices, pass messages to and from the main computer, run very fast local reflexes, and keep its neighbourhood safe from intruders.</p>`,
`<p><strong>Zone layouts</strong> vary: four corner zones (FL, FR, RL, RR), three zones (left, right, rear), or two/front-rear plus a central zone ${B.pat}. NOVA uses four.</p>${tbl(['Responsibility','Details'],[
['I/O aggregation','Direct digital/analog I/O, LIN commanders, CAN FD sub-buses, 10BASE-T1S edge nodes for switches, motors, lamps, sensors in the zone'],
['Power distribution','Receives power feed(s); distributes to loads via e-fuses / smart high-side switches with current sensing, programmable trip curves, load shedding and sleep control'],
['Gateway & translation','Signal ↔ service translation (CAN/LIN signals ↔ SOME/IP events), routing, filtering (firewall)'],
['Network switching','Integrated Ethernet switch forwarding backbone traffic; TSN scheduling'],
['Local real-time control','Time-critical reflexes (e.g., window anti-pinch, wiper park, lighting fail-safe) that should not depend on central compute'],
['Safety','Safe states, redundant power paths for critical loads, monitoring'],
['Security & diagnostics','SecOC/MACsec endpoints, intrusion detection sensors, DTCs, DoIP routing, OTA target'],
])}`,
`<p>A key design decision is <strong>how much logic stays in the zone</strong>. GM describes its zone “aggregators” as executing no control logic, with all intelligence on central compute ${B.co}; other OEMs keep local functions in zones for latency, robustness or supplier reasons ${B.pat}. Typical zone silicon: multicore safety MCUs (ASIL B–D) with Ethernet switching (e.g., NXP S32 families, Infineon AURIX, Renesas RH850/R-Car S4 class) ${B.co}.</p>`,
`<p>Zone controllers turn the physical vehicle into a <strong>generic, location-addressable I/O and power fabric</strong>. Software no longer cares which box drives a lamp — it calls a service.</p>`)},
{h:'Central compute vs distributed I/O — logical vs physical architecture',l:L(`<p>The <em>logical</em> architecture is the org chart: who decides what. The <em>physical</em> architecture is the office map: who sits where. Zonal lets you redesign the office map without changing the org chart, and vice versa.</p>`,
`<p><strong>Logical architecture</strong>: functions and services, their interfaces and data flows (e.g., <code>ExteriorLightingService</code> decides headlamp state). <strong>Physical architecture</strong>: ECUs, harness, networks, power. In distributed/domain designs these are tightly coupled (the lighting function lives in the box wired to lamps). In zonal designs, the lighting <em>logic</em> runs in central compute, while the lamp <em>drivers</em> sit in whichever zone is physically closest. Mapping logical to physical (deployment) becomes a configurable step — central to tools like PREEvision or Capital ${B.co}.</p>`,
`<p>Benefits: functions can be redeployed (e.g., moved into a zone for latency) without changing interfaces. Costs: more network hops; end-to-end latency budgets and failure chains must be analysed across nodes.</p>`,
`<p>This separation is the single most important idea in modern E/E design.</p>`)},
{h:'Domain controller vs zone controller — concrete examples',b:tbl(['Scenario','Domain architecture','Zonal architecture'],[
['Rear-left window','Body domain controller (front of car) wired to rear-left window motor and switch; window logic runs there','RL zone drives motor locally; window logic runs in central compute (or as local reflex in zone for anti-pinch)'],
['Exterior lighting','Lighting ECU/body domain wired to all lamps around the car','Each zone drives nearby lamps; central lighting service coordinates'],
['Wiper','Body domain controller wired to wiper motor; rain sensor on separate bus','FL/FR zone drives wiper; rain sensor data published as a service'],
['Seat heating','Seat module per seat or body domain','Zone controls heater element via e-fuse; climate/comfort service decides level'],
['Adding a new feature (welcome lighting animation)','Change body domain software and possibly lighting ECU firmware from a supplier','New central app using existing lighting services; zones unchanged'],
])+key(`<p>A <strong>domain controller</strong> answers “which function?” — a <strong>zone controller</strong> answers “which place?”.</p>`)},
{h:'Automotive Ethernet backbone and power distribution',l:L(`<p>The backbone is the car’s motorway linking the corner hubs to headquarters. Many designs build it as a loop, so if one road is blocked, traffic goes the other way round.</p>`,
`<ul><li><strong>Backbone links</strong>: 1000BASE-T1 or multi-gig (2.5/5/10GBASE-T1, IEEE 802.3ch) between zones and central compute; optical (802.3cz) emerging ${B.em}.</li><li><strong>Topologies</strong>: star (each zone to CVC), ring (zones in a loop with CVC — tolerates a single link failure), or dual star for redundancy.</li><li><strong>TSN</strong> features: time-aware shaping (802.1Qbv) for deterministic control traffic; frame replication and elimination (802.1CB) for redundant paths; gPTP time sync.</li><li><strong>Edge</strong>: 10BASE-T1S multidrop extends Ethernet to low-cost nodes, potentially replacing some CAN/LIN.</li><li><strong>Power</strong>: battery/DC-DC → main power distribution → zone feeds (sometimes dual feeds for ASIL loads) → e-fuses → loads. Software-controlled power enables load shedding, quiescent current control and remote diagnosis of shorts.</li></ul>`,
`<p>Harness reduction enables automated manufacturing — harnesses are traditionally assembled largely by hand ${B.an}. The 48 V low-voltage trend (Tesla Cybertruck) further reduces copper ${B.co}.</p>`,
`<p>Backbone bandwidth headroom must cover future sensors and features: architects typically provision several times today’s peak.</p>`)},
{h:'Trade-offs, redundancy, safety and security',l:L(`<p>Putting a hub in each corner saves wires — but if a hub fails, a whole corner goes quiet. So designers add backup paths, especially for things like brake lights and headlamps.</p>`,
`${tbl(['Trade-off','Benefit','Cost / risk','Mitigation'],[
['Harness reduction','Less copper, weight, cost','Zone controllers become complex mixed-signal nodes','Standardised zone hardware across models'],
['Central logic','Cross-domain features, OTA','Latency + dependency on network & CVC','Local reflexes in zones; latency budgets; TSN'],
['Fewer ECUs','Fewer part numbers','Larger blast radius per failure','Redundant feeds/paths; degradation modes'],
['Generic I/O','Scalability','Zone must support many I/O types','Smart sensors/actuators; 10BASE-T1S'],
['Ethernet backbone','Bandwidth, IP tooling','New attack surface','Segmentation (VLANs), MACsec, firewalls, IDS'],
])}<p><strong>Safety</strong>: critical loads (brake lights, hazard lights, low beam) often have redundant drive paths or fall back to safe defaults if central compute or backbone fails; zone controllers must detect loss of central heartbeat and enter defined states. <strong>Security</strong>: zones are network enforcement points — they filter which messages may reach which actuators.</p>`,
`<p>In practice, OEMs keep certain safety ECUs (brake, EPS, airbag) as dedicated controllers connected to the zonal network rather than absorbing them into zones ${B.pat}.</p>`,
`<p>Every zonal design must be accompanied by a <strong>degradation concept</strong>: what still works when the CVC, a zone, or a backbone link is lost?</p>`),
x:fail(`<p>NOVA, front-left zone loss: low beam on the left is driven by a redundant path from the FR zone; the CVC detects the loss, informs the driver, limits speed and requests a stop if lighting at night is insufficient. Loss of the CVC: zones enter “limp” mode — hazard lights, brake lights and low beams default on, doors unlockable, and the separate brake/EPS controllers continue to operate safely with driver inputs.</p>`)},
{h:'Migration from legacy ECU architecture',l:L(`<p>You can’t rebuild a city overnight. Carmakers move step by step: first group things into departments, then add neighbourhood hubs, often carrying old parts along for a while.</p>`,
`<ol><li><strong>Consolidate</strong> functions into domain controllers; introduce Ethernet backbone.</li><li><strong>Introduce zones</strong> for body/comfort I/O first (low risk), keeping legacy CAN ECUs attached to zones.</li><li><strong>Move logic</strong> to central compute progressively, using signal-to-service gateways.</li><li><strong>Absorb or smarten</strong> remaining ECUs (smart actuators), retire legacy buses.</li></ol>`,
`<p>Legacy OEMs face carry-over parts, supplier contracts and validated software that cannot be discarded; start-ups and clean-sheet EV platforms can jump directly. This is one reason VW partnered with Rivian for its zonal architecture ${B.an}.</p>`,
`<p>Migration is as much organisational (who owns zone software? who owns lighting logic?) as technical.</p>`)}
],
terms:[['Zone','Physical region of the vehicle served by a zone controller.'],['Zone controller','Location-based I/O, power and gateway node.'],['E-fuse','Electronic fuse with programmable protection.'],['Backbone','High-speed network connecting zones and central compute.'],['10BASE-T1S','10 Mbit/s multidrop single-pair Ethernet.'],['Logical architecture','Functions and their interactions.'],['Physical architecture','Hardware, harness and network topology.'],['Degradation concept','Defined behaviour under partial failures.']],
mis:[['Zone controllers are just domain controllers renamed.','Domain = function-based grouping; zone = location-based grouping with power distribution and I/O aggregation.'],['Zonal means no local logic anywhere.','Many designs keep local reflexes in zones; the degree of “dumbness” is an OEM choice.']],
links:[[3,'Architecture evolution context.'],[11,'Networks and TSN.'],[14,'Safety and redundancy.'],[15,'Security segmentation.']],
take:['Zones are organised by location and handle I/O, power distribution, gateway and local reflexes.','Zonal decouples physical topology from logical function deployment.','Backbones use multi-gig Ethernet, often redundant, with TSN for determinism.','Redundancy and degradation concepts are mandatory for safety-relevant loads.','Migration is incremental for legacy OEMs; clean-sheet platforms can jump.'],
quiz:[
['Which is NOT typically a zone controller responsibility?',['Power distribution via e-fuses','Signal-to-service translation','Training neural networks','Local I/O aggregation'],2,'Training happens in the cloud.'],
['Why might a ring backbone be chosen?',['It is cheaper than any star','It tolerates a single link failure by routing the other way','It removes the need for TSN','It eliminates zones'],1,'Rings provide path redundancy.'],
['Rear-left window logic in a zonal design most likely runs…',['In the front body domain controller','In central compute, with the RL zone driving the motor (anti-pinch possibly local)','In the cloud','In the TCU'],1,'Logic central; I/O local.','Scenario'],
['What does “logical vs physical architecture” separation enable?',['Fewer services','Redeploying functions between nodes without changing interfaces','Removing safety analysis','Using LIN only'],1,'Function deployment becomes configurable.'],
['Which statement about GM’s announced architecture is accurate?',['Zones run all control logic','GM says its aggregators execute no control logic; intelligence runs on the central Thor-based platform','It has no central compute','It is purely CAN-based'],1,'Per GM’s description.'],
['If NOVA’s central computer fails, zone controllers should…',['Turn everything off','Enter defined degraded states (e.g., hazard and brake lights, low beam default on)','Reboot the cloud','Ignore it'],1,'Degradation concepts define safe behaviour.','Scenario']
]});

MOD({n:11,id:'m11',t:'Vehicle Networking and Data Architecture',s:'CAN, CAN FD, LIN, FlexRay, Ethernet, TSN — performance, QoS, security and real scenarios',mins:55,
intro:`<p>Networks are the nervous system of the vehicle. This module explains how each in-vehicle network actually works, the performance vocabulary (bandwidth, latency, jitter, loss, QoS), how networks are segmented and secured, and how to pick the right one.</p>`,
sec:[
{h:'CAN and CAN FD: how they really work',l:L(`<p>CAN is like a polite meeting where everyone can speak, but if two start at once, the one with the more important message automatically wins and the other waits — without anyone being interrupted mid-sentence.</p>`,
`<p><strong>CAN</strong> (ISO 11898): two-wire differential bus (CAN_H/CAN_L), multi-master. Messages carry an <strong>identifier</strong> (11-bit standard or 29-bit extended) rather than addresses. <strong>Bitwise arbitration</strong>: dominant (0) bits override recessive (1) bits; the lowest ID wins without corrupting the frame — so IDs encode priority. Frames carry up to 8 data bytes, CRC, ACK. <strong>Bit stuffing</strong> keeps synchronisation. <strong>Error confinement</strong>: error counters move nodes to error-passive or bus-off. Typical speeds 500 kbit/s (max 1 Mbit/s).</p><p><strong>CAN FD</strong>: flexible data rate — arbitration at nominal rate, then data phase at a higher rate (commonly 2–5 Mbit/s), payload up to 64 bytes; improved CRC. <strong>CAN XL</strong> extends to ~20 Mbit/s and 2048-byte payload ${B.em}.</p><p>Signals are defined in <strong>DBC</strong> or ARXML communication databases (start bit, length, scaling, offset, unit).</p>`,
`<p>CAN remains ubiquitous due to robustness, low cost and tooling (Vector CANoe/CANalyzer, etc.) ${B.est}. Limitation: no built-in security — any node can send any ID (Module 15).</p>`,
`<p>In zonal designs CAN FD persists as the local sub-bus inside zones and for safety links (brake ↔ EPS), while Ethernet takes the backbone.</p>`)},
{h:'LIN and FlexRay',l:L(`<p>LIN is a cheap single-wire bus for simple things like window switches and mirror motors — one boss asks each helper in turn. FlexRay was an expensive, ultra-punctual bus for chassis systems — now being retired.</p>`,
`<p><strong>LIN</strong> (ISO 17987): single wire, up to 20 kbit/s, one commander (master) and up to ~16 responders (slaves) polled via a schedule table; cheap transceivers, often integrated into smart actuators. <strong>FlexRay</strong> (ISO 17458): 10 Mbit/s per channel, two channels for redundancy, <strong>time-triggered</strong> static segment (TDMA slots) plus dynamic segment; deterministic and fault-tolerant but costly and complex. First production use in 2006 (BMW X5 adaptive drive) ${B.est}.</p>`,
`<p>LIN remains popular for low-cost edge devices; FlexRay is largely being superseded by CAN FD and TSN Ethernet in new designs ${B.pat}.</p>`,
`<p>FlexRay’s ideas (time-triggered determinism) live on in TSN’s time-aware shaping.</p>`)},
{h:'Automotive Ethernet and TSN',l:L(`<p>Automotive Ethernet is the same idea as office Ethernet, but over a single twisted pair of wires that survives car conditions. TSN (Time-Sensitive Networking) adds a timetable so urgent messages always get through on time.</p>`,
`<p><strong>PHYs</strong>: 10BASE-T1S (multidrop, PLCA collision avoidance), 100BASE-T1 (IEEE 802.3bw), 1000BASE-T1 (802.3bp), 2.5/5/10GBASE-T1 (802.3ch), optical 802.3cz. Switched, full-duplex point-to-point links (except T1S). Higher layers: VLANs (802.1Q) with priorities (PCP), IP, UDP/TCP, SOME/IP, DoIP, AVB/TSN.</p><p><strong>TSN</strong> toolbox: <code>802.1AS</code> time sync; <code>802.1Qbv</code> time-aware shaper (scheduled gates); <code>802.1Qav</code> credit-based shaper (audio/video); <code>802.1CB</code> frame replication & elimination for reliability (FRER); <code>802.1Qci</code> per-stream filtering and policing; frame preemption (802.1Qbu/802.3br). Automotive profile: IEEE P802.1DG ${B.est}.</p>`,
`<p>Ethernet adoption is universal in new platforms for backbone, cameras/radars (via Ethernet or SerDes), diagnostics (DoIP) and OTA. TSN adoption is progressing; many vehicles use QoS priorities without full scheduled TSN ${B.an}.</p>`,
`<p>Ethernet makes the vehicle network look like an IT network — bringing IP tooling, but also IP-style attacks and the need for network security architecture.</p>`)},
{h:'Bandwidth, latency, jitter, packet loss and QoS',b:tbl(['Metric','Definition','Why it matters','Example target'],[
['Bandwidth','Data rate a link can carry','Cameras, LiDAR, logging, OTA','Backbone ≥1–10 Gbit/s'],
['Latency','Time from send to receive','Control loops, AEB reaction','Control messages: a few ms or less end-to-end per hop budget'],
['Jitter','Variation in latency','Control stability, sensor fusion timing','Sub-millisecond for scheduled control traffic'],
['Packet loss','Fraction of frames lost','Safety messages need detection/redundancy','Near zero; E2E counters detect loss'],
['QoS','Mechanisms prioritising traffic classes','Prevents infotainment starving control','VLAN PCP, TSN shaping, CAN ID priority'],
],'Targets are illustrative; real budgets come from system requirements.')},
{h:'Topology, segmentation, gateways and routing',l:L(`<p>Like a city with separate areas for houses, factories and hospitals, a car network is split into zones and domains with gates between them, so a problem in the music system can’t reach the brakes.</p>`,
`<ul><li><strong>Topology</strong>: buses (CAN/LIN), stars and rings (Ethernet switches), daisy chains (T1S).</li><li><strong>Segmentation</strong>: separate physical networks or VLANs per domain/criticality; security zones (e.g., infotainment and connectivity in untrusted zone).</li><li><strong>Gateways</strong>: routing between segments, protocol translation (CAN↔Ethernet, signal↔service), message filtering (allow-lists), rate limiting, diagnostic routing.</li><li><strong>Data routing</strong>: static routing tables (communication matrix), switch forwarding tables, multicast groups for events.</li></ul>`,
`<p>Network architecture tools (e.g., PREEvision, Capital, CANoe for simulation) are used to model topology, compute bus loads and generate configurations ${B.co}.</p>`,
`<p>Segmentation is where safety (freedom from interference) and security (defence in depth) requirements meet.</p>`)},
{h:'Data acquisition, diagnostics communication and network security',l:L(`<p>Engineers need to listen to the network to test cars, mechanics need to talk to ECUs, and everyone needs to make sure nobody evil is sneaking in.</p>`,
`<ul><li><strong>Data acquisition</strong>: development loggers capture bus traffic; <strong>XCP</strong> (ASAM) reads/writes ECU internal variables for measurement and calibration; production fleets use selective, event-triggered data collection.</li><li><strong>Diagnostics</strong>: UDS over ISO-TP (CAN) or DoIP (Ethernet); the gateway routes tester requests.</li><li><strong>Security</strong>: SecOC (MAC + freshness on CAN/Ethernet messages), MACsec (802.1AE, Layer-2 encryption/integrity), IPsec/TLS, firewalls in gateways/switches, network intrusion detection (IDS) reporting to a Vehicle SOC.</li></ul>`,
`<p>UN R155 requires mitigations for threats to in-vehicle communication, which pushes secure communication into all new type approvals ${B.est}.</p>`,
`<p>Data acquisition infrastructure becomes the foundation of fleet data pipelines (Module 17).</p>`)},
{h:'Network comparison matrix',b:tbl(['Network','Speed','Determinism','Cost/node','Security built-in','Typical role in SDV'],[
['LIN','≤20 kbit/s','Scheduled (commander)','Lowest','None','Edge actuators/switches in zones'],
['CAN','≤1 Mbit/s','Priority-based, predictable','Low','None (add SecOC)','Legacy & safety links, zone sub-buses'],
['CAN FD','2–5+ Mbit/s data','Priority-based','Low','None (add SecOC)','Zone sub-buses, chassis, BMS'],
['FlexRay','10 Mbit/s ×2','Time-triggered','High','None','Legacy chassis'],
['10BASE-T1S','10 Mbit/s shared','PLCA (deterministic-ish)','Low–medium','MACsec possible','Emerging edge replacement for CAN/LIN'],
['100/1000BASE-T1','100 Mbit/s–1 Gbit/s','With TSN','Medium','MACsec/IPsec/TLS','Backbone, sensors, diagnostics'],
['Multi-gig T1','2.5–10 Gbit/s','With TSN','Higher','As above','High-bandwidth backbone, compute links'],
])},
{h:'Practical communication scenarios',b:`<h3>Scenario 1 — Signal-based vs service-based for the same data</h3><p>Vehicle speed is computed by the brake ECU from wheel speeds. <strong>Signal-based:</strong> broadcast every 10 ms on chassis CAN FD as <code>VehicleSpeed</code>; the gateway forwards it to other buses. <strong>Service-based:</strong> a <code>VehicleMotion</code> service in central compute publishes <code>Speed</code> as a SOME/IP event to subscribers (cluster, ADAS, apps via vehicle API) — only consumers that need it receive it beyond the backbone.</p>${flow(['c1:Wheel-speed sensors','c4:Brake ECU|computes speed','c2:CAN FD|signal 10 ms','c3:Zone/Gateway|signal→service','c2:Ethernet backbone|SOME/IP event','c1:Cluster, ADAS, apps'])}<h3>Scenario 2 — Front camera to perception</h3>${flow(['c1:Camera (8 MP)','c2:SerDes link|several Gbit/s','c3:ADAS SoC ISP','c4:Zero-copy IPC|DNN inference','c5:Object list|DDS/SOME/IP on TSN','Planning'])}<h3>Scenario 3 — Workshop flashing a zone ECU</h3>${flow(['Tester / cloud OTA','c2:DoIP|over Ethernet','c3:Gateway / CVC|authenticate','c1:Zone ECU|UDS 0x34/36/37','c4:Verify signature|activate bank'])}`}
],

MOD({n:12,id:'m12',t:'Cloud-Native Automotive Architecture',s:'TCU, connectivity, IoT platforms, data pipelines, digital twins, fleet operations and privacy',mins:55,
intro:`<p>An SDV is half in the car and half in the cloud. Updates, data, personalisation, remote diagnostics and AI training all depend on a cloud backend. This module traces the full vehicle → cloud → vehicle loop and explains what belongs where.</p>`,
sec:[
{h:'Connected vehicle architecture and the TCU',l:L(`<p>The <strong>TCU</strong> (Telematics Control Unit) is the car’s phone: it has a SIM, talks to mobile networks, knows where it is via satellites, and passes messages between the car and the carmaker’s servers.</p>`,
`<p>TCU contents: cellular modem (4G LTE / 5G NR), eSIM/embedded UICC, GNSS receiver (GPS, Galileo, GLONASS, BeiDou; optionally correction services), application processor, HSM, sometimes Wi-Fi/Bluetooth and C-V2X; emergency call (eCall in the EU, mandatory since 2018 for new types) with backup battery and antenna. Software: connection manager, MQTT/HTTPS clients, OTA download agent, remote-command handler, certificate store. Connected to the CVC via Ethernet; acts as an untrusted-edge security boundary.</p>`,
`<p>TCUs are often supplied by Tier 1s (e.g., LG, Harman, Continental/AUMOVIO, Bosch, Denso) on modems from Qualcomm and others ${B.pat}. Some OEMs integrate connectivity into central compute boards. Cellular generation sunsets (2G/3G) have stranded older connected cars — a lifecycle lesson ${B.est}.</p>`,
`<p>The TCU is a gateway in three senses: network (cellular ↔ Ethernet), security (untrusted ↔ trusted) and business (the channel for every digital service).</p>`)},
{h:'Connectivity technologies',b:tbl(['Technology','Role','Notes'],[
['4G LTE / 5G NR','Primary vehicle–cloud link','5G adds bandwidth and lower latency; coverage varies'],
['Wi-Fi','Large downloads at home/depot; hotspot; in-cabin','Can reduce cellular costs for OTA'],
['Bluetooth / BLE','Phone audio, phone-as-key proximity','BLE for digital key approach detection'],
['UWB','Secure precise ranging for digital keys','Car Connectivity Consortium Digital Key standard'],
['GNSS','Positioning','Multi-constellation; RTK/PPP corrections for lane-level accuracy'],
['C-V2X / DSRC','Vehicle-to-everything direct communication','Deployment varies by region (Module 23)'],
['NFC','Card/phone key backup','Close-range'],
])},
{h:'Vehicle-to-cloud-to-vehicle data flow',b:flow(['c1:Vehicle sensors & apps|signals, events','c3:Edge collection in CVC|filter, aggregate, compress','c2:TCU|MQTT/HTTPS over TLS (mTLS)','c4:Cloud ingestion|IoT gateway, stream (e.g., Kafka-style)','c5:Processing|stream + batch, data lake','c1:Services|analytics, digital twin, ML training','c3:Decisions|campaigns, configs, models','c2:Cloud→vehicle|commands, OTA, configs'],{cap:'Closed loop: data in, decisions and software out. Each hop authenticated and encrypted.'})+tbl(['Hop','Key concerns'],[
['In-vehicle collection','What to collect (policies), when (triggers), cost (data volume), consent'],
['Uplink','Intermittent connectivity, store-and-forward, prioritisation, cellular cost'],
['Ingestion','Scale (millions of vehicles), authentication per vehicle identity, schema validation'],
['Processing & storage','Hot vs cold storage, partitioning by VIN/time, retention policies'],
['Downlink','Command authorisation, idempotency, vehicle state checks, auditing'],
])},
{h:'Cloud computing, edge computing, IoT platforms and microservices',l:L(`<p>The cloud is a giant data centre that can store everything and think hard but is far away. The edge (the car itself, or a nearby server) is close and fast but limited. Good design puts each job where it fits best.</p>`,
`<ul><li><strong>IoT platforms</strong>: device identity, registry, secure messaging, device shadows (last known state), rules — e.g., AWS IoT Core and AWS IoT FleetWise for vehicle data collection, Azure IoT Hub ${B.co}.</li><li><strong>Microservices</strong>: OEM backend split into independently deployable services (entitlements, profiles, OTA campaign manager, remote commands, analytics), exposed via <strong>cloud APIs</strong> (REST/gRPC) to apps and partners.</li><li><strong>Kubernetes</strong>: orchestrates containers across clusters; autoscaling for update-day peaks.</li><li><strong>Edge computing</strong>: processing in the vehicle (in-vehicle edge) or multi-access edge computing (MEC) near cell towers for low-latency services.</li><li><strong>Data lakes / lakehouses</strong>: raw and curated data at scale; <strong>data pipelines</strong> transform raw signals into features.</li><li><strong>Digital twins</strong>: cloud-side models mirroring each vehicle’s configuration and state (Module 17).</li><li><strong>Device and fleet management</strong>: software inventory per vehicle, configuration, campaigns, health.</li><li><strong>Observability</strong>: metrics, logs, traces — for the backend and, increasingly, for vehicle software (fleet-level crash and performance analytics).</li></ul>`,
`<p>OEMs commonly build on hyperscalers (AWS, Microsoft Azure, Google Cloud; in China, local providers) — sometimes multiple — with hybrid/multi-cloud for regulation, data residency and negotiation leverage ${B.pat}. Vendor platforms (e.g., Sonatus, Sibros, Tata Elxsi TETHER, Harman) offer vehicle data and OTA stacks ${B.co}.</p>${src([['Tata Elxsi SDV & TETHER','https://www.tataelxsi.com/industries/automotive/software-defined-vehicles'],['Mahindra partners incl. Sibros OTA','https://e-vehicleinfo.com/mahindra-ev-hardware-software-partnership/']])}`,
`<p>The vehicle becomes an <strong>edge node</strong> of a distributed system. Interfaces between in-vehicle SOA and cloud microservices (identities, schemas, versioning) must be designed together.</p>`)},
{h:'What belongs in the vehicle, at the edge, and in the cloud',b:tbl(['Function','Vehicle','Edge (MEC/roadside)','Cloud','Why'],[
['Braking, steering control','✓','','','Hard real-time, safety — never cloud-dependent'],
['ADAS perception & planning','✓','(future: cooperative perception)','Training, validation','Latency; cloud trains models'],
['Navigation routing','On-board fallback','','Live traffic, charging availability','Freshness; offline fallback'],
['Battery state estimation','Real-time ✓','','Long-term health models','Fast loop local, slow loop cloud'],
['Voice assistant','Wake word, basic commands','','Large language understanding','Compute vs privacy vs connectivity'],
['OTA','Install, verify, activate','CDN caches','Build, sign, campaign orchestration','Separation of duties'],
['Personal profiles','Cached','','Master copy','Follows driver across cars'],
['Predictive maintenance','Anomaly pre-filtering','','Fleet models','Fleet-scale learning'],
])+key(`<p><strong>Edge vs cloud:</strong> edge = near the data source, low latency, limited resources, works offline; cloud = centralised, elastic, fleet-wide view, higher latency, needs connectivity. Rule: <em>anything safety-critical must work without the cloud.</em></p>`)},
{h:'Remote diagnostics, data governance and privacy',l:L(`<p>Your car knows where you go, how you drive and maybe even your voice. That data is valuable and personal, so laws say carmakers must ask permission, protect it and only use it for agreed purposes.</p>`,
`<ul><li><strong>Remote diagnostics</strong>: read DTCs and snapshots via cloud (UDS/SOVD tunnelled through secure channels), pre-diagnose before workshop visits, trigger data collection on events.</li><li><strong>Data governance</strong>: data catalogues, ownership, quality rules, lineage, retention, access control, purpose limitation.</li><li><strong>Privacy</strong>: consent management, anonymisation/pseudonymisation, data minimisation, data subject rights. Laws include the EU GDPR, India’s Digital Personal Data Protection Act 2023, China’s PIPL and automotive-data rules, and US state laws; the EU Data Act (applicable from September 2025) adds rules on access to connected-product data ${B.est}.</li><li><strong>Data residency</strong>: some jurisdictions require local storage/processing.</li></ul>`,
`<p>Privacy and security failures can halt services in whole markets; governance is a board-level topic for OEMs ${B.an}.</p>`,
`<p>Governance must be engineered into collection policies in the vehicle, not only applied in the cloud.</p>`)}
],

MOD({n:13,id:'m13',t:'Over-the-Air (OTA) Updates',s:'From build to fleet: packaging, signing, orchestration, A/B, rollback — with a 100,000-vehicle BMS rollout',mins:65,
intro:`<p>OTA is the delivery mechanism of the software-defined vehicle. Done well, it fixes defects, adds features and extends vehicle life without workshop visits. Done badly, it can brick cars at scale. This module walks through the complete technical process.</p>`,
sec:[
{h:'What OTA is: FOTA, SOTA and update types',l:L(`<p>OTA updates are like phone updates for your car: new software arrives wirelessly. But a car is much harder: dozens of computers must update together, safely, and the car must never be left unable to drive.</p>`,
`${tbl(['Term','Meaning','Example'],[
['FOTA (firmware OTA)','Updating low-level ECU firmware/images','New brake ECU firmware, zone controller image'],
['SOTA (software OTA)','Updating higher-level software/apps','Infotainment app, maps, ADAS app container'],
['Full image update','Replace complete partition/image','New Linux root file system'],
['Differential (delta) update','Transfer only the binary difference','Patch 30 MB instead of 800 MB'],
['Application update','Single app/package','Media app, climate app'],
['Configuration / calibration update','Parameters only','Charging curve table, feature flags'],
])}<p>Terminology varies: some use FOTA for all ECU updates and SOTA for infotainment; others use “OTA” generically ${B.an}.</p>`,
`<p>UN R156 requires a certified Software Update Management System (SUMS) for type approval in participating markets; updates affecting type-approved systems must be managed and documented, and the vehicle’s software identification (RXSWIN) tracked ${B.est}.</p>`,
`<p>OTA spans every layer: cloud campaign management, connectivity, security, in-vehicle orchestration, bootloaders, storage and diagnostics.</p>`)},
{h:'Interactive OTA lifecycle',b:W('otaLife')},
{h:'Packaging, signing, encryption and secure boot',l:L(`<p>Every update arrives in a sealed envelope with a tamper-proof signature. The car checks the signature with a key it trusts; if the envelope was opened or forged, it refuses to install.</p>`,
`<ul><li><strong>Package</strong>: payload (images, deltas, containers) + metadata/manifest (target ECU, hardware compatibility, versions, dependencies, preconditions, hashes).</li><li><strong>Digital signatures</strong>: built artefacts are hashed and signed with private keys held in a backend HSM; vehicles verify with public keys/certificates anchored in hardware.</li><li><strong>Uptane</strong>: an open OTA security framework (Linux Foundation project) separating an <em>Image repository</em> (what software exists, offline keys) from a <em>Director repository</em> (what this vehicle should install), with role keys, thresholds and freshness to resist compromise of a single key ${B.est}.</li><li><strong>Encryption</strong>: protects IP and confidentiality in transit (TLS) and at rest (encrypted payloads).</li><li><strong>Secure boot</strong>: on every boot, each stage verifies the next — so even if malicious code were written to flash, it would not run.</li></ul>`,
`<p>Key management (rotation, revocation, compromise handling) is the hardest operational part; keys must outlive vehicles (15+ years) ${B.an}.</p>`,
`<p>OTA security is end-to-end: compromise anywhere (build server, signing, CDN, TCU, bootloader) must not result in unauthorised code execution.</p>`)},
{h:'A/B partitioning, rollback and recovery',l:L(`<p>The car keeps two copies of its software: the one it’s using (A) and a spare slot (B). The update is written into B while you drive. Next time it’s safe, the car switches to B. If B doesn’t work, it switches back to A — like keeping your old phone until the new one is set up.</p>`,
`<ul><li><strong>A/B (dual bank)</strong>: install to inactive slot in background; switch on activation; old slot retained for rollback. Costs ~2× storage.</li><li><strong>Single bank + recovery</strong>: cheaper; vehicle unavailable during install; needs robust recovery bootloader.</li><li><strong>Rollback triggers</strong>: boot failure counters, health checks failing (PHM), missing heartbeats; boot loader falls back automatically.</li><li><strong>Anti-rollback</strong>: security counters prevent downgrade to vulnerable versions — must be reconciled with functional rollback.</li></ul>`,
`<p>Many modern ECUs support dual-bank flash for this reason; HPC OS images commonly use A/B partitions ${B.pat}.</p>`,
`<p>Rollback must be coordinated across ECUs — if ECU 3 of 7 fails, ECUs 1–2 may need to roll back too to maintain compatibility.</p>`)},
{h:'Orchestration, dependencies, vehicle state and failure handling',l:L(`<p>Updating many car computers is like a band changing songs mid-concert: everyone must switch together, only when the car is parked safely, with enough battery, and with a plan if someone misses the cue.</p>`,
`<ul><li><strong>Update orchestration</strong>: an on-board update master (e.g., AUTOSAR UCM Master or proprietary agent in CVC) sequences transfers to ECUs (via DoIP/UDS or local package managers), manages dependencies and atomic activation.</li><li><strong>Dependencies</strong>: compatibility matrix between ECU software versions; interface version checks; ordering (e.g., update gateway before others).</li><li><strong>Vehicle state requirements</strong>: parked, ignition off/“update mode”, sufficient 12 V/HV battery, not charging (or charging allowed), doors/locks state, user consent, no active diagnostic session.</li><li><strong>Update safety</strong>: vehicle immobilised during activation if necessary; user informed of duration; safety-relevant ECUs updated with additional checks.</li><li><strong>Failure handling</strong>: retry, resume interrupted downloads, rollback, report to backend, fallback to workshop recovery.</li></ul>`,
`<p>Most OTA incidents come from edge cases: unexpected vehicle configurations, low batteries, interrupted activation, or interactions with variants never tested ${B.an}. Hence staged rollouts.</p>`,
`<p>Orchestration quality depends on how consolidated the architecture is: updating 7 capable nodes is far easier than 100 heterogeneous ECUs.</p>`)},
{h:'Campaigns, scheduling and fleet-wide deployment',l:L(`<p>Carmakers don’t send updates to everyone at once. They start with their own employees’ cars, then a small group of customers, then more — watching for problems at each step.</p>`,
`<ul><li><strong>Campaign</strong>: target selection (VIN lists, configuration filters), package, preconditions, schedule, phases, success criteria.</li><li><strong>Phased rollout</strong>: internal fleet → beta/early adopters → 1% → 10% → 50% → 100%; automated halt on KPI regression.</li><li><strong>Scheduling</strong>: user-chosen times, off-peak network windows, CDN capacity.</li><li><strong>Reporting</strong>: per-vehicle status (downloaded, installed, activated, failed), software inventory update, regulatory records (RXSWIN).</li></ul>`,
`<p>Regulatory angle: some updates (e.g., changing safety behaviour) may require authority notification or re-approval; recalls can be fulfilled by OTA where accepted ${B.est}.</p>`,
`<p>Campaign data closes the loop to analytics (Module 17): did the update achieve its purpose?</p>`)},
{h:'Worked example: improved BMS software to 100,000 vehicles',b:`<p>Scenario: NOVA’s battery team improves the fast-charging algorithm and cell-balancing strategy, reducing 10–80% charge time and improving cold-weather behaviour. Target: 100,000 NOVA vehicles across three markets. The change touches the BMS MCU firmware (AUTOSAR Classic), a calibration table, and the charging-planner app in the CVC. ${B.an}</p>`+tbl(['Phase','What happens','Key controls'],[
['1. Develop','Algorithm developed in Simulink, auto-coded, integrated as SWC; charging-planner app updated','Requirements traceability; ASIL C/D impact analysis for protection functions; MISRA; code review'],
['2. Verify','MIL/SIL with cell models; HIL with battery emulator; fault injection; regression suite; cybersecurity checks','Coverage targets; safety case update; no change to protection thresholds without safety sign-off'],
['3. Validate','Climate chambers, cold-soak fast charging on prototypes; charger interoperability tests across charger brands','Acceptance criteria: charge time −x%, no thermal events, no derating regressions'],
['4. Release','Release candidate frozen; SBOM generated; compatibility matrix (BMS v4.2 requires CVC charging-planner ≥3.1)','Change-control board; R156 impact assessment; RXSWIN update if type-approval relevant'],
['5. Package & sign','Delta for BMS image; container for app; manifest with dependencies and preconditions; signed in backend HSM (Uptane-style roles)','Separate signing environment; two-person rule'],
['6. Campaign setup','Targets: 100,000 VINs filtered by hardware revision and current software; exclusions: vehicles with open battery DTCs','Phases: 500 employee cars → 2,000 → 10,000 → all; automatic halt rules'],
['7. Download','Over cellular/Wi-Fi in background via TCU; resumable; stored in CVC staging partition','Integrity verified on receipt; encrypted at rest'],
['8. Install','Orchestrator (CVC) verifies signatures; installs app to inactive slot; streams BMS delta to BMS MCU inactive bank via DoIP/UDS','No impact on driving; flash wear considered'],
['9. Activate','Preconditions: parked, not charging, HV battery ≥30%, 12 V healthy, customer consent; contactors open; ~10 min activation; atomic switch of BMS bank + app slot','Vehicle immobilised during activation; user notified'],
['10. Verify on-board','Post-activation self-tests: BMS boots, cell measurements plausible, contactor tests, app handshake; PHM health checks','Automatic rollback of both components if any check fails'],
['11. Report','Status and new software inventory sent; telemetry monitors charge sessions, thermal behaviour, DTC rates','Dashboards compare cohorts vs control group'],
['12. Expand / halt','KPIs good → next phase; anomaly (e.g., derating spike on a charger type) → halt, investigate, fix, re-release','Regulatory records maintained; customer communication'],
])+fail(`<p>Suppose in phase 2 a small cohort shows charging aborts on one charger brand. The automatic halt rule pauses the campaign; telemetry links aborts to a timing difference in charge-protocol handshakes; a fix is released as v4.2.1 and the affected vehicles receive it first. Vehicles never reached an unsafe state because protection thresholds were unchanged and the on-board verification passed — the issue was availability, not safety.</p>`)}
],
