/* ============ MODULE 02 ============ */
MOD({n:2,id:'m02',t:'What Exactly Is a Software-Defined Vehicle?',s:'Definitions, what really changes, and why SDV is not just a big screen',mins:40,
intro:`<p>“Software-defined vehicle” is one of the most used — and abused — terms in the industry. This module gives you a precise definition, separates SDV from merely “connected” cars, and explains what changes in engineering and in the business model.</p>`,
sec:[
{h:'A working definition',l:L(
`<p>A smartphone is “software-defined”: the same hardware becomes a camera, a map, a game console or a bank depending on the apps, and it gets better with updates. A <strong>software-defined vehicle</strong> applies this idea to a car: <em>most of what the car does and how it behaves is decided by software that can be changed, improved and extended over the car’s life — without changing the hardware.</em></p>`,
`<p>A rigorous definition has four parts. An SDV is a vehicle whose <strong>(1)</strong> functions and features are primarily realised in software, running on <strong>(2)</strong> a consolidated, capable compute platform with hardware abstraction, so that software is <strong>(3)</strong> decoupled from specific hardware and suppliers, and can be <strong>(4)</strong> continuously developed, deployed (OTA), and operated across the fleet throughout the vehicle lifecycle.</p><p>Technical enablers: centralised/zonal E/E architecture (Mod 03, 10), high-performance SoCs (04), OS + hypervisor (06), middleware and SOA (08, 09), OTA (13), cloud backend (12), security and safety by design (14, 15), and DevOps tooling (18).</p>`,
`<p>There is no single legal or ISO definition of “SDV” ${B.est}. OEMs and consultancies use their own definitions and maturity models. Some emphasise customer outcomes (features on demand), others engineering outcomes (hardware/software decoupling). Expect vendors to stretch the label: a car with an app store but un-updatable chassis software is not deeply software-defined.</p>`,
`<p>SDV is best understood not as a feature but as an <strong>operating model</strong>: architecture + organisation + processes + business model, all aligned so that software can be the main lever for value across the vehicle’s life.</p>`)},
{h:'Hardware-defined vs software-defined functionality',l:L(
`<p>In a hardware-defined car, if you want heated seats you must buy the version with the heated-seat box. In a software-defined car, every car might have the heating elements, and software decides whether they’re switched on — or the car might gain a smarter heating mode next year by an update.</p>`,
`${tbl(['Aspect','Hardware-defined','Software-defined'],[
['Where behaviour lives','Firmware in function-specific ECUs, frozen at SOP','Applications on shared compute, updatable'],
['Adding a feature','New ECU/part, new wiring, new program','New software release on existing hardware'],
['Variants','Different parts per trim','Same hardware, different software configuration / entitlements'],
['Integration','Signal-level, per program','Service APIs on a platform'],
['Updates','Dealer reflash (if at all)','OTA across ECUs, fleet-wide'],
['Ownership','Supplier black boxes','OEM-owned platform + software']])}`,
`<p>Real vehicles are hybrids ${B.an}: braking, airbag and steering control loops will remain deeply embedded, certified and rarely updated; comfort, cockpit, energy and assistance features are increasingly software-defined. The question is never “is it SDV?” but “<em>which functions</em> are software-defined, and how fast can they change?”</p>`,
`<p>Decoupling is the hinge concept. If software is tied to a specific chip and supplier box, every hardware change forces a software rewrite, and every software change requires the supplier. Abstraction layers (HAL, AUTOSAR, middleware) break that dependency.</p>`)},
{h:'Traditional vs connected vs software-defined',b:tbl(['Dimension','Traditional vehicle','Connected vehicle','Software-defined vehicle'],[
['Connectivity','None (maybe Bluetooth audio)','Telematics: remote lock, location, app','Always-connected, integral to lifecycle'],
['Updates','Dealer only','Infotainment/maps OTA','Full-vehicle OTA incl. powertrain/ADAS (where allowed)'],
['E/E architecture','Distributed ECUs','Distributed + TCU + gateway','Domain/zonal + central compute'],
['Software ownership','Suppliers','Mostly suppliers; OEM apps','OEM-led platform; suppliers contribute components'],
['Features after sale','Fixed','Some digital services','New/improved features, on-demand activation'],
['Data use','Workshop diagnostics','Telemetry for services','Closed-loop fleet learning, digital twins'],
['Business model','One-time sale','Sale + connectivity subscriptions','Sale + software, services, data across lifecycle'],
])+key(`<p><strong>Connected ≠ software-defined.</strong> A connected car can report its location and unlock from an app while still being a hardware-defined distributed-ECU car. Connectivity is necessary for SDV but nowhere near sufficient.</p>`)},
{h:'The SDV maturity ladder (interactive)',b:`<p>This ladder is a <strong>teaching model</strong> ${B.an} — there is no single industry-standard SDV maturity scale; firms publish their own. Tap each rung.</p>${W('ladder')}`},
{h:'Why software became the differentiator',l:L(
`<p>Customers increasingly judge cars like phones: Is the screen fast? Does voice control work? Does the car get better over time? Meanwhile engines and batteries are becoming similar between brands. So software — the experience — is where brands now try to stand out.</p>`,
`<p>Engineering drivers: (1) cross-domain features (e.g., predictive thermal management using navigation) are impossible when domains are isolated boxes; (2) ADAS/AI needs centralised high-performance compute and data loops; (3) cybersecurity regulation (UN R155/R156) requires managed, updatable software; (4) cost: fewer ECUs and less wiring.</p>`,
`<p>Commercial drivers: recurring revenue potential, lower warranty/recall costs via OTA fixes, higher residual values, and data-driven services. Competitive pressure from Tesla and Chinese OEMs (fast development cycles, deep vertical integration) accelerated legacy OEMs’ programs ${B.an}. Counter-pressure: many SDV programs ran late and over budget (Module 22, case studies).</p>`,
`<p>Differentiation decides <em>build vs buy</em>: OEMs tend to own what customers notice (HMI, driving character, energy efficiency, assistance behaviour) and buy commodity layers (OS kernels, communication stacks, cloud infrastructure) — Module 21.</p>`)},
{h:'From features to capabilities: activation, personalisation, continuous improvement',l:L(
`<p>Instead of a car arriving with a fixed list of features, it arrives with <em>capabilities</em> — hardware that can do more than it’s currently asked to — and software unlocks, tunes and improves them. Your driver profile (seat, mirrors, music, drive mode) can follow you to any car of that brand.</p>`,
`<ul><li><strong>Feature activation/deactivation</strong>: an entitlement service in the cloud issues signed licences; the vehicle’s feature-management component checks them and enables code paths (feature flags). Activation must be robust offline and secure against tampering.</li><li><strong>Personalisation</strong>: profiles stored in the cloud and synchronised; identity via phone key, face/voice recognition.</li><li><strong>Continuous improvement</strong>: telemetry identifies issues; software is improved, validated and redeployed via OTA in staged rollouts.</li><li><strong>Lifecycle extension</strong>: new features keep older vehicles current — limited by hardware headroom; eventually hardware upgrades (e.g., compute retrofits) may be needed.</li></ul>`,
`<p>Activation is commercially sensitive: customers react badly to paying for hardware already in the car ${B.an} (Module 21 discusses heated-seat subscription backlash). Regulators also constrain which safety-relevant functions may be changed post-sale (UN R156 requires managing updates that affect type approval).</p>`,
`<p>Capabilities require <strong>hardware provisioning decisions years earlier</strong> — compute headroom, sensor sets, actuator capability. Platform architects must forecast software you have not written yet.</p>`)},
{h:'Decoupling, abstraction and portability',l:L(
`<p>Imagine writing an app that works on any brand of phone. That is possible because the phone’s operating system hides the hardware differences. SDV engineers want the same: write the “climate comfort” app once and run it on any NOVA trim, or even next-generation hardware.</p>`,
`${stack([['Applications|climate comfort, energy optimiser, ADAS features|c'],['Vehicle APIs / services|standardised interfaces (e.g., VSS-style signals, SOA services)|b'],['Middleware|SOME/IP, DDS, IPC, data management|v'],['Operating systems & hypervisor|Linux, QNX, AUTOSAR OS, AAOS|g'],['Hardware abstraction|HAL, drivers, MCAL|a'],['Hardware|SoCs, MCUs, sensors, actuators|n']],'Each layer hides the one below it — this is what makes software portable.')}<p><strong>Portability</strong> means an application can move between ECUs or hardware generations with recompilation or reconfiguration rather than redesign. Achieved via standardised interfaces, middleware, containerisation (on HPCs) and configuration-driven deployment.</p>`,
`<p>Abstraction is not free: it costs CPU, memory and latency, and some timing-critical functions cannot be abstracted away. Industry efforts to standardise vehicle APIs include COVESA’s Vehicle Signal Specification (VSS), AUTOSAR’s interfaces, Eclipse SDV projects, and SOAFEE (Arm-led cloud-native edge architecture) ${B.em}.</p>`,
`<p>Decoupling also decouples <em>organisations</em>: hardware teams and software teams can run on different cadences — but only if interface contracts are stable and governed.</p>`)},
{h:'What SDV is not — and what actually changes',b:mis('A car with an internet connection is an SDV.','Connectivity enables remote services, but if functions are fixed in supplier ECUs and cannot be updated meaningfully, it is merely a connected car.')+mis('A car with a huge touchscreen is an SDV.','A screen is an output device. Many “big screen” cars run fixed, supplier-owned software. SDV is about architecture, update capability and ownership — invisible to the eye.'),l:L(
`<p>The biggest changes are invisible: fewer but more powerful computers, a lot more software engineers, and the car keeps changing after you buy it.</p>`,
`<p><strong>Engineering changes:</strong> fewer, more powerful compute nodes; Ethernet backbones; layered software platforms; service interfaces; OTA for all relevant ECUs; continuous integration and virtual testing; cybersecurity management systems; fleet data loops.</p>`,
`<p><strong>Business and organisational changes:</strong> OEM software organisations of thousands of engineers; new supplier contracts (software licences, white-box hardware); lifecycle revenue models; customer relationships that continue after the sale; new KPIs (release frequency, defect escape rate, feature adoption).</p>`,
`<p>The SDV is a <strong>system of systems</strong> spanning silicon to cloud to customer. Changing one layer without the others (e.g., buying a big SoC but keeping waterfall processes) usually fails — a recurring theme in Module 22.</p>`)}
],
terms:[['SDV','Software-Defined Vehicle — functions primarily realised in updatable software on decoupled hardware, evolving over its lifecycle.'],['Connected vehicle','Vehicle with external connectivity for services; not necessarily software-defined.'],['Feature on demand (FoD)','Activating software features after sale, often for a fee.'],['Entitlement','Authorisation record that a vehicle may use a feature.'],['Hardware abstraction','Hiding hardware specifics behind standard interfaces.'],['Headroom','Spare compute/memory reserved for future software.'],['Portability','Ability to run software on different hardware with minimal change.'],['VSS','COVESA Vehicle Signal Specification — a taxonomy of vehicle data signals.']],
mis:[['SDV means the car’s safety systems are updated constantly.','Safety-critical control software changes rarely and under strict regulation; most frequent updates target cockpit, comfort, energy and assistance features.']],
links:[[3,'The E/E architecture changes that make SDV possible.'],[13,'OTA — the delivery mechanism for continuous improvement.'],[21,'Business models built on software-defined capabilities.'],[22,'Why SDV promises often exceed reality.']],
take:['An SDV is defined by updatable software on decoupled, consolidated hardware across the vehicle lifecycle — not by screens or connectivity alone.','Connected vehicles are a prerequisite step, not the destination.','Decoupling through abstraction layers enables portability and independent hardware/software cadences.','Capabilities must be provisioned in hardware years before the software that uses them exists.','SDV is an operating model: architecture, organisation, process and business must change together.'],
quiz:[
['Which statement best distinguishes an SDV from a connected vehicle?',['SDVs have larger screens','SDVs have cellular modems','In an SDV, core functions are realised in updatable software decoupled from hardware; connectivity alone does not provide this','Connected vehicles cannot use apps'],2,'Connectivity is necessary but not sufficient. The defining trait is software-realised, decoupled, updatable functionality.'],
['What enables software portability across hardware generations?',['Hard-coding register addresses','Abstraction layers and standardised interfaces (HAL, OS, middleware, vehicle APIs)','Using more ECUs','Freezing software at SOP'],1,'Abstraction hides hardware specifics so applications can move with minimal change.'],
['Why must hardware headroom be decided early?',['It reduces wiring','Future software features can only run if compute, memory and sensor capability were provisioned at design time','It is required by ISO 26262','It reduces OTA size'],1,'Features delivered years later depend on capabilities built in at SOP.'],
['Which function is LEAST likely to be updated frequently in an SDV?',['Infotainment UI','Energy-efficiency algorithms','Airbag deployment control','Voice assistant'],2,'Safety-critical, certified control software changes rarely and under strict process.'],
['A car has a 15-inch screen and remote unlock via app, but all ECUs are supplier black boxes updatable only at a dealer. It is best described as:',['A mature SDV','A connected vehicle with limited software-defined capability','An autonomous vehicle','A zonal vehicle'],1,'Screen + connectivity without decoupled, updatable software is a connected car.','Scenario'],
['Is there a single ISO-standard definition of “SDV”?',['Yes, ISO 26262','Yes, UN R156','No — definitions and maturity models vary across OEMs and consultancies','Yes, SAE J3016'],2,'SAE J3016 defines automation levels, not SDV. SDV definitions are company-specific.']
]});

WIDGETS.ladder=function(el){
  const R=[['0','Hardware-defined','Fixed function ECUs, no connectivity. Updates only by dealer reflash.','Classic 2000s vehicles','#64748b'],
  ['1','Connected','TCU + app services (remote lock, location), telematics data. Infotainment maps may update.','Many 2015–2020 vehicles','#2563eb'],
  ['2','Updatable','OTA for infotainment and selected ECUs; software still mostly supplier-owned and signal-based.','Many current mainstream models','#0891b2'],
  ['3','Consolidated','Domain or cross-domain controllers, Ethernet backbone, OEM-owned platform software, OTA across most ECUs.','Many 2022+ EV platforms','#7c3aed'],
  ['4','Software-defined','Central compute + zonal I/O, SOA, hardware abstraction, frequent full-vehicle releases, feature activation, fleet data loops.','Leading-edge production platforms (see case studies)','#059669'],
  ['5','Continuously evolving platform','Software platform reused across brands/generations, third-party developer ecosystem, AI-driven features and digital-twin-based validation, hardware upgrade paths.','Partly emerging / partly aspirational','#d97706']];
  el.innerHTML=`<div class="grid g2"><div class="ladder">${R.map((r,i)=>`<div class="rung" data-i="${i}"><span class="lv" style="background:${r[4]}22;color:${r[4]};border:1px solid ${r[4]}66">L${r[0]}</span><span><b>${r[1]}</b></span></div>`).join('')}</div><div class="panel" id="ldP" style="margin-top:0"><p class="muted small">Tap a level (L0 at the bottom).</p></div></div>`;
  el.querySelectorAll('.rung').forEach(r=>r.onclick=()=>{el.querySelectorAll('.rung').forEach(x=>x.classList.remove('sel'));r.classList.add('sel');const d=R[r.dataset.i];el.querySelector('#ldP').innerHTML=`<h3>L${d[0]} · ${d[1]}</h3><p>${d[2]}</p><p class="small muted"><b>Typical:</b> ${d[3]}</p><p class="tiny">Levels describe capability, not quality; a vehicle can be at different levels for different domains.</p>`;});
};

/* ============ MODULE 03 ============ */
MOD({n:3,id:'m03',t:'Evolution of Vehicle E/E Architecture',s:'Distributed → domain → centralised → zonal → hybrid → what comes next',mins:60,
intro:`<p>E/E (Electrical/Electronic) architecture is the blueprint of how a vehicle’s computers, networks, power distribution and wiring are organised. It is the most important structural decision in an SDV, because it determines where software runs, how data flows, how much wiring is needed and how the car can be updated. Use the explorer below to switch between architecture types as you read.</p>`,
sec:[
{h:'Architecture evolution explorer (interactive)',b:W('archExplorer')},
{h:'Distributed ECU architecture',l:L(
`<p>One box per feature, scattered around the car, each wired directly to its sensors and motors, gossiping over shared buses. It’s like a company where every employee has their own phone line and no manager — it works when small, but becomes chaos at a hundred people.</p>`,
`<p><strong>Physical layout:</strong> 30–150 ECUs placed near their functions, several CAN/LIN buses grouped loosely by function, a central gateway joining buses. <strong>Software:</strong> each ECU has its own firmware (often AUTOSAR Classic), communicating via signals in CAN frames defined in a DBC/ARXML communication matrix. <strong>Communication:</strong> CAN (≤1 Mbit/s classical), LIN, later CAN FD, FlexRay, MOST.</p><p><strong>Advantages:</strong> fault isolation, mature tooling, cheap MCUs, supplier parallelism. <strong>Disadvantages:</strong> wiring weight and cost, poor scalability, cross-function features require coordinating many suppliers, OTA very hard, bandwidth limits, chip diversity.</p>`,
`<p>Still the dominant installed base worldwide ${B.est}. Cost implication: low per-ECU cost but high total system cost (harness, integration, validation). Engineering challenge: the communication matrix — thousands of signals — must be consistent across all ECUs and versions.</p>`,
`<p>Distributed architecture encodes the <em>organisation chart</em> into the car (Conway’s law): each supplier’s box mirrors each sourcing package. SDV must break both.</p>`)},
{h:'Domain-based architecture',l:L(
`<p>Group the boxes into departments with a manager each: a “powertrain manager”, a “chassis manager”, a “body manager”, an “infotainment manager” and an “ADAS manager”. Each manager is a more powerful computer called a <strong>domain controller</strong>.</p>`,
`<p><strong>Physical layout:</strong> 4–6 domain controllers (powertrain, chassis, body/comfort, infotainment/cockpit, ADAS), each connected to its own sub-network of smaller ECUs. Domain controllers are connected by an Ethernet backbone or high-speed CAN FD via a central gateway. <strong>Software:</strong> domain controllers often use multicore MCUs or MPUs; cockpit and ADAS domains use SoCs with Linux/QNX/Android; others run AUTOSAR Classic; AUTOSAR Adaptive appears.</p><p><strong>Why it emerged (~2015+):</strong> ADAS and cockpit needed far more compute; consolidating functions per domain reduced ECU count and enabled domain-level OTA.</p><p><strong>Advantages:</strong> functional consolidation, clear organisational mapping, more compute where needed. <strong>Disadvantages:</strong> wiring still follows functions (a body domain controller must reach doors at all four corners), cross-domain features still cross boundaries, domains duplicate resources.</p>`,
`<p>Many 2018–2024 platforms are domain-based or domain-hybrid ${B.est}. Example: Rivian’s Gen 1 R1 is described by the company as a domain-based architecture with 17 ECUs ${B.co}. Cost: domain controllers are expensive but replace several ECUs; harness savings are modest.</p>`,
`<p>Domain architecture is a stepping stone: it consolidates software but leaves the physical topology and wiring essentially functional.</p>`)},
{h:'Centralised (cross-domain) computing',l:L(
`<p>Instead of five managers, hire one very powerful CEO — a central computer — that runs most of the important software, while simpler helpers around the car carry out its orders.</p>`,
`<p><strong>Physical layout:</strong> one or a few <strong>central vehicle computers / HPCs</strong> host applications from multiple domains (cockpit + ADAS + vehicle functions), often on one board with several SoCs and a safety MCU. <strong>Software:</strong> hypervisor partitions run mixed-criticality workloads (e.g., Android Automotive for IVI, QNX for cluster, Linux/AUTOSAR Adaptive for ADAS) — Module 06. <strong>Communication:</strong> PCIe/Ethernet between SoCs on the board; Ethernet to the rest of the vehicle; SOME/IP, DDS.</p><p><strong>Advantages:</strong> cross-domain features, single update target, AI compute pooling, software reuse. <strong>Disadvantages:</strong> single point of failure (needs redundancy), thermal load (liquid cooling), complex integration, high-stakes chip choice.</p>`,
`<p>Examples: Tesla’s Model 3 (2017) pioneered a highly centralised design with large body controllers ${B.co}; GM announced a centralised computing platform built on NVIDIA DRIVE Thor debuting on the Cadillac Escalade IQ in 2028 ${B.co}. Industry terminology varies: “central compute”, “vehicle computer”, “HPC”, “VCU”, “superbrain” (BMW) and “core computer” (Volvo) refer to related concepts.</p>${src([['GM next-gen computing (Automotive World)','https://www.automotiveworld.com/news-releases/gm-announces-next-generation-vehicle-computing-system/']])}`,
`<p>Centralised compute is a <em>logical</em> concentration of intelligence. Without changing the physical I/O (wiring to sensors/actuators), it can’t realise the harness benefits — hence it pairs naturally with zonal I/O.</p>`)},
{h:'Zonal architecture',l:L(
`<p>Divide the car into neighbourhoods — front-left, front-right, rear-left, rear-right. Each neighbourhood has a local “post office” (zone controller) that collects messages and delivers power to everything nearby, and sends everything to headquarters (the central computer) over one fast highway.</p>`,
`<p><strong>Physical layout:</strong> 2–6 <strong>zone controllers</strong> organised by <em>location</em>, not function. Each aggregates local sensors/actuators (via direct I/O, LIN, CAN FD, 10BASE-T1S) and provides <strong>smart power distribution</strong> (e-fuses). Zones connect to central compute over a multi-gigabit Ethernet backbone (often redundant/ring). <strong>Software:</strong> zone controllers run real-time I/O, gateway and power software (AUTOSAR Classic typically); application logic moves to central compute.</p><p><strong>Advantages:</strong> shorter, simpler harness (weight, cost, automation-friendly manufacturing), scalability, fewer ECU types, cleaner OTA. <strong>Disadvantages:</strong> requires central compute maturity; latency of remote I/O must be bounded; safety and redundancy must be redesigned; migration from legacy is hard.</p>`,
`<p>Rivian reports its Gen 2 R1 moved to a zonal architecture, cutting from 17 to 7 ECUs and about 1.6 miles of wiring ${B.co}; the VW–Rivian joint venture (RV Tech) is developing a zonal architecture for both companies ${B.co}. Deep dive: Module 10.</p>${src([['InsideEVs on Rivian zonal','https://insideevs.com/news/761865/rivian-zonal-architecture-development/'],['VW Group press release on RV Tech','https://www.volkswagen-group.com/en/press-releases/joint-venture-between-volkswagen-group-and-rivian-19980']])}`,
`<p>Zonal decouples <strong>physical topology</strong> (where wires go) from <strong>logical architecture</strong> (where functions run). That separation is what makes hardware scalable and software movable.</p>`)},
{h:'Hybrid centralised-zonal — and what comes next',l:L(
`<p>Most real cars are in-between: some “managers” are kept (often for safety-critical braking or for a high-power ADAS computer), while neighbourhood post offices take over wiring. The future may bring cars where one powerful computer does almost everything and motors and lights become “smart” devices that just follow orders.</p>`,
`<p><strong>Hybrid:</strong> central compute (cockpit + vehicle functions) + separate ADAS HPC + zone controllers + some retained domain ECUs (e.g., brake and steering systems keep their own controllers for certification and fail-safe behaviour). This is the most common target architecture today ${B.pat}.</p><p><strong>Emerging architectures</strong> ${B.em}: (a) single-chip central compute merging cockpit + ADAS (e.g., Qualcomm Snapdragon Ride Flex, NVIDIA DRIVE Thor positioned for this); (b) chiplet-based scalable SoCs; (c) zone controllers with more local compute (“zonal compute”) to run latency-critical functions near I/O; (d) smart actuators with standardised interfaces; (e) 10BASE-T1S multidrop Ethernet reaching edge nodes, reducing CAN/LIN; (f) 48 V low-voltage networks (Tesla Cybertruck) ${B.co}.</p>`,
`<p>Trade-offs actively debated: one big SoC vs two (cost/thermal vs fault isolation); how much intelligence stays in zones; whether to keep CAN for legacy suppliers. GM states its zone “aggregators” execute no control logic, with all intelligence on the central platform ${B.co} — a clear architectural stance others may not share.</p>${src([['GM architecture details (Automotive World)','https://www.automotiveworld.com/news-releases/gm-announces-next-generation-vehicle-computing-system/']])}`,
`<p>There is no single “correct” architecture — the right answer depends on volume, legacy, supplier strategy, safety concept and cost targets. Module 22 and the capstone explore these choices.</p>`)},
{h:'ECU vs domain controller vs zone controller vs central computer vs HPC vs gateway',b:tbl(['Node','Organised by','Typical silicon','Main job','Example'],[
['ECU','Single function','MCU (e.g., Cortex-M/R, AURIX, RH850)','One control function (window, airbag)','Seat module'],
['Domain controller','Functional domain','Multicore MCU or SoC','Host functions of one domain + its sub-network','Body domain controller'],
['Zone controller','Physical location','Safety MCU (+ Ethernet switch, e-fuses)','I/O aggregation, power distribution, gateway for its zone','Front-left zone'],
['Central vehicle computer (CVC)','Whole vehicle','One or more SoCs + safety MCU','Cross-domain application hosting','NOVA CVC'],
['High-performance computer (HPC)','Compute-intensive workloads','SoC with GPU/NPU','Heavy computation (ADAS, cockpit); “HPC” is often used interchangeably with CVC','ADAS HPC'],
['Gateway','Network boundary','MCU/network processor (e.g., NXP S32G class)','Routing, protocol translation, firewalling, diagnostics routing','Central gateway'],
],'Terminology varies between OEMs and suppliers; these are typical meanings, not formal definitions.')},
{h:'Cost, scalability and why the shift is happening now',l:L(
`<p>Fewer, smarter computers and shorter wires are cheaper to build and easier to update — but designing them is harder and more expensive up front.</p>`,
`${tbl(['Factor','Distributed','Domain','Zonal + central'],[
['ECU count','High (30–150)','Medium','Low (≈5–15 major)'],
['Harness length/weight','Highest','High','Reduced'],
['Compute concentration','Low','Medium','High'],
['Cross-domain features','Very hard','Hard','Natural'],
['OTA complexity','Very high (many targets)','High','Lower (fewer, capable targets)'],
['Up-front engineering cost','Lower (reuse)','Medium','High (new platform)'],
['Scalability across models','Poor','Moderate','Good'],
])}`,
`<p>Why now: (1) SoCs with sufficient performance and safety features became available; (2) automotive Ethernet matured; (3) EV clean-sheet platforms removed legacy constraints; (4) software costs exploded under the distributed model; (5) regulation (R155/R156) demands managed software. Counterweight: migration risk is enormous — VW’s CARIAD and Volvo’s early EX90 software issues show how hard this is (case studies).</p>`,
`<p>Architecture choices lock in for a decade. Platform architects therefore design for <em>evolution</em>: Ethernet bandwidth headroom, replaceable compute modules, abstraction layers that survive SoC swaps.</p>`)}
],

/* ============ MODULE 04 ============ */
MOD({n:4,id:'m04',t:'Understanding Vehicle Hardware',s:'MCUs, SoCs, accelerators, memory, interfaces, power and automotive qualification',mins:55,
intro:`<p>Software runs on silicon. The capabilities, safety properties and cost of an SDV are bounded by its hardware: which processors, which memory, which interfaces, which power and thermal design. This module gives you the hardware literacy to read a vehicle-computer datasheet and understand why different functions need different platforms.</p>`,
sec:[
{h:'MCU vs MPU vs SoC',l:L(
`<p>A <strong>microcontroller (MCU)</strong> is a tiny all-in-one computer on a chip — processor, memory and input/output together — great at doing one job reliably and instantly, like a light switch with a brain. A <strong>microprocessor (MPU)</strong> is a stronger processor that needs external memory, like a laptop CPU. A <strong>System-on-Chip (SoC)</strong> packs many processors (CPU, graphics, AI, video, security) onto one chip — like a whole smartphone brain.</p>`,
`${tbl(['Property','MCU','MPU','SoC'],[
['Typical cores','Cortex-M, Cortex-R, TriCore, RH850; 1–6 cores, 100–400 MHz class','Cortex-A or x86; 1–8 cores, GHz class','Multiple Cortex-A clusters + GPU + NPU + DSP + ISP + safety island'],
['Memory','On-chip flash (KB–MB) and SRAM','External DRAM, external flash','External LPDDR (GBs), UFS/eMMC storage'],
['MMU / OS','MPU (memory protection unit), RTOS/AUTOSAR Classic','MMU, Linux/QNX','MMU + IOMMU, hypervisor, Linux/QNX/Android'],
['Real-time','Deterministic µs-level response','Soft real-time','Mixed; real-time via dedicated cores/safety island'],
['Safety','Lockstep cores, ASIL D capable','Usually ASIL B at most standalone','ASIL B–D claims for subsystems; often paired with a safety MCU'],
['Boot time','Milliseconds','Seconds','Seconds (optimised with early-boot partitions)'],
['Typical use','Brakes, airbags, zone controllers, BMS','Gateways, legacy IVI','Cockpit, ADAS, central compute'],
])}<p class="tiny">Ranges are indicative of current automotive parts, not hard limits.</p>`,
`<p>Representative families ${B.co}: MCUs — Infineon AURIX TC3xx/TC4x, NXP S32K/S32E/S32Z, Renesas RH850, TI Hercules/AM263x; network processors — NXP S32G; SoCs — NVIDIA DRIVE Orin/Thor, Qualcomm Snapdragon Cockpit/Ride/Ride Flex, Renesas R-Car, TI Jacinto TDA4, Mobileye EyeQ, plus in-house silicon (Tesla FSD computer). Choice drivers: performance per watt, safety certification, software ecosystem (toolchains, BSPs, AUTOSAR/OS support), longevity guarantees (10–15 years), cost and supply.</p>`,
`<p>An SDV almost always combines both worlds: SoCs for heavy, updatable workloads and MCUs for deterministic, safety-critical control. Zone controllers are MCU-based; the central computer is SoC-based with a safety MCU supervising it.</p>`),
x:nova(`<p>NOVA’s central vehicle computer (CVC) board holds two SoCs — an ADAS SoC with a large neural accelerator and a cockpit SoC — plus an ASIL D safety MCU that monitors both and can command a safe stop. Each of NOVA’s four zone controllers uses a lockstep multicore MCU with an integrated Ethernet switch and e-fuse drivers.</p>`)},
{h:'CPU, GPU, NPU, DSP, FPGA and hardware accelerators',l:L(
`<p>Different jobs suit different “workers”. The <strong>CPU</strong> is a clever generalist. The <strong>GPU</strong> is a crowd of simple workers doing the same thing to many pixels at once — great for graphics. The <strong>NPU</strong> is a specialist for AI maths. An <strong>FPGA</strong> is a chip you can rewire to become a custom circuit.</p>`,
`<ul><li><strong>CPU</strong>: control flow, OS, applications, middleware. Automotive SoCs use Arm Cortex-A (application) and Cortex-R (real-time) cores; Arm’s “AE” variants add safety features (e.g., split-lock).</li><li><strong>GPU</strong>: 3D HMI rendering for clusters/infotainment; general compute (CUDA on NVIDIA DRIVE).</li><li><strong>NPU / DLA</strong>: neural-network inference (convolutions, transformers) at high efficiency; performance often quoted in TOPS (tera-operations per second) — a peak figure that depends on precision (INT8 vs FP16) and is not directly comparable across vendors.</li><li><strong>DSP</strong>: signal processing for radar, audio, sensor pre-processing.</li><li><strong>ISP</strong>: camera image signal processing (demosaicing, HDR, noise reduction).</li><li><strong>FPGA</strong>: reconfigurable logic for sensor fusion pre-processing, prototyping, low-volume products; costly in high volume.</li><li><strong>Crypto accelerators / HSM</strong>: secure key storage and fast cryptography for secure boot, SecOC, TLS (Module 15).</li><li><strong>Video codecs, safety islands, and Ethernet/TSN engines</strong> complete the picture.</li></ul>`,
`<p>Marketing TOPS figures drive headlines, but production teams care about sustained performance under thermal limits, memory bandwidth (often the true bottleneck for AI), toolchain maturity and power ${B.an}. Volvo reports its EX90 core computer upgrade to NVIDIA DRIVE AGX Orin offers about 500 TOPS ${B.co}.</p>${src([['Volvo EX90 upgrade','https://www.volvocars.com/hk/news/articles/the-award-winning-ex90-just-levelled-up-with-faster-charging-and-new-advanced-features']])}`,
`<p>Accelerator choice constrains software: models must be compiled for a specific NPU; switching vendors means re-optimising the AI stack. Abstraction (ONNX, vendor-neutral runtimes) reduces but does not remove lock-in.</p>`)},
{h:'Memory architecture: RAM, ROM, Flash, EEPROM',l:L(
`<p><strong>RAM</strong> is the desk where work happens — fast but cleared when the power goes off. <strong>Flash</strong> is the filing cabinet that keeps programs and data without power. <strong>ROM</strong> is a printed book that can’t be changed. <strong>EEPROM</strong> is a small notebook where you can rewrite individual lines — handy for settings like your seat position.</p>`,
`${tbl(['Memory','Volatile?','Where','Automotive use'],[
['SRAM','Yes','On-chip in MCUs/SoCs','Fast working memory, caches; ECC-protected'],
['DRAM (LPDDR4/5)','Yes','External to SoCs','GBs for OS, apps, AI models; bandwidth critical for ADAS'],
['ROM (mask ROM)','No','On-chip','Immutable boot code — root of trust for secure boot'],
['NOR flash','No','On-chip (MCUs) / external','Execute-in-place code, bootloaders'],
['NAND / eMMC / UFS','No','External','OS images, maps, logs, A/B partitions for OTA'],
['EEPROM / data flash','No','On-chip or emulated','Calibration, DTCs, odometer, small persistent settings'],
])}<p>Safety features: ECC (error-correcting codes), memory protection units (MPU) or MMUs to isolate tasks, and wear-levelling for flash (relevant because frequent OTA and logging cause wear).</p>`,
`<p>Memory sizing is a headroom decision: OTA dual-bank (A/B) schemes roughly double storage needs; AI models and maps grow. Memory prices and availability were a constraint during shortages ${B.an}.</p>`,
`<p>Persistent storage layout (partitions, A/B banks, data separation) directly shapes OTA design (Module 13) and secure boot (Module 15).</p>`)},
{h:'In-vehicle interfaces: CAN, LIN, FlexRay, Ethernet, PCIe and more',l:L(
`<p>Chips need roads to talk. Some roads are country lanes (LIN — slow, cheap), some are town streets (CAN), and some are motorways (Ethernet). Inside a computer board, chips talk over even faster private roads like PCIe.</p>`,
`${tbl(['Interface','Speed (typical)','Topology','Used for'],[
['LIN','up to 20 kbit/s','Single-wire bus, one commander','Switches, small actuators, sensors'],
['CAN (classical)','up to 1 Mbit/s (often 500 kbit/s)','Multi-master bus, arbitration','Control messages, powertrain, body'],
['CAN FD','data phase typically 2–5 Mbit/s (higher possible), 64-byte payload','Bus','Higher-bandwidth control, secure messages'],
['CAN XL','up to ~20 Mbit/s, up to 2048-byte payload','Bus','Bridging CAN and Ethernet worlds (emerging)'],
['FlexRay','10 Mbit/s, dual channel','Bus/star, time-triggered','Historical: deterministic chassis control (first production 2006)'],
['Automotive Ethernet','10 Mbit/s (10BASE-T1S) to 10 Gbit/s+','Switched point-to-point (T1S: multidrop)','Backbone, cameras/radars, diagnostics, OTA'],
['PCIe','Gbit/s per lane','On-board point-to-point','SoC-to-SoC, SoC-to-NVMe, Wi-Fi modules'],
['SerDes (GMSL, FPD-Link, MIPI A-PHY)','Several Gbit/s','Point-to-point coax/STP','Cameras and displays'],
['SPI / I²C / UART','kbit/s–tens of Mbit/s','On-board','Peripheral chips, sensors, PMICs'],
])}<p>Detailed network behaviour (arbitration, TSN, QoS) is covered in Module 11.</p>`,
`<p>FlexRay’s historical role: it brought deterministic time-triggered communication for chassis systems (e.g., adaptive damping) but its cost and complexity meant it is largely being superseded by CAN FD and TSN Ethernet ${B.est}.</p>`,
`<p>Interface choice is an architectural decision: it determines where data can flow, at what latency, and what can be secured.</p>`)},
{h:'Sensor and actuator interfaces',l:L(`<p>Sensors speak in tiny voltages or digital pulses; actuators need strong, carefully controlled power. Special circuits translate between the delicate world of chips and the heavy world of motors.</p>`,
`<ul><li><strong>Sensor inputs</strong>: ADCs for analog signals; SENT and PSI5 digital sensor protocols; resolver interfaces for motor rotor position; isoSPI/daisy-chain for battery cell monitors; SerDes for cameras; Ethernet for radars/LiDARs.</li><li><strong>Actuator outputs</strong>: PWM for motor speed or LED brightness; H-bridges for bidirectional DC motors; gate drivers for inverter power transistors (SiC/IGBT); high-side smart switches with diagnostics (open-load, short-circuit).</li><li><strong>Smart actuators</strong>: integrate their own MCU and talk LIN/CAN — simplifying the central design.</li></ul>`,
`<p>Zonal architectures concentrate these interfaces into zone controllers, which must therefore support many I/O types — a design challenge balanced by standardising on smart sensors/actuators ${B.pat}.</p>`,
`<p>Every interface is also a diagnostic and safety boundary: detecting a broken wire or stuck actuator is part of the safety concept.</p>`)},
{h:'Power management, redundancy and thermal design',l:L(
`<p>Computers need clean, stable electricity — cars have messy power (engine cranking, load dumps). Important systems get two power supplies so one failure doesn’t stop them. And powerful computers get hot, so some are liquid-cooled like a gaming PC.</p>`,
`<ul><li><strong>Power supply chain</strong>: 12 V (or 48 V) battery → zone controllers with smart power distribution (e-fuses replacing melting fuses) → ECU regulators and <strong>PMICs</strong> (power-management ICs providing multiple rails, sequencing and monitoring) → SoC/MCU.</li><li><strong>Low-voltage architectures</strong>: 12 V is standard; 48 V reduces current (and copper) for the same power — Tesla’s Cybertruck uses a 48 V low-voltage architecture ${B.co}.</li><li><strong>Redundancy</strong>: dual power feeds, lockstep CPU cores (two cores run the same code and compare), redundant communication paths, redundant actuators (dual-winding EPS motors) — Module 14.</li><li><strong>Thermal</strong>: central computers can dissipate tens to hundreds of watts; designs use heat spreaders, fans or liquid cooling loops shared with the vehicle thermal system; software throttles under heat (thermal management impacts performance guarantees).</li></ul>`,
`<p>E-fuses enable software-controlled power (turning off unused loads to save energy, diagnosing shorts, resetting without service). Power and thermal limits often decide which SoC is feasible ${B.an}.</p>${src([['Cybertruck 48 V overview (Basenor)','https://www.basenor.com/blogs/news/cybertrucks-engineering-firsts-48v-steer-by-wire-explained']])}`,
`<p>Power is a system concern: sleep/wake management (network management), parked-car energy budgets for OTA (Module 13), and safe power-down sequences all cross hardware and software.</p>`)},
{h:'Automotive qualification: AEC-Q100, reliability and the semiconductor supply chain',l:L(
`<p>Car chips must survive -40 °C winters, scorching engine bays, vibration and 15+ years of use. So they are tested much harder than phone chips. And because cars need thousands of chips, a shortage of even one cheap chip can stop a factory.</p>`,
`<ul><li><strong>AEC-Q100</strong> (Automotive Electronics Council): stress-test qualification for integrated circuits; temperature grades from Grade 0 (−40 to +150 °C ambient) to Grade 3 (−40 to +85 °C), with Grade 1 (−40 to +125 °C) and Grade 2 (−40 to +105 °C) common. Related: AEC-Q101 (discretes), AEC-Q200 (passives). AEC-Q is <em>reliability</em> qualification, not functional safety.</li><li><strong>Functional safety of hardware</strong> (ISO 26262 Part 5): metrics such as single-point fault metric (SPFM), latent fault metric (LFM) and probabilistic metric for random hardware failures (PMHF) by ASIL.</li><li><strong>Quality</strong>: zero-defect targets (PPM), IATF 16949, PPAP, long-term supply (10–15 years).</li></ul>`,
`<p>The 2021–2022 chip shortage exposed fragility: many automotive MCUs are made on mature process nodes with few fabs, and OEMs had little visibility into Tier 2/3 supply ${B.est}. Responses: direct OEM–chipmaker agreements, consolidating chip variants (zonal helps), dual sourcing, and more in-house silicon at some OEMs. Advanced SoCs use leading-edge nodes from a few foundries, adding geopolitical risk ${B.an}.</p>`,
`<p>Silicon decisions ripple everywhere: they fix the OS/BSP options, the AI toolchain, safety concept and cost for a decade. That’s why chip selection is one of the first and most strategic SDV decisions (capstone decision 4).</p>`)},
{h:'Why different functions need different computing platforms',b:tbl(['Function','Key requirement','Best-fit platform'],[
['Airbag deployment','Deterministic µs–ms response, ASIL D, instant boot','Safety MCU, RTOS'],
['Brake/stability control','Hard real-time, ASIL D, fail-safe/fail-operational','Lockstep MCU in dedicated brake ECU'],
['Zone I/O & power','Many interfaces, real-time, low power, ASIL B–D','Multicore MCU with Ethernet switch, e-fuse drivers'],
['Battery management','Cell monitoring precision, ASIL C/D for protection','MCU + cell-monitor ICs; analytics in central compute/cloud'],
['Digital cockpit','Graphics, rich OS, apps, fast UI','Cockpit SoC with GPU, hypervisor (Android + RTOS)'],
['ADAS perception','TOPS, memory bandwidth, ASIL B–D','ADAS SoC with NPU/GPU + safety MCU'],
['Gateway / security','Routing, firewall, crypto','Network processor with HSM'],
])+key(`<p>The art of SDV hardware architecture is <strong>matching workload criticality and computational intensity to the right silicon</strong>, then connecting them with the right networks.</p>`)}
],
terms:[['MCU','Microcontroller — CPU, flash, RAM and peripherals on one chip.'],['MPU','Microprocessor — CPU needing external memory; also “Memory Protection Unit” in MCU context (ambiguous!).'],['SoC','System-on-Chip integrating CPU, GPU, NPU, ISP, etc.'],['NPU','Neural Processing Unit for AI inference.'],['TOPS','Tera operations per second — peak AI throughput metric.'],['Lockstep','Two cores executing identical code with comparison to detect faults.'],['PMIC','Power-management IC providing regulated rails and monitoring.'],['AEC-Q100','Automotive reliability qualification for ICs.'],['ECC','Error-correcting code for memory.'],['SerDes','Serializer/deserializer links for cameras and displays.']],
mis:[['More TOPS always means a better ADAS computer.','Peak TOPS ignores precision, memory bandwidth, utilisation and thermal limits. Real performance depends on the whole system and software stack.'],['AEC-Q100 qualification means a chip is functionally safe.','AEC-Q100 is reliability stress qualification. Functional safety is assessed separately under ISO 26262.']],
links:[[3,'Which nodes need which silicon.'],[5,'Software stack on top of this hardware.'],[6,'OS options depend on silicon.'],[14,'Hardware safety metrics and redundancy.'],[16,'AI compute for ADAS.']],
take:['MCUs deliver deterministic, safety-critical control; SoCs deliver high performance for rich and AI workloads.','Accelerators (GPU, NPU, ISP, DSP, HSM) specialise compute; their toolchains create lock-in.','Memory layout and size are headroom decisions that shape OTA and security.','Power, redundancy and thermal design constrain which silicon is feasible.','AEC-Q100 ≠ ISO 26262; supply-chain resilience is now a strategic architecture factor.'],
quiz:[
['Which device is best suited to airbag deployment control?',['High-end SoC running Android','Safety-qualified MCU with RTOS','Cloud server','FPGA running Linux'],1,'Airbags need deterministic, instant-boot, ASIL D control — classic safety MCU territory.'],
['What does “lockstep” provide?',['Faster graphics','Detection of random hardware faults by running two cores in parallel and comparing outputs','Encryption','Lower power'],1,'Lockstep is a hardware safety mechanism for fault detection.'],
['Why is a TOPS figure insufficient to compare ADAS chips?',['TOPS measures storage','It is a peak metric dependent on precision and ignores memory bandwidth, utilisation and thermal limits','TOPS is regulated','It only applies to CPUs'],1,'Real-world AI performance depends on many factors beyond peak TOPS.'],

MOD({n:5,id:'m05',t:'Vehicle Software Architecture',s:'The complete stack from silicon to application — and how it stays safe and real-time',mins:55,
intro:`<p>Software in a vehicle is not one program — it is a carefully layered stack where each layer hides complexity from the one above. Understanding this stack is the key to answering “what exactly happens inside an ECU?” and “how does middleware connect applications to hardware?”.</p>`,
sec:[
{h:'The layered software stack (interactive)',b:`<p>Tap a layer to see what it contains, what it does, and how it appears in Project NOVA’s zone controller (MCU) versus its central computer (SoC).</p>${W('swStack')}`},
{h:'Firmware, embedded, system, platform and application software',l:L(
`<p>Think of a restaurant. <strong>Firmware</strong> is the kitchen’s wiring and gas — low-level, rarely changed. <strong>System software</strong> (OS, drivers) is the kitchen staff that keeps things running. <strong>Platform software and middleware</strong> are the ordering system that lets waiters talk to cooks. <strong>Applications</strong> are the dishes the customer actually experiences.</p>`,
`${tbl(['Term','Meaning','Examples'],[
['Embedded software','Any software running on a dedicated device with resource and timing constraints','All ECU software'],
['Firmware','Low-level software tightly bound to specific hardware; often stored in flash/ROM','Bootloader, sensor firmware, modem firmware'],
['System software','Software managing hardware resources for other software','OS kernel, drivers, hypervisor'],
['Platform software','Reusable foundation shared by many applications across vehicles','OS + middleware + vehicle services + update/diagnostic frameworks (e.g., MB.OS, VW.OS, Arene are marketed platform names)'],
['Middleware','Software connecting applications to each other and to platform resources','SOME/IP stack, DDS, IPC frameworks, AUTOSAR RTE/ara::com'],
['Application software','Implements user- or vehicle-visible functions','Climate control logic, lane-keeping, media player'],
])}<p>The boundaries blur: “firmware” is sometimes used for all ECU software, and OEM “platform” names often include OS, middleware, cloud and tools.</p>`,
`<p>Industry practice separates the <strong>platform</strong> (owned by an OEM platform team, released on its own cadence, reused across models) from <strong>applications</strong> (owned by feature teams). Suppliers increasingly provide platform components (OS, communication stacks, hypervisors) under licence ${B.pat}.</p>`,
`<p>The stack defines <em>change boundaries</em>: a stable platform API lets apps change frequently without re-validating the whole stack.</p>`)},
{h:'Drivers, HAL, bootloaders and communication stacks',l:L(
`<p>A <strong>driver</strong> is a translator that knows exactly how to talk to one piece of hardware. A <strong>HAL</strong> (hardware abstraction layer) is a universal adapter so programs don’t care which brand of hardware is underneath. A <strong>bootloader</strong> is the first program that runs when the computer wakes up — it checks everything is OK and starts the main software (and helps install updates).</p>`,
`<ul><li><strong>Device drivers</strong>: read/write peripheral registers (CAN controller, ADC, PWM, Ethernet MAC). In AUTOSAR Classic these are the <strong>MCAL</strong> modules (Can, Adc, Pwm, Dio, Spi, Fls…).</li><li><strong>HAL / ECU abstraction</strong>: maps physical pins and devices to logical signals (“FrontLeftDoorSwitch”), independent of the MCU.</li><li><strong>Bootloaders</strong>: a primary bootloader (immutable, verifies the next stage — secure boot) and a flash/secondary bootloader that can receive new software via diagnostics (UDS services <code>0x34 RequestDownload</code>, <code>0x36 TransferData</code>, <code>0x37 RequestTransferExit</code>) or via OTA update clients.</li><li><strong>Communication stacks</strong>: layered protocol handling — e.g., CAN driver → CAN interface → PDU router → COM (signal packing) → application; or Ethernet driver → TCP/IP → SOME/IP → application.</li></ul>`,
`<p>Drivers and BSPs (board support packages) come from silicon vendors and OS vendors; their quality and longevity are major selection criteria. Communication stacks are typically licensed (e.g., Vector MICROSAR, Elektrobit EB tresos, ETAS RTA) ${B.co}.</p>`,
`<p>Bootloaders sit at the intersection of OTA (Module 13) and security (Module 15): whoever controls the bootloader controls what code the ECU will ever run.</p>`)},
{h:'Diagnostics: how vehicles report and repair themselves',l:L(
`<p>Cars keep a diary of problems. When something goes wrong, the ECU writes a code (a DTC) and sometimes turns on a warning light. Mechanics (and now the cloud) can read that diary and even reprogram the ECU.</p>`,
`<ul><li><strong>DTCs</strong> (Diagnostic Trouble Codes) with status bits and freeze-frame data (conditions when the fault occurred).</li><li><strong>UDS</strong> (Unified Diagnostic Services, ISO 14229): request/response services such as ReadDataByIdentifier (0x22), ReadDTCInformation (0x19), RoutineControl (0x31), SecurityAccess (0x27), and programming services.</li><li><strong>Transports</strong>: ISO-TP over CAN (ISO 15765-2) and <strong>DoIP</strong> (Diagnostics over IP, ISO 13400) over Ethernet — much faster for flashing.</li><li><strong>OBD</strong>: legally mandated emissions diagnostics with standard access.</li><li><strong>SOVD</strong> (Service-Oriented Vehicle Diagnostics, ASAM): a REST/HTTP-style API for diagnostics on HPCs and remote use ${B.em}.</li></ul>`,
`<p>Diagnostics is an ecosystem of tools (testers, ODX data descriptions) and workshop processes. In SDVs, remote diagnostics via the cloud reduce workshop visits and feed fleet analytics. Diagnostic access must be secured (SecurityAccess / authentication — Module 15).</p>`,
`<p>Diagnostics is cross-cutting: every layer contributes fault detection, and the master architecture treats it as a foundation (Layer 8).</p>`)},
{h:'Application lifecycle, partitioning, isolation and memory management',l:L(
`<p>On a shared computer, apps are like tenants in an apartment building. Each needs its own locked flat (isolation), the building manager decides who can start, stop or restart (lifecycle), and nobody may steal the water supply (resource limits).</p>`,
`<ul><li><strong>Application lifecycle management</strong>: defined states (not running → starting → running → terminating), dependencies, restart policies, health monitoring. On AUTOSAR Adaptive this is Execution Management + State Management + Platform Health Management.</li><li><strong>Software partitioning</strong>: dividing software into units with separate resources: OS processes, hypervisor VMs, AUTOSAR OS-Applications, containers.</li><li><strong>Process isolation</strong>: MMU-based virtual address spaces (SoCs) or MPU-based protection regions (MCUs) prevent one component corrupting another’s memory.</li><li><strong>Temporal isolation</strong>: CPU budgets, time partitions, scheduling priorities so one component cannot starve another.</li><li><strong>Memory management</strong>: static allocation preferred in safety-critical code (no heap fragmentation); dynamic allocation controlled on HPCs; IOMMU/SMMU restricts DMA by peripherals and GPUs.</li></ul>`,
`<p>Isolation is how consolidated platforms achieve <strong>freedom from interference</strong> (ISO 26262), allowing ASIL and QM software to share hardware. It is also how platforms contain security breaches.</p>`,
`<p>Partitioning decisions map directly onto organisational boundaries and update granularity — a VM or container is a natural unit of OTA update.</p>`)},
{h:'Real-time computing and deterministic execution',l:L(
`<p>“Real-time” doesn’t mean “fast” — it means “always on time”. An airbag that deploys in 20 ms every single time is real-time. A video that usually plays smoothly but sometimes stutters is not.</p>`,
`<ul><li><strong>Hard real-time</strong>: missing a deadline is a failure (brake control loop). <strong>Soft real-time</strong>: occasional misses degrade quality (HMI animation).</li><li><strong>Determinism</strong>: same inputs → same timing and outputs. Achieved by static scheduling, bounded interrupt latency, no unbounded loops or allocations.</li><li><strong>WCET</strong> (worst-case execution time) analysis bounds how long each task can take.</li><li><strong>Scheduling</strong>: fixed-priority preemptive (OSEK/AUTOSAR OS), time-triggered tables, and the <strong>Logical Execution Time (LET)</strong> paradigm that makes multicore timing predictable.</li><li><strong>End-to-end latency chains</strong>: sensor → network → compute → network → actuator must fit the control budget (e.g., tens of ms for ADAS reaction).</li></ul>`,
`<p>Multicore SoCs make timing harder (shared caches, memory contention). Production teams use timing analysis tools, core pinning, cache partitioning and dedicated real-time cores ${B.pat}.</p>`,
`<p>Real-time requirements determine where functions <em>can</em> run: a 1 ms motor current loop stays in the inverter MCU; a 100 ms energy-optimisation loop can run in central compute; a daily battery-health model can run in the cloud.</p>`)},
{h:'Safety-critical vs non-safety-critical software',l:L(
`<p>Some software can hurt people if it fails (brakes), some just annoys people (music). The first kind is developed with much stricter rules, more testing and more documentation.</p>`,
`${tbl(['Aspect','Safety-critical (ASIL A–D)','Non-safety (QM)'],[
['Process','ISO 26262 lifecycle, requirements traceability, reviews, coverage','Normal quality management (still ASPICE-assessed)'],
['Coding','Restricted subsets (e.g., MISRA C/C++, AUTOSAR C++14 guidelines), static analysis','General best practice'],
['Testing','Requirements-based, structural coverage (MC/DC for ASIL D)','Functional testing'],
['Runtime','Static allocation, watchdogs, safety mechanisms, certified OS','Rich OS, dynamic features'],
['Change','Rare, impact analysis, re-qualification','Frequent'],
])}`,
`<p>Most vehicle software lines are QM (infotainment), but safety-critical code dominates validation effort. Mixed-criticality integration (Module 06) is where these worlds meet.</p>`,
`<p>Architects place a strong “safety firewall” between rich, fast-changing software and certified control software — commonly a safety MCU or certified partition that validates commands from QM software.</p>`)},
{h:'Software update mechanisms (overview)',b:`<p>Updates can be delivered by workshop tool (UDS flashing via OBD port), by end-of-line programming at the factory, or over-the-air. Mechanisms include in-place flashing (MCU with bootloader), dual-bank A/B (switch after verification), and package-level updates (containers, apps). Module 13 covers OTA end-to-end.</p>`+nova(`<p>NOVA’s zone controllers use dual-bank flash MCUs: new software is written to the inactive bank while the car drives, then activated at next safe park. Its central computer uses A/B partitions for the hypervisor and each VM, plus container-level updates for apps.</p>`)}
],

mis:[['Real-time means very fast.','Real-time means predictable deadlines. A slow but guaranteed response can be real-time; a fast but occasionally late one is not.'],['Middleware and operating system are the same thing.','The OS manages hardware resources (CPU, memory, devices); middleware sits above it to connect applications across processes and ECUs.']],

WIDGETS.swStack=function(el){
  const Ls=[
   ['Applications','Vehicle- and user-visible functions.','Climate comfort logic, lane keeping, media, energy optimiser, BMS algorithms','Door, light and seat control logic (small SWCs)','Apps on Android Automotive (cockpit VM), ADAS apps on Linux/QNX with AUTOSAR Adaptive, vehicle-function apps','c'],
   ['Vehicle services / platform APIs','Stable APIs exposing vehicle capabilities as services.','Climate service, seat service, energy service, diagnostics service','Exposes local I/O as services or signals','Service catalogue, vehicle API (VSS-style) for apps','b'],
   ['Middleware','Communication and data distribution between software components.','SOME/IP, DDS, IPC, serialization, service discovery','AUTOSAR RTE + COM stack + SOME/IP-lite or signal gateway','ara::com, DDS for ADAS, IPC across VMs','v'],
   ['Operating system','Schedules tasks, manages memory and devices.','RTOS, Linux, QNX, Android','AUTOSAR Classic OS (OSEK-based)','QNX for cluster/safety VM, Linux for ADAS, Android Automotive OS for IVI','g'],
   ['Hypervisor (HPCs only)','Partitions SoC into isolated virtual machines.','Type-1 hypervisor','Not used','Type-1 hypervisor hosting 3 VMs','g'],
   ['Drivers / HAL / BSP','Access to hardware peripherals; abstraction.','MCAL, Linux drivers, BSP','MCAL + ECU abstraction + complex drivers','BSP from SoC vendor, VirtIO for shared devices','a'],
   ['Bootloader & secure boot','Starts the system, verifies integrity, enables updates.','ROM boot, primary/secondary bootloaders','Dual-bank flash bootloader with HSM verification','Secure boot chain → hypervisor → VMs; A/B slots','r'],
   ['Hardware','Physical compute and I/O.','MCU, SoC, memory, transceivers','Lockstep MCU, Ethernet switch, e-fuse drivers','2 SoCs + safety MCU, LPDDR5, UFS, PCIe','n']];
  const col={b:'rgba(59,130,246,.16)',c:'rgba(34,211,238,.14)',v:'rgba(167,139,250,.16)',g:'rgba(52,211,153,.13)',a:'rgba(251,191,36,.13)',r:'rgba(248,113,113,.13)',n:'var(--surf2)'};
  el.innerHTML=`<div class="dia"><div class="stk">${Ls.map((l,i)=>`<div class="row"><div class="lay click" data-i="${i}" style="background:${col[l[5]]}"><b>${l[0]}</b><span>${l[1]}</span></div></div>`).join('')}</div><div class="cap">Top = closest to the user; bottom = closest to silicon.</div></div><div class="panel" id="ssP"><p class="muted small">Tap a layer.</p></div>`;
  el.querySelectorAll('.lay.click').forEach(x=>x.onclick=()=>{el.querySelectorAll('.lay').forEach(y=>y.classList.remove('sel'));x.classList.add('sel');const l=Ls[x.dataset.i];
    el.querySelector('#ssP').innerHTML=`<h3>${l[0]}</h3><dl><dt>Role</dt><dd>${l[1]}</dd><dt>Contains</dt><dd>${l[2]}</dd><dt>NOVA zone controller (MCU)</dt><dd>${l[3]}</dd><dt>NOVA central computer (SoC)</dt><dd>${l[4]}</dd></dl>`;});
};

/* ============ MODULE 06 ============ */
MOD({n:6,id:'m06',t:'Automotive Operating Systems',s:'RTOS, Linux, QNX, Android Automotive, AUTOSAR OS, hypervisors and containers',mins:55,
intro:`<p>The operating system landscape in vehicles is plural by design: a single car can run several OSes simultaneously — a certified RTOS for safety, Linux for ADAS, Android Automotive for infotainment — often on the same chip under a hypervisor. This module explains each and how to choose.</p>`,
sec:[
{h:'What an operating system does',l:L(
`<p>An OS is the building manager of a computer. It decides which program gets to use the processor and when, gives each program its own memory, controls access to devices like screens and network, and stops programs from interfering with each other.</p>`,
`<p>Core OS services: <strong>scheduling</strong> (threads/tasks onto cores), <strong>memory management</strong> (virtual memory, protection), <strong>device management</strong> (drivers, interrupts), <strong>inter-process communication</strong>, <strong>file systems</strong>, <strong>networking</strong>, <strong>security</strong> (users, capabilities, access control) and <strong>time</strong> services. Kernel architectures: <strong>monolithic</strong> (Linux: drivers in kernel space), <strong>microkernel</strong> (QNX: minimal kernel, drivers as user-space processes), and <strong>static/statically configured</strong> RTOS (OSEK/AUTOSAR OS: everything defined at build time).</p>`,
`<p>OS choice is a decade-long commitment: it determines driver availability, safety-certification evidence, developer talent pool, licensing cost and ecosystem (apps, tools) ${B.an}.</p>`,
`<p>“Vehicle OS” in marketing (MB.OS, VW.OS, Arene, Pleos) usually means a whole <strong>platform</strong> (multiple kernels + middleware + cloud), not a kernel — see the terminology distinction at the end of this module.</p>`)},
{h:'RTOS vs general-purpose OS',b:tbl(['Aspect','RTOS (e.g., AUTOSAR OS, QNX, SAFERTOS, Zephyr, FreeRTOS)','General-purpose OS (Linux, Android)'],[
['Primary goal','Deterministic deadlines','Throughput, features, fairness'],
['Scheduling','Fixed-priority preemptive, bounded latency','Fair/complex schedulers (Linux has real-time classes; PREEMPT_RT merged in mainline 6.12)'],
['Footprint','KB to few MB','Hundreds of MB to GB'],
['Configuration','Often static (tasks defined at build)','Dynamic processes'],
['Safety certification','Available up to ASIL D for several RTOSes','Difficult; active work (e.g., ELISA project) but not typical for ASIL D'],
['Ecosystem','Narrow, specialised','Huge: drivers, libraries, developers'],
['Typical vehicle use','Control ECUs, zones, safety partitions, cluster','IVI, ADAS perception, connectivity'],
])+mis('An RTOS is just a faster OS.','An RTOS prioritises bounded, predictable latency. Linux can be faster on average throughput yet less predictable in worst case.')},
{h:'Linux in automotive',l:L(`<p>Linux is the free, open operating system that runs most of the internet’s servers and Android phones. Carmakers use it for big computers in the car because it supports almost every chip and has millions of developers.</p>`,
`<p><strong>Architecture</strong>: monolithic kernel + user space; distributions built with Yocto/OpenEmbedded. <strong>Real-time</strong>: PREEMPT_RT (mainline since kernel 6.12) improves latency but is not equivalent to a certified RTOS. <strong>Security</strong>: SELinux/AppArmor, namespaces, seccomp, dm-verity for verified root file systems. <strong>Automotive distributions/projects</strong>: Automotive Grade Linux (Linux Foundation), Red Hat In-Vehicle OS (with CentOS AutoSD upstream), Elektrobit EB corbos Linux, Wind River Linux; ELISA project researches using Linux in safety-related systems ${B.co}.</p><p><strong>Strengths</strong>: drivers, networking, AI frameworks, talent. <strong>Limitations</strong>: size, update churn, certification difficulty, boot time.</p>`,
`<p>Common pattern: Linux for ADAS compute and connectivity/gateway services, often running AUTOSAR Adaptive or other middleware; safety supervision delegated to a certified RTOS partition or MCU ${B.pat}.</p>`,
`<p>Linux brings cloud-native techniques (containers, CI/CD) into the vehicle — the bridge between automotive and IT practices (Module 12).</p>`)},
{h:'Android Automotive OS vs Android Auto',b:tbl(['','Android Auto','Android Automotive OS (AAOS)'],[
['What it is','Phone projection: apps run on the phone, displayed on car screen','Full OS running natively on the vehicle’s infotainment hardware'],
['Needs a phone?','Yes','No'],
['Vehicle data access','Very limited','Via Vehicle HAL (VHAL) properties: HVAC, speed, gear, etc. (permission-controlled)'],
['Who customises','Google defines UI','OEM customises UI, integrates vehicle functions'],
['Google services','Phone’s','Optional licensed Google Automotive Services (“Google built-in”); OEMs can ship AAOS without them'],
['Examples','Most brands support it','Used by several OEMs for IVI (e.g., Volvo/Polestar, GM, Renault) — check current models'],
])+key(`<p>Remember: <strong>Android Auto</strong> = your phone on the car’s screen. <strong>Android Automotive OS</strong> = Android <em>is</em> the car’s infotainment OS. Apple CarPlay is analogous to Android Auto.</p>`)+`<p>AAOS architecture: Linux kernel → HAL layer including <strong>VHAL</strong> (maps vehicle signals to Android properties) → Android framework with car services (CarService, Car API) → apps. Strengths: app ecosystem, UI frameworks, developer familiarity. Limitations: not for safety-critical functions; update cadence of Android must be managed; resource-heavy. In SDVs, AAOS usually runs in a VM beside a safety OS that renders the instrument cluster.</p>`},
{h:'AUTOSAR OS (Classic) and the Adaptive Platform’s OS layer',l:L(`<p>AUTOSAR Classic includes its own tiny, predictable OS designed for car control units. AUTOSAR Adaptive doesn’t include an OS — it runs on top of a standard POSIX OS such as Linux or QNX.</p>`,
`<p><strong>AUTOSAR Classic OS</strong>: based on OSEK/VDX; statically configured tasks (basic/extended), ISRs, events, resources (priority ceiling), alarms and schedule tables; scalability classes SC1–SC4 adding timing protection (SC2/SC4) and memory protection (SC3/SC4); multicore support with OS-Applications per core. <strong>Adaptive Platform</strong>: requires an OS supporting the POSIX PSE51 profile (single-process subset) for applications; Execution Management launches processes per manifests ${B.est}.</p>`,
`<p>Classic OS is used across tens of millions of ECUs; vendors include Vector, ETAS, Elektrobit and silicon vendors’ offerings ${B.co}. Adaptive is typically deployed on Linux or QNX.</p>`,
`<p>Details of AUTOSAR’s full architecture are in Module 07.</p>`)},
{h:'QNX',l:L(`<p>QNX is a very reliable operating system used where failure is not an option — in car instrument clusters, medical devices and industrial machines. It’s built like a fortress of small separate rooms: if one room has a problem, the others keep working.</p>`,
`<p><strong>Architecture</strong>: Neutrino microkernel providing scheduling, IPC (message passing) and memory protection; drivers, file systems and network stacks run as separate user-space processes that can be restarted. POSIX APIs. <strong>Offerings</strong>: QNX OS for Safety (certified to ISO 26262 ASIL D), QNX Hypervisor (including a safety variant), QNX Neutrino RTOS ${B.co} (BlackBerry QNX). <strong>Use cases</strong>: digital clusters, ADAS, gateways, hypervisor base for cockpits. <strong>Strengths</strong>: safety certification, robustness, determinism. <strong>Limitations</strong>: commercial licensing, smaller ecosystem than Linux.</p>`,
`<p>QNX is widely used as the safety foundation underneath richer OSes. NVIDIA’s DriveOS supports both QNX and Linux deployments ${B.co}.</p>${src([['NVIDIA DriveOS','https://www.nvidia.com/en-in/self-driving-cars/software/']])}`,
`<p>QNX’s microkernel isolation principle mirrors what SDV architects want at vehicle scale: small, separately restartable, separately certifiable components.</p>`)},
{h:'Hypervisors, virtual machines and hardware virtualization',l:L(`<p>A hypervisor splits one powerful computer into several pretend computers (virtual machines), each with its own OS. One VM can run Android for music and maps, another runs a safety OS for the speedometer. If Android freezes, the speedometer keeps working.</p>`,
`<p><strong>Type 1 (bare-metal)</strong> hypervisors run directly on hardware — standard in vehicles (e.g., QNX Hypervisor, PikeOS, Green Hills INTEGRITY Multivisor, OpenSynergy COQOS, Xen, ACRN) ${B.co}. <strong>Type 2</strong> run on a host OS — used in development, not production safety contexts.</p><p><strong>Hardware support</strong>: Arm virtualization extensions (EL2 exception level), stage-2 MMU translation, SMMU/IOMMU for device isolation, virtual interrupt controllers, GPU virtualization (hardware-partitioned or mediated). <strong>Device sharing</strong>: VirtIO standard paravirtual devices; pass-through for performance; shared-memory IPC between VMs.</p><p><strong>Trade-offs</strong>: overhead (usually small), complexity of shared devices (GPU, displays, audio), boot-time orchestration (cluster must show in ~2 s while Android boots longer).</p>`,
`<p>The digital cockpit consolidating IVI + cluster + HUD on one SoC is the most common hypervisor use case today ${B.pat}. ADAS consolidation with cockpit on one chip (e.g., single-SoC “cockpit + ADAS”) is emerging ${B.em}.</p>`,
`<p>Hypervisors are the main tool for <strong>mixed criticality</strong> on SoCs; on MCUs the equivalent is AUTOSAR OS memory/timing protection.</p>`)},
{h:'Containers and cloud-native techniques in the vehicle',l:L(`<p>Containers are like shipping boxes for software: everything an app needs is packed inside, so it runs the same anywhere — on a developer laptop, a cloud server or the car.</p>`,
`<p>Containers share the host OS kernel but isolate processes via namespaces and cgroups (Linux) — lighter than VMs, weaker isolation. Images follow OCI standards. In vehicles they suit QM and some higher-integrity application workloads on HPCs, enabling independent app updates and identical cloud/vehicle environments for testing. Orchestration must be lightweight and deterministic — full Kubernetes is generally too heavy and dynamic for embedded targets; vehicle-specific orchestrators (e.g., Eclipse Ankaios) are emerging ${B.em}.</p>`,
`<p>SOAFEE (Arm-led) promotes cloud-native architecture for mixed-criticality edge, and several OEMs use containers for selected applications ${B.em}. Safety-certified container runtimes are an active area, not mainstream.</p>`,
`<p>Containers connect vehicle software to the DevOps pipeline (Module 18): build once, test in cloud (virtual ECUs), deploy OTA.</p>`)},
{h:'Mixed-criticality systems and OS selection criteria',b:stack([['Android Automotive VM|IVI, apps — QM|c','Linux VM|ADAS perception — ASIL B (with safety supervisor)|b','QNX Safety VM|cluster, telltales — ASIL B|g'],['Type-1 hypervisor|spatial & temporal partitioning, VirtIO|v'],['SoC hardware|CPU clusters, GPU, NPU, SMMU|n'],['Safety MCU (separate chip)|AUTOSAR Classic, ASIL D — monitors SoC, safe-state|r']],'Typical mixed-criticality central compute (NOVA CVC). ASIL values illustrative.')+tbl(['Criterion','Questions to ask'],[
['Safety','Is a certified version/evidence available to the required ASIL?'],
['Real-time','What latency/jitter bounds can be guaranteed?'],
['Silicon support','Is there a mature BSP/driver set for the chosen SoC/MCU — for 10–15 years?'],
['Ecosystem','Apps, middleware, AI frameworks, developer availability?'],
['Security','Hardening, secure boot integration, patch cadence?'],
['Licensing & cost','Per-unit royalties, open-source compliance obligations?'],
['Update model','Support for A/B, delta updates, containers?'],
['Boot time','Can it meet rear-camera (regulatory) and cluster start-up targets?'],
])+key(`<p><strong>Vehicle operating system vs automotive OS platform:</strong> a kernel-level OS (QNX, Linux, AUTOSAR OS) manages one processor’s resources. An OEM “vehicle OS” (MB.OS, Pleos, Arene) is a <em>platform</em>: multiple OS kernels, hypervisor, middleware, vehicle APIs, tooling and cloud services — branded as one.</p>`)}
],
